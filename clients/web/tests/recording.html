<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters: a take followed from the page while it records</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12;
                   color: #dddddd; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            max-width: 44rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <div>a take recorded by the engine in this page and followed over
        <code>/buffer_stream</code>: the overview arrives, the samples never
        do.</div>
      <button id="boot">boot + record</button>
      <pre id="log"></pre>
    </main>

    <!--
      The acceptance behind examples/views/recording.html (clients/web/test.sh,
      headless Chrome): ?smoke=1 auto-runs. A `RecordBuf` fills a buffer from
      the audio thread and says nothing; the page subscribes to the *overview*
      of what was written and folds each report into a pyramid it holds. What
      is asserted is the claim the whole path exists for: the reports carried
      the tone the writer measured, they stopped where the writer had got to,
      and once the take was finished the cache the page was told is **byte for
      byte** the cache the samples build — so what a page holds and what a
      mapping host maps are one cache, not two that resemble each other.

      That is also the only shape the assertion has, and the same one the
      Python client uses: neither client reads a summary (the picture over it
      is the GUI host's `waveform` with `fills`), so both check the wire by the
      bytes — `peaks_cache_empty` + `peaks_cache_write_buckets` against
      `peaks_cache`, which is where data-vectors.json's `peaksStream` digest
      comes from.
    -->
    <script type="module">
      import {
        loadOsc, loadCore, pageConnection, server as engine, Server,
        Buffer, OscFunc, Synth, SynthDef, data,
      } from "../dist/index.js";
      import { control, out, recordBuf, sine } from "../dist/defs/index.js";

      const smoke = new URLSearchParams(location.search).has("smoke");
      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // A report's own blob, as the wire carries it: little-endian f32s,
      // bucket-major and channel-minor -- min, max and mean square per bucket.
      // Reading it here is reading the *wire*, not the cache: the client has
      // no view onto a summary, by design, so what a page can check about a
      // report is the report.
      const bucketStats = (blob) => {
        const view = new DataView(blob.buffer, blob.byteOffset, blob.byteLength);
        const out = [];
        for (let i = 0; i + 12 <= blob.byteLength; i += 12) {
          out.push([view.getFloat32(i, true), view.getFloat32(i + 4, true)]);
        }
        return out;
      };
      const sameBytes = (a, b) => {
        if (a.length !== b.length) return `sizes ${a.length} and ${b.length}`;
        let differ = 0;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) differ++;
        return differ === 0 ? "" : `${differ} of ${a.length} bytes differ`;
      };

      const RATE = 48000;
      const BUCKET = 256;
      const FRAMES = BUCKET * 100;      // 0.53 s, a whole number of buckets
      const AMP = 0.5;

      async function run() {
        await loadOsc();
        await loadCore();
        const raw = await engine({ channels: 2 });
        await raw.resume();
        const server = await new Server().attach();

        // A tone recorded into an empty take, and heard while it records:
        // `recordBuf` passes its input through. `doneAction: 2` frees the node
        // at the end of the buffer, which is what stops the frontier moving.
        await new SynthDef("page_recording",
          out(0.0, recordBuf(control("buf", 0.0, "ir"), 0.0,
            sine(220.0).mul(AMP), { doneAction: 2 }))).send(server);
        const take = await Buffer.alloc(FRAMES, 1, { server });
        await server.sync();

        // The picture, before anything is recorded: allocated at the take's
        // full length and empty.
        const stream = await data.RecordingStream.open(server, [take], {
          periodMs: 20, baseBucket: BUCKET,
        });
        const peaks = stream.peaks(take);
        if (!peaks) throw new Error("the stream has no pyramid for the take");
        if (peaks.frames !== FRAMES) {
          throw new Error(`the pyramid spans ${peaks.frames} frames, not ${FRAMES}`);
        }
        const empty = data.Peaks.empty(FRAMES, { channels: 1, baseBucket: BUCKET });
        const emptyDiff = sameBytes(peaks.toBytes(), empty.toBytes());
        if (emptyDiff) throw new Error(`an unrecorded take is not empty: ${emptyDiff}`);
        empty.free();

        // Every report this page receives, kept as it arrived: the assertions
        // below are about the wire, since the summary itself is only ever
        // handed to whatever draws.
        const reports = [];
        new OscFunc((msg) => {
          if (Number(msg[1]) === take.bufnum) {
            reports.push({ start: Number(msg[2]), stats: bucketStats(msg[4]) });
          }
        }, "/buffer_stream.reply", { recv: server.receiver });

        new Synth("page_recording", { buf: take.bufnum }, { server });

        // **It grows while it records, and stops where the writer got to.**
        await sleep(200);
        const growing = stream.written(take);
        if (stream.reports < 5) {
          throw new Error(`only ${stream.reports} reports in 200 ms`);
        }
        if (growing <= 0 || growing >= FRAMES) {
          throw new Error(`written is ${growing} of ${FRAMES} after 200 ms`);
        }
        // What the reports carried: the tone at the amplitude the synth
        // writes, measured at the writer's end and never re-measured here.
        const measured = reports.flatMap((r) => r.stats);
        if (measured.length === 0) throw new Error("no report carried a bucket");
        const peak = Math.max(...measured.map(([, hi]) => hi));
        if (Math.abs(peak - AMP) > 0.02) {
          throw new Error(`the reports read ${peak}, not ~${AMP}`);
        }
        // And no report ran past the frontier the page was told about.
        const last = reports[reports.length - 1];
        if (last.start + last.stats.length * BUCKET > growing) {
          throw new Error("a report covered frames past `written`");
        }
        log(`while recording: ${stream.reports} reports, `
          + `${growing} of ${FRAMES} frames, peak ${peak.toFixed(3)}`);

        // **And the finished picture is the samples' own.** The take runs to
        // the end of its buffer, the node frees itself, and what the page was
        // told is compared against what a build over the samples gives.
        await sleep(800);
        const written = stream.written(take);
        if (written !== FRAMES) {
          throw new Error(`the take stopped at ${written} of ${FRAMES}`);
        }
        await stream.stop();

        // Read back the **whole** take — the carrier sizes the chunks itself —
        // and build the summary the samples give. A bulk read is a
        // different path from this one, and what is compared is the cache
        // itself: same frames, same channels, same base bucket, so the two
        // must be the same bytes. This is the assertion the Python client
        // makes about the same wire (`peaks_cache_empty` +
        // `peaks_cache_write_buckets` against `peaks_cache`, one digest), and
        // it is the only shape a client has for it — neither client reads a
        // summary; they build one and hand it to whatever draws.
        const samples = await take.getSamples();
        if (samples.length !== FRAMES) {
          throw new Error(`read ${samples.length} of ${FRAMES} samples`);
        }
        const built = data.Peaks.build(samples, { channels: 1, baseBucket: BUCKET });
        const diff = sameBytes(peaks.toBytes(), built.toBytes());
        if (diff) {
          throw new Error(`the told summary differs from the read one: ${diff}`);
        }
        if (Math.max(...samples.map(Math.abs)) === 0) {
          throw new Error("the read-back samples are silent: nothing was recorded");
        }

        stream.free();
        built.free();
        take.free();
        verdict(`PASS: ${stream.reports} reports summarized ${FRAMES} frames while `
          + `they recorded (peak ${peak.toFixed(3)}), and the told cache is byte `
          + "for byte the one the samples read back build");
      }

      document.getElementById("boot").onclick = () =>
        run().catch((err) => verdict(`FAIL: ${err}`));
      if (smoke) run().catch((err) => verdict(`FAIL: ${err}`));
    </script>
  </body>
</html>
