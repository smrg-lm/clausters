<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters editor views over the in-page carrier</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12;
                   color: #dddddd; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            max-width: 44rem; white-space: pre-wrap; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div>the editor views, host-drawn: a buffer loaded into the engine in
        this page, shown as a <code>waveform</code> and a
        <code>spectrogram</code> pulling their samples over the host's own
        client leg, with a transport that plays, pauses and stops it.</div>
      <button id="boot">boot + open</button>
      <pre id="log"></pre>
    </main>

    <!--
      The acceptance behind examples/views/editor.html (clients/web/test.sh, headless
      Chrome): ?smoke=1 auto-runs. A decoded file reaches a server buffer
      through `Buffer.load` (fetch + decodeAudioData + the carrier's bulk
      install), the host draws it from `buffer:` -- which makes it fetch the
      samples with /buffer_query + /buffer_getRange over its client leg -- and
      captures the window into the page's storage, read back as a PNG of the
      window's size with something drawn in it; then the transport
      is asserted **audibly** on an analyser: silent, then sounding under play,
      silent again under pause with the node still in the tree, sounding after
      resume, and gone after stop.
    -->
    <script type="module">
      import {
        loadCore, server as engine, Server,
        Buffer, Synth, SynthDef, GuiHost, gui,
      } from "../dist/index.js";
      import { bufRateScale, bufRd, control, out, phasor, playBuf } from "../dist/defs/index.js";

      const smoke = new URLSearchParams(location.search).has("smoke");
      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      /**
       * A WAV the page builds and serves to itself as an object URL: the
       * example takes a file from an <input>, and a headless run has none.
       * What is under test is the path a real file takes -- fetch, decode,
       * install -- not where the bytes came from.
       */
      function wavUrl({ frames = 192000, rate = 48000, hz = 220 } = {}) {
        const bytes = new ArrayBuffer(44 + frames * 2);
        const view = new DataView(bytes);
        const ascii = (at, text) => {
          for (let i = 0; i < text.length; i++) view.setUint8(at + i, text.charCodeAt(i));
        };
        ascii(0, "RIFF"); view.setUint32(4, 36 + frames * 2, true); ascii(8, "WAVE");
        ascii(12, "fmt "); view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        ascii(36, "data"); view.setUint32(40, frames * 2, true);
        for (let i = 0; i < frames; i++) {
          const s = Math.sin((2 * Math.PI * hz * i) / rate) * 0.8;
          view.setInt16(44 + i * 2, Math.round(s * 32767), true);
        }
        return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
      }

      /**
       * A capture read back out of the page's storage: its size from the
       * header, and how many colors its pixels hold -- the host writes its
       * PNGs uncompressed, so the scanlines are the stored blocks' bytes.
       */
      async function readPng(path) {
        let dir = await navigator.storage.getDirectory();
        const parts = path.split("/").filter((p) => p.length > 0);
        const name = parts.pop();
        for (const part of parts) dir = await dir.getDirectoryHandle(part);
        const bytes = new Uint8Array(
          await (await (await dir.getFileHandle(name)).getFile()).arrayBuffer());
        const view = new DataView(bytes.buffer);
        const signature = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
        if (!signature.every((b, i) => bytes[i] === b)) throw new Error(`${path} is no PNG`);
        let at = 8, width = 0, height = 0;
        const idat = [];
        while (at < bytes.length) {
          const len = view.getUint32(at);
          const kind = String.fromCharCode(...bytes.slice(at + 4, at + 8));
          if (kind === "IHDR") {
            width = view.getUint32(at + 8);
            height = view.getUint32(at + 12);
          }
          if (kind === "IDAT") idat.push(bytes.subarray(at + 8, at + 8 + len));
          at += 12 + len;
        }
        const z = new Uint8Array(idat.reduce((n, part) => n + part.length, 0));
        idat.reduce((n, part) => (z.set(part, n), n + part.length), 0);
        const raw = new Uint8Array((width * 4 + 1) * height);
        for (let i = 2, filled = 0; ;) {
          const last = z[i] & 1;
          const n = z[i + 1] | (z[i + 2] << 8);
          raw.set(z.subarray(i + 5, i + 5 + n), filled);
          filled += n;
          i += 5 + n;
          if (last) break;
        }
        const colors = new Set();
        const row = width * 4 + 1;
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const p = y * row + 1 + x * 4;
            colors.add((raw[p] << 16) | (raw[p + 1] << 8) | raw[p + 2]);
          }
        }
        return { width, height, colors: colors.size };
      }

      async function run() {
        const server = await new Server().boot();
        // The engine this handle booted -- its own, not the page's.
        const raw = server.engine;
        if (raw.context.state !== "running") {
          throw new Error(`context did not run: ${raw.context.state}`);
        }
        // The transport's assertions are about sound, not about messages.
        const analyser = raw.context.createAnalyser();
        analyser.fftSize = 2048;
        raw.node.connect(analyser);
        const bins = new Float32Array(analyser.fftSize);
        // Settle first, then measure. The analyser holds ~43 ms of history, so
        // a peak taken across the whole window still carries the sound from
        // before a pause; what each assertion asks is "is it sounding *now*".
        const peak = async (ms) => {
          await sleep(ms);
          let top = 0;
          for (let i = 0; i < 3; i++) {
            await sleep(25);
            analyser.getFloatTimeDomainData(bins);
            for (const v of bins) top = Math.max(top, Math.abs(v));
          }
          return top;
        };

        const host = await new GuiHost({ engine: server.engine }).boot();

        // ---- the file, into a server buffer ----
        const url = wavUrl();
        const buffer = await Buffer.load(url, { server });
        URL.revokeObjectURL(url);
        if (buffer.frames < 100000 || buffer.channels !== 1) {
          throw new Error(`unexpected buffer: ${JSON.stringify(buffer)}`);
        }
        log(`loaded ${buffer.frames} frames, ${buffer.channels} ch `
          + `at ${buffer.sampleRate} Hz into buffer ${buffer.bufnum}`);

        // The samples really landed: read them back out of the engine.
        const read = await buffer.getSamples({ start: 0, count: 2048 });
        const loudest = Math.max(...read.map(Math.abs));
        if (loudest < 0.5) throw new Error(`the buffer is silent (${loudest})`);
        log(`read back ${read.length} samples, peak ${loudest.toFixed(3)}`);

        // ---- the player def and the window ----
        const buf = control("buf", 0.0);
        const rate = bufRateScale(buf);
        await new SynthDef("editor_test_player",
          out(0.0, playBuf(buf, 0.0, rate, 0.0).mul(0.8)),
          out(1.0, playBuf(buf, 0.0, rate, 0.0).mul(0.8))).send(server);
        await server.sync();

        const win = host.open(gui.view(
          { title: "editor", w: 800, h: 560, layout: "col", gap: 8.0 },
          gui.waveform({ name: "wave", buffer: buffer.bufnum,
                         channels: buffer.channels, sampleRate: buffer.sampleRate,
                         ruler: "time", link: 1 }),
          gui.spectrogram({ name: "stft", buffer: buffer.bufnum,
                            channels: buffer.channels, sampleRate: buffer.sampleRate,
                            windowSize: 1024, link: 1, h: 180 }),
        ));
        await sleep(900);   // the host fetches the buffer over its client leg

        const wave = await win.widget("wave").query();
        if (wave.type !== "signal" || wave.props.buffer !== buffer.bufnum) {
          throw new Error(`unexpected view: ${JSON.stringify(wave)}`);
        }
        log(`the host holds ${wave.type}/${wave.props.view} on buffer ${wave.props.buffer}`);

        // ---- the window's picture, into the page's storage ----
        const shot = await host.capture(win, "/captures/editor.png");
        const picture = await readPng(shot);
        if (picture.width < 100 || picture.height < 100) {
          throw new Error(`a capture of ${picture.width}x${picture.height}`);
        }
        if (picture.colors < 16) {
          throw new Error(`the capture holds ${picture.colors} colors: nothing drawn`);
        }
        log(`captured ${picture.width}x${picture.height} into ${shot}, `
          + `${picture.colors} colors`);

        // ---- the transport, asserted on the analyser ----
        const silent = await peak(150);
        if (silent > 0.01) throw new Error(`not silent before play (${silent})`);

        const anchor = await raw.clock();
        const voice = new Synth("editor_test_player", { buf: buffer.bufnum }, { server });
        win.widget("wave").set({ playhead_at: anchor });
        win.widget("stft").set({ playhead_at: anchor });
        const playing = await peak(200);
        if (playing < 0.1) throw new Error(`silent under play (${playing})`);

        // Pause is /node_run 0: the node stays in the tree, with its position.
        voice.pause();
        await sleep(80);
        const pausedPeak = await peak(150);
        if (pausedPeak > 0.01) throw new Error(`still sounding when paused (${pausedPeak})`);
        const node = await voice.info();
        if (node.defname !== "editor_test_player") {
          throw new Error(`the paused node left the tree: ${JSON.stringify(node)}`);
        }

        voice.resume();
        const resumed = await peak(200);
        if (resumed < 0.1) throw new Error(`silent after resume (${resumed})`);

        voice.free();
        await server.sync();
        const stopped = await peak(150);
        if (stopped > 0.01) throw new Error(`still sounding after stop (${stopped})`);
        const tree = await server.queryTree();
        if (tree.children.length !== 0) {
          throw new Error(`${tree.children.length} node(s) left in the tree`);
        }

        // The selection player the example's "play selection" button uses: a
        // Phasor looping between the bounds, read by BufRd.
        const rbuf = control("buf", 0.0);
        const phase = phasor(0.0, bufRateScale(rbuf), control("start", 0.0),
                             control("end", 1.0), control("start", 0.0));
        await new SynthDef("editor_test_region",
          out(0.0, bufRd(rbuf, 0.0, phase).mul(0.8)),
          out(1.0, bufRd(rbuf, 0.0, phase).mul(0.8))).send(server);
        await server.sync();
        const region = new Synth("editor_test_region", {
          buf: buffer.bufnum, start: 24000, end: 72000,
        }, { server });
        const looping = await peak(200);
        if (looping < 0.1) throw new Error(`the selection is silent (${looping})`);
        region.free();
        await server.sync();

        verdict(`PASS: buffer ${buffer.bufnum} loaded, drawn and captured, transport `
          + `play ${playing.toFixed(2)} -> pause ${pausedPeak.toFixed(2)} `
          + `-> resume ${resumed.toFixed(2)} -> stop ${stopped.toFixed(2)}, `
          + `selection ${looping.toFixed(2)}`);
      }

      document.getElementById("boot").onclick = () =>
        run().catch((err) => verdict(`FAIL: ${err}`));
      if (smoke) run().catch((err) => verdict(`FAIL: ${err}`));
    </script>
  </body>
</html>
