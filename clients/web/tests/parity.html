<!doctype html>
<!-- Wasm render parity: loads the wasm engine, renders the fixture scores and
     compares the samples against the native render of the same bytes (written
     by `cargo run -p clausters-web --example gen_parity`).

     Scripted harness: `scripts/parity-web.sh` serves clients/web/ and reads
     the verdict from the DOM under headless Chrome. Manual run: build with
     ./build.sh, generate the fixtures, then
       python3 -m http.server   and open /tests/parity.html.

     Two scenes, and they ask different questions.

     `score.bin` is a UGen-graph score: the same Rust DSP compiled twice, so
     the only thing between the two renders is the libm each target links. The
     comparison mirrors tests/golden.rs's cross-platform posture — renders on
     one platform are bit-identical, but native (system libm) and wasm (Rust's
     libm) round transcendentals a few ULP apart, so the bar is a tolerance
     (1e-6: well above the observed 1-ULP deltas, well below any DSP bug).

     `score-faust.bin` sends a **FaustDef**, and there the DSP itself is
     generated by two different Faust backends from one source: LLVM natively,
     `-lang wasm-e` in the page. So this one says whether a Faust def *means*
     the same thing in a tab as in a window — and it goes through the client's
     own `renderScoreBytes`, not the raw wasm entry point, because a page's
     render has to compile and link the score's defs before it starts and that
     pre-pass is exactly what is under test. Its bar is its own and is
     measured, not inherited: see FAUST_BAR. -->
<html lang="en">
<head><meta charset="utf-8"><title>clausters wasm parity</title></head>
<body>
<pre id="result">running…</pre>
<script type="module">
const out = document.getElementById("result");
// Beaconed, not left in the DOM for a dump to read: the Faust scene compiles
// in a Worker, and Chrome's virtual time does not wait for one -- the same
// reason every other page in this suite reports through the access log.
const verdict = (text) => {
    out.textContent = text;
    document.title = text.split("\n")[0];
    fetch(`/parity-verdict-${encodeURIComponent(text)}`).catch(() => {});
};
try {
    const { abi_version } = await import("../dist/engine/clausters_web.js");
    const { renderScoreBytes, loadRenderer } = await import("../dist/engine/render.js");
    await loadRenderer();
    const SAMPLE_RATE = 48000, CHANNELS = 2;
    // Pinned on both sides: a render is a fresh take unless told otherwise,
    // and a fixture comparison is the case that wants the same one twice.
    // Must match PARITY_SEED in examples/gen_parity.rs.
    const PARITY_SEED = 0x5041524954590001n;

    // >> the observed 1-ULP libm deltas, << any DSP bug.
    const TOLERANCE = 1e-6;
    // The Faust scene's own bar, and it is wider on purpose. Two Faust
    // backends compute a resonant filter's coefficients from the same formula
    // through different roundings, and a recursion turns that into phase drift
    // that grows with the take: measured over half a second the fifths run
    // 2.3e-6 5.6e-6 2.4e-5 4.8e-5 7.2e-5 -- smooth growth, which is what drift
    // looks like. A wrong constant, a mis-read control offset or a different
    // operator lands as a *step* instead, and the profile printed beside the
    // maximum is what tells them apart. So the bar is the drift's own order
    // with room over it, not a number chosen to make today pass.
    const FAUST_BAR = 1e-4;

    /** Renders one fixture and reports how far it landed from the native take. */
    async function compare(scoreName, takeName, bar) {
        const score = new Uint8Array(
            await (await fetch(`./${scoreName}.bin`)).arrayBuffer());
        const nativeBytes = await (await fetch(`./${takeName}.f32`)).arrayBuffer();
        const nativeBits = new Uint32Array(nativeBytes);
        const nativeF = new Float32Array(nativeBytes);
        const { samples } = await renderScoreBytes(
            score, SAMPLE_RATE, CHANNELS, PARITY_SEED);
        const bits = new Uint32Array(samples.buffer, samples.byteOffset, samples.length);
        if (bits.length !== nativeBits.length) {
            return { ok: false, line: `${scoreName}: length ${bits.length} vs native ${nativeBits.length}` };
        }
        let exact = 0, maxDelta = 0, worst = -1;
        for (let i = 0; i < bits.length; i++) {
            if (bits[i] === nativeBits[i]) { exact++; continue; }
            const d = Math.abs(samples[i] - nativeF[i]);
            if (!(d <= maxDelta)) { maxDelta = d; worst = i; }
        }
        // Where the difference is, not only how big: a recursive filter drifts
        // in phase and the profile grows smoothly, while a wrong constant or a
        // mis-read control lands as a step. The two are not the same finding.
        const parts = 5, span = Math.floor(bits.length / parts), profile = [];
        for (let p = 0; p < parts; p++) {
            let m = 0;
            for (let i = p * span; i < (p + 1) * span; i++) {
                const d = Math.abs(samples[i] - nativeF[i]);
                if (!(d <= m)) m = d;
            }
            profile.push(m.toExponential(1));
        }
        const line = `${scoreName}: ${exact}/${bits.length} bit-exact, max |delta| ${maxDelta}`
            + (worst >= 0 ? ` at sample ${worst}` : "")
            + ` [fifths ${profile.join(" ")}]`;
        return { ok: Number.isFinite(maxDelta) && maxDelta <= bar, line };
    }

    const graph = await compare("score", "native", TOLERANCE);
    const faust = await compare("score-faust", "native-faust", FAUST_BAR);
    const stats = `${graph.line} | ${faust.line} (ABI v${abi_version()})`;
    verdict(graph.ok && faust.ok ? `PASS: ${stats}` : `FAIL: ${stats}`);
} catch (e) {
    verdict(`FAIL: ${e}`);
}
</script>
</body>
</html>
