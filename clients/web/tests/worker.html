<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters worker session</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12;
                   color: #dddddd; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            max-width: 44rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <div>a session in a worker, on this page's engine: it plays, loads a
        buffer, renders offline and runs a routine, then loops forever and is
        terminated with the engine still running.</div>
      <button id="boot">start the worker</button>
      <pre id="log"></pre>
    </main>

    <!--
      The worker-session acceptance (clients/web/test.sh, headless Chrome).
      The page boots the engine and hands a worker a link to it
      (`ClaustersServer.link`); the worker's half is tests/worker-session.js.
      What it shows is what a unit test cannot: that what the worker plays is
      heard on the page's engine, and that terminating a worker stuck in a
      loop leaves that engine running and answering. ?smoke=1 auto-runs; the
      verdict is beaconed as a fetch and read from the access log.
    -->
    <script type="module">
      import { Server, portConnection, server } from "../dist/index.js";

      const smoke = new URLSearchParams(location.search).has("smoke");
      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      async function run() {
        const audio = await server({ channels: 2 });
        await audio.resume();
        const analyser = audio.context.createAnalyser();
        analyser.fftSize = 2048;
        audio.node.connect(analyser);
        const frame = new Float32Array(analyser.fftSize);
        const peak = () => {
          analyser.getFloatTimeDomainData(frame);
          let p = 0;
          for (const s of frame) p = Math.max(p, Math.abs(s));
          return p;
        };

        // A link closed before anyone opens it: the port says so.
        const early = audio.link();
        early.close();
        const refused = await portConnection(early.port, { timeout: 2 })
          .then(() => false, () => true);
        log(`a closed link refuses a connection: ${refused}`);

        const worker = new Worker("./worker-session.js", { type: "module" });
        const link = audio.link();
        const results = await new Promise((resolve, reject) => {
          let found = null;
          worker.onerror = (event) => reject(new Error(event.message));
          worker.onmessage = async (event) => {
            const msg = event.data;
            if (msg.type === "log") log(`worker: ${msg.line}`);
            else if (msg.type === "error") reject(new Error(msg.message));
            else if (msg.type === "measure") {
              let p = 0;
              for (let i = 0; i < 6; i++) { await wait(60); p = Math.max(p, peak()); }
              worker.postMessage({ type: "peak", value: p });
            } else if (msg.type === "results") found = msg;
            else if (msg.type === "looping") resolve(found);
          };
          worker.postMessage({ type: "link", port: link.port }, [link.port]);
        });

        // The worker is in `for (;;) {}` now: only terminating it stops it.
        await wait(200);
        worker.terminate();
        link.close();

        // The engine is still the page's, and still answers.
        const handle = await new Server({ engine: audio }).attach({ adoptDefault: false });
        const info = await handle.queryInfo();
        handle.panic();
        const alive = info.nominalSampleRate > 0;
        log(`after the worker was terminated the engine answers: ${alive}`);
        handle.close();

        // A client of the engine hears when the engine closes.
        const watcher = await portConnection(audio.link().port);
        const before = watcher.gone();
        await audio.close();
        await wait(100);
        const told = !before && watcher.gone();
        log(`a client hears that the engine closed: ${told}`);

        const ok = refused && alive && told && results !== null
          && results.synthPeak > 0.05 && results.loaded
          && results.renderPeak > 0.1 && results.routinePeak > 0.05;
        verdict(ok
          ? `PASS: a session in a worker played on the page's engine (synth `
            + `${results.synthPeak.toFixed(3)}, routine ${results.routinePeak.toFixed(3)}), `
            + `loaded a buffer, rendered offline (${results.renderPeak.toFixed(3)}), and `
            + `was terminated in a loop with the engine still answering`
          : `FAIL: refused=${refused} alive=${alive} told=${told} results=${JSON.stringify(results)}`);
      }

      document.getElementById("boot").onclick = () =>
        run().catch((err) => verdict(`FAIL: ${err}`));
      if (smoke) run().catch((err) => verdict(`FAIL: ${err}`));
    </script>
  </body>
</html>
