<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters disk streaming</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12;
                   color: #dddddd; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            max-width: 44rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <div><code>diskOut</code> and <code>diskIn</code> in a tab: a take is
        recorded straight into the page's own filesystem while it plays, and
        then streamed back out of it -- neither ever holding the whole thing.
        The reader is the NRT worker handing spans across a port, where a
        native server has a thread sharing a ring.</div>
      <button id="boot">record, then stream it back</button>
      <pre id="log"></pre>
    </main>

    <!--
      The disk-streaming acceptance (clients/web/test.sh, headless Chrome):
      ?smoke=1 auto-runs. It records a tone through diskOut into OPFS, checks
      the file is a valid WAV of about the right length, then plays it back
      through diskIn and asserts the bus carries the tone rather than silence.
      That last part is the one that matters: it is the only thing that says
      the spans crossed the port and landed in the ring in time. Then it streams
      from a start frame: half way in it sounds, past the end it is silent.
      Last, a join whose parts name two files plays at the transport's position
      through transportDiskIn: every sample the bus carries is a frame of one
      of the two files (or the silence of a refill), both files are heard, and
      a locate under the moving playhead keeps it so. Then the long-file
      containers: diskOut records into a W64, read back, and buffer.write
      writes an RF64 that
      Buffer.read reads back sample for sample. Mid-take, the recording is
      already a sound file of what it holds: a run is written where the body
      ends and the header again, so the worker never holds the take. Last,
      an offline render in a Worker of its own reads the two files as a list
      and writes its own file and peaks: the list is there from its first
      frame, and the live engine goes on streaming one of the files beside it.
    -->
    <script type="module">
      import { Session, opfs, loadCore, SynthDef, Synth, Group, Bus, Buffer, data,
        OscNrtInterface, renderScore } from "../dist/index.js";
      import { diskIn, diskOut, out, sine, transportDiskIn } from "../dist/defs/index.js";

      const smoke = new URLSearchParams(location.search).has("smoke");
      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      async function run() {
        const PATH = "takes/streamed.wav";
        // a server records into a directory that is there, as on a disk
        await opfs.makeDirectory("takes");
        const session = await Session.embed();
        const server = session.server;

        // 1) Record: a tone written into the page's own filesystem while it
        //    plays, on a bus of its own so a headless run makes no noise.
        const recBus = Bus.audio(1, { server });
        await new SynthDef("rec",
          out(recBus.index, diskOut(sine(440).mul(0.5), { path: PATH, format: "float" }))).send(server);
        const recording = new Synth("rec", {}, { server });
        // Mid-take the file is a sound file of what is written so far: each
        // run lands where the body ends and the header is written again, so
        // a reader -- the host, a second stream -- finds a whole file.
        // The first run lands once a span is recorded, after the stream's
        // start, so the page waits for it rather than for a fixed time.
        let midSize = 0;
        let midData = 0;
        let midHead = 0;
        for (let waited = 0; waited < 1200 && midData === 0; waited += 100) {
          await wait(100);
          if (!(await opfs.exists(PATH))) continue;
          // the header first: it is written after the run it counts, so the
          // size read after it covers it, while another run may land
          // between a size read first and the header
          // the data chunk wherever the header puts it: a WAV written here
          // keeps an RF64's room before its format
          const head = await opfs.readRange(PATH, 0, 128);
          const at = [...head.keys()].find((i) =>
            String.fromCharCode(...head.subarray(i, i + 4)) === "data");
          midHead = at === undefined ? 0 : at + 8;
          midData = at === undefined || head.byteLength < at + 8
            ? 0 : new DataView(head.buffer, head.byteOffset).getUint32(at + 4, true);
          midSize = await opfs.sizeOf(PATH);
        }
        const midTake = await Buffer.read(PATH, { server });
        const midFrames = midTake.frames;
        midTake.free();
        log(`mid-take: ${midSize} bytes, header says ${midData} of data, read back ${midFrames} frames`);
        const midOk = midData > 0 && midData <= midSize - midHead && midFrames > 0;
        await wait(700);
        recording.free();
        // The final flush is owed to the stream being gone; give the worker a
        // turn to write it.
        await wait(500);

        const size = await opfs.sizeOf(PATH);
        const head = await opfs.readRange(PATH, 0, 4);
        const riff = String.fromCharCode(...head);
        const frames = (size - (midHead || 44)) / 4;
        log(`wrote ${PATH}: ${size} bytes, ${riff}, ~${(frames / 48000).toFixed(2)} s`);

        // 2) Stream it back and measure the bus it lands on. This is the part
        //    that matters: it is the only thing that says the spans crossed
        //    the port and reached the ring before the audio thread wanted them.
        const playBus = Bus.audio(1, { server });
        await new SynthDef("play",
          out(playBus.index, diskIn(0, { path: PATH, loop: true }))).send(server);
        const playing = new Synth("play", {}, { server });
        // A stream starts after a longer lead here than natively: the first
        // span has to be asked for, read, decoded and moved across a port --
        // and how long that takes is the browser's, so the page waits for the
        // sound rather than for a fixed time (one browser under load missed a
        // fixed 1.2 s and read silence), up to a bound that says it never came.
        const taps = await data.TapStream.open(server, [playBus.index],
          { frames: 1024, periodMs: 20 });
        let peak = 0;
        for (let waited = 0; waited < 5000 && peak <= 0.1; waited += 100) {
          await wait(100);
          const window = taps.window(playBus.index);
          peak = window ? Math.max(...window.samples.map(Math.abs)) : 0;
        }
        playing.free();
        log(`streamed back: peak ${peak.toFixed(3)} on bus ${playBus.index}`);

        // 3) From a start frame: half way in, the take still sounds; past its
        //    end, a stream that does not loop has nothing to read and stays
        //    silent -- which only holds if the first read was from there.
        const level = async (start) => {
          const name = `from${start}`;
          await new SynthDef(name,
            out(playBus.index, diskIn(0, { path: PATH, start }))).send(server);
          const from = new Synth(name, {}, { server });
          let top = 0;
          for (let waited = 0; waited < 2000 && top <= 0.1; waited += 100) {
            await wait(100);
            const window = taps.window(playBus.index);
            top = window ? Math.max(...window.samples.map(Math.abs)) : 0;
          }
          from.free();
          await wait(200);
          return top;
        };
        const half = await level(Math.floor(frames / 2));
        const past = await level(Math.floor(frames) + 48000);
        log(`from half way: peak ${half.toFixed(3)}; from past the end: peak ${past.toFixed(3)}`);

        // 4) A join of two files at the transport's position. Each file holds
        //    one value, so every sample the bus carries says which file it
        //    came from -- or that a refill was still on its way.
        const constant = (value) => {
          const n = 48000;
          const bytes = new Uint8Array(44 + n * 4);
          const view = new DataView(bytes.buffer);
          const ascii = (at, text) => [...text].forEach((c, i) => (bytes[at + i] = c.charCodeAt(0)));
          ascii(0, "RIFF"); view.setUint32(4, 36 + n * 4, true); ascii(8, "WAVE");
          ascii(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 3, true);
          view.setUint16(22, 1, true); view.setUint32(24, 48000, true);
          view.setUint32(28, 48000 * 4, true); view.setUint16(32, 4, true);
          view.setUint16(34, 32, true); ascii(36, "data"); view.setUint32(40, n * 4, true);
          for (let i = 0; i < n; i++) view.setFloat32(44 + i * 4, value, true);
          return bytes;
        };
        await opfs.writeFile("takes/a.wav", constant(0.25));
        await opfs.writeFile("takes/b.wav", constant(-0.5));
        const join = await Buffer.stitch([
          { source: "takes/a.wav", start: 0, frames: 12000 },
          { source: "takes/b.wav", start: 6000, frames: 12000 },
          { source: "takes/a.wav", start: 24000, frames: 12000 },
        ], { channels: 1, server });
        const named = (await join.parts()).map((p) => p.source).join(",");
        await new SynthDef("list",
          out(playBus.index, transportDiskIn(join.bufnum, 0, 0, 0, 1))).send(server);
        // The engine's transport rolls what a bound group holds.
        const governed = new Group({ server });
        await server.setTransport(0, 2.0);
        await server.transportGroup(governed);
        await server.transportPlay();
        const list = new Synth("list", {}, { target: governed, server });
        const heard = new Set();
        const foreign = [];
        const listen = async (ms) => {
          for (let waited = 0; waited < ms; waited += 40) {
            await wait(40);
            const window = taps.window(playBus.index);
            for (const v of window ? window.samples : []) {
              if (v === 0.25 || v === -0.5) heard.add(v);
              else if (v !== 0) foreign.push(v);
            }
          }
        };
        await listen(1500);
        await server.transportLocateSample(18000);
        await listen(1000);
        // A list replaced while it plays -- the join stitched again, as an
        // edit does -- fades from the old into the new one rather than going
        // silent while the new one is read.
        const longest = { zeros: 0 };
        const watch = async (ms) => {
          for (let waited = 0; waited < ms; waited += 20) {
            await wait(20);
            const window = taps.window(playBus.index);
            let run = 0;
            for (const v of window ? window.samples : []) {
              run = v === 0 ? run + 1 : 0;
              longest.zeros = Math.max(longest.zeros, run);
            }
          }
        };
        await server.transportLocateSample(0);
        await watch(150);
        longest.zeros = 0;
        await watch(150);
        const quiet = longest.zeros;
        longest.zeros = 0;
        const raw = (path, start) => [["s", path], ["i", start], ["i", 12000], ["i", 0], ["i", 0],
          ["i", 0], ["f", 0], ["i", 0], ["f", 0], ["i", 0]];
        await server.command("/buffer_stitch", [["i", join.bufnum], ["i", 1], ["f", 0],
          ...raw("takes/b.wav", 0), ...raw("takes/a.wav", 0), ...raw("takes/b.wav", 12000)]);
        await watch(250);
        const replaced = longest.zeros;
        list.free();
        await server.transportStop();
        governed.free();
        log(`join of two files: heard ${[...heard].join(" and ")}, ${foreign.length} foreign samples; parts ${named}; ` +
            `replaced while it played, the longest silence ${replaced} samples`);
        const joined = heard.size === 2 && foreign.length === 0 &&
          named === "takes/a.wav,takes/b.wav,takes/a.wav" && replaced <= 4;

        // 5) The long-file containers. A W64 recorded, then read back as a
        //    buffer; an RF64 written from a buffer and read back.
        const tone = sine(330).mul(0.5);
        await new SynthDef("long",
          out(recBus.index, diskOut(tone, { path: "takes/long.w64", format: "float" }))).send(server);
        const long = new Synth("long", {}, { server });
        await wait(700);
        long.free();
        await wait(600);
        const w64 = await Buffer.read("takes/long.w64", { server });
        const w64Head = String.fromCharCode(...(await opfs.readRange("takes/long.w64", 0, 4)));
        const w64Peak = Math.max(...(await w64.getSamples({ start: 0, count: Math.min(w64.frames, 4800) })).map(Math.abs));
        await w64.write("takes/back.rf64", { sampleFormat: "float" });
        const rf64 = await Buffer.read("takes/back.rf64", { server });
        const rf64Head = String.fromCharCode(...(await opfs.readRange("takes/back.rf64", 0, 4)));
        // A write is a run at a time into the file, so it reads back sample
        // for sample however many runs it took.
        const wrote = await w64.getSamples({ start: 0, count: w64.frames });
        const back = await rf64.getSamples({ start: 0, count: rf64.frames });
        const same = wrote.length === back.length && wrote.every((v, i) => v === back[i]);
        log(`W64 "${w64Head}" of ${w64.frames} frames at peak ${w64Peak.toFixed(3)}; ` +
            `RF64 "${rf64Head}" of ${rf64.frames} frames`);
        const longOk = w64Head === "riff" && w64.frames > 24000 && w64Peak > 0.45 &&
          rf64Head === "RF64" && rf64.frames === w64.frames && same;

        // 6) An offline render that reads the two files as a list and writes
        //    its own file, run in a Worker of its own: the list is read from
        //    its first frame (a stream reads inside the block that needs it).
        const reader = transportDiskIn(1, 0, 0, 0, 0);
        const listDef = new SynthDef("rendered", out(0, reader));
        const s = (v) => ["s", v];
        const i = (v) => ["i", v];
        const f = (v) => ["f", v];
        const part = (path) => [s(path), i(0), i(12000), i(0), i(0), i(0), f(0), i(0), f(0), i(0)];
        const nrt = new OscNrtInterface();
        nrt.addBundle(0, [
          { addr: "/buffer_stitch", args: [i(1), i(1), f(48000), ...part("takes/a.wav"), ...part("takes/b.wav")] },
          { addr: "/def_send", args: [s("synth"), s(listDef.dumpDef())] },
          { addr: "/group_new", args: [i(100), i(1), i(0)] },
          { addr: "/transport_group", args: [i(0), i(100)] },
          { addr: "/transport_play", args: [i(0)] },
          { addr: "/synth_new", args: [s("rendered"), i(1000), i(0), i(100)] },
        ]);
        nrt.addBundle(0.5, [{ addr: "/node_free", args: [i(1000)] }]);
        // The live engine streams the same file while the render reads it:
        // neither locks it from the other.
        const liveDef = new SynthDef("alongside", out(playBus.index, diskIn(0, { path: "takes/a.wav", loop: true })));
        await liveDef.send(server);
        const alongside = new Synth("alongside", {}, { server });
        const sounding = async () => {
          let top = 0;
          for (let waited = 0; waited < 3000 && top <= 0.1; waited += 100) {
            await wait(100);
            const window = taps.window(playBus.index);
            top = window ? Math.max(...window.samples.map(Math.abs)) : 0;
          }
          return top;
        };
        const before = await sounding();
        const renderedStats = await renderScore(nrt.score.bytes(),
          { sampleRate: 48000, channels: 1, path: "takes/rendered.wav" });
        const livePeak = Math.min(before, await sounding());
        alongside.free();
        const renderedBuf = await Buffer.read("takes/rendered.wav", { server });
        const rendered = await renderedBuf.getSamples({ start: 0, count: renderedBuf.frames });
        const renderedOk = renderedStats.frames === 24000 && rendered.length === 24000 &&
          rendered.slice(0, 12000).every((v) => v === 0.25) &&
          rendered.slice(12000).every((v) => v === -0.5) &&
          livePeak > 0.1;
        log(`rendered a list of two files: ${rendered.length} frames, first ${rendered[0]}, ` +
            `at the seam ${rendered[12000]}, the same file streamed live at ${livePeak}`);

        const ok = riff === "RIFF" && frames > 24000 && peak > 0.1 && half > 0.1 && past < 0.01 &&
          joined && longOk && midOk && renderedOk;
        verdict(ok
          ? `PASS: diskOut recorded ${(frames / 48000).toFixed(2)} s into the page's ` +
            `filesystem (${size} bytes of RIFF) and diskIn streamed it back at ` +
            `peak ${peak.toFixed(3)}, read back whole mid-take, and from a start frame where it was asked to; ` +
            `a join of two files played at the transport's position, through a locate; ` +
            `a W64 and an RF64 written and read back; an offline ` +
            `render read a list of two files from its first frame and wrote its file`
          : `FAIL: riff "${riff}", ${frames} frames, mid-take ${midSize} bytes, ${midData} in the header, ${midFrames} frames read, peak ${peak}, from half ${half}, from past ${past}, ` +
            `join heard ${[...heard]} with ${foreign.length} foreign (${foreign.slice(0, 4)}), parts ${named}, replaced with a silence of ${replaced} (${quiet} unreplaced), ` +
            `long files ${longOk}, rendered ${renderedOk}`);
        await session.close();
      }

      document.getElementById("boot").onclick = () => run().catch(
        (e) => verdict(`FAIL: ${e && e.message ? e.message : e}`));
      if (smoke) {
        addEventListener("load", () => run().catch(
          (e) => verdict(`FAIL: ${e && e.message ? e.message : e}`)));
      }
    </script>
  </body>
</html>
