<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>clausters: an application's window in a page</title>
  </head>
  <body>
    <div id="stage" style="width: 800px; height: 400px"></div>
    <pre id="log"></pre>
    <!--
      An application's window in a page (clients/web/test.sh, headless,
      served isolated: `app-window.html?isolated`). The host appends a canvas
      of its own for an application's window, and that canvas is the
      window's, as an OS window is natively: it opens at the size the window
      declares (the audio editor's 1000 x 520; it was a fixed 480 x 420,
      which crushed the editor), laid out at the page's density, which only
      the host can read for it. Two presses over the take then measure the
      body that shows it, in CSS pixels, and it lies inside the canvas.
      Chrome skews a synthetic event's position under a forced display
      scale, so the press at a fractional density is checked with real input
      instead (a press at 1.25 used to land a fifth short of its mark).
      Last, a second editor opened with a `stage` draws in that element, at
      its box, and leaves no canvas of its own on the page (it used to open
      below the page and leave the stage empty).
      Verdict beaconed as a fetch, read from the access log.
    -->
    <script type="module">
      import { Event, EventSequence, Session, SoundFile, gui, opfs } from "../dist/index.js";
      import { Content, Multitrack, Session as SavedSession, Source } from "../dist/multitrack.js";

      const log = (line) => { document.getElementById("log").textContent += line + "\n"; };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`).catch(() => {});
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test, what, ms = 20_000) => {
        const end = performance.now() + ms;
        for (;;) {
          if (await test()) return;
          if (performance.now() > end) throw new Error(`timeout: ${what}`);
          await sleep(20);
        }
      };

      // A press and a release at `(x, y)` of `canvas`, in CSS pixels from
      // its corner: what a hand's click delivers to the canvas.
      const click = (canvas, x, y) => {
        const box = canvas.getBoundingClientRect();
        const at = { clientX: box.x + x, clientY: box.y + y, bubbles: true, composed: true,
          pointerId: 1, pointerType: "mouse", isPrimary: true };
        canvas.dispatchEvent(new PointerEvent("pointermove", { ...at, buttons: 0 }));
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...at, button: 0, buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...at, button: 0, buttons: 0 }));
      };

      try {
        if (!crossOriginIsolated) throw new Error("the page is not cross-origin isolated");
        const session = (await Session.embed({ channels: 2 })).activate();
        const rate = (await session.server.queryInfo()).nominalSampleRate;
        const frames = 2 * Math.trunc(rate);
        const samples = new Float32Array(frames).map((_, i) => 0.5 * Math.sin(i * 0.05));
        await opfs.makeDirectory("out");
        const write = (name) => SoundFile.write(`out/${name}`, samples, 1, rate, { sampleFormat: "float" });
        const take = await write("app_window.wav");

        await session.gui();
        const before = new Set(document.querySelectorAll("canvas"));
        const editor = await gui.edit(take, { title: "take" });
        const fresh = () => [...document.querySelectorAll("canvas")].find((c) => !before.has(c));
        await until(() => fresh() !== undefined, "the window's canvas");
        const canvas = fresh();

        // **The window's declared size**, as a native window opens at it.
        const box = canvas.getBoundingClientRect();
        if (Math.abs(box.width - 1000) > 1 || Math.abs(box.height - 520) > 1) {
          throw new Error(`the window's canvas is ${box.width}x${box.height}, not 1000x520`);
        }
        log(`sized: the window's canvas is ${box.width}x${box.height}, as declared`);

        // **A press lands where it is drawn**: two presses over the take
        // measure the body that shows its two seconds, in CSS pixels.
        await sleep(1500);
        const y = 0.5 * box.height;
        const at = async (x) => {
          click(canvas, x, y);
          await sleep(300);
          return editor.cursor();
        };
        const [x1, x2] = [0.4 * box.width, 0.6 * box.width];
        const [t1, t2] = [await at(x1), await at(x2)];
        if (!(t2 > t1)) throw new Error(`two presses put the cursor at ${t1} and then ${t2}`);
        const body = (x2 - x1) * (2.0 / (t2 - t1));
        if (body >= box.width) {
          throw new Error(`the take's body measures ${body.toFixed(0)} CSS pixels in a canvas ` +
            `of ${box.width}: a press is read at another scale than the one it is drawn at`);
        }
        log(`pressed: ${t1.toFixed(3)} s and ${t2.toFixed(3)} s, a body of ${body.toFixed(0)} px`);

        // **Opened into an element**: the window takes the element's box,
        // and the canvas the host first gave it is gone from the page.
        const stage = document.getElementById("stage");
        const second = await write("app_window_staged.wav");
        const counted = document.querySelectorAll("canvas").length;
        const staged = await gui.edit(second, { title: "staged", stage });
        await until(() => stage.querySelector("canvas") !== null, "the stage's canvas");
        await sleep(500);
        const inStage = stage.querySelector("canvas").getBoundingClientRect();
        if (Math.abs(inStage.width - 800) > 1 || Math.abs(inStage.height - 400) > 1) {
          throw new Error(`the staged window is ${inStage.width}x${inStage.height}, not the stage's 800x400`);
        }
        const now = document.querySelectorAll("canvas").length;
        if (now !== counted + 1) {
          throw new Error(`the staged window left ${now - counted} canvases on the page, not one`);
        }
        log(`staged: the window draws in its element, ${inStage.width}x${inStage.height}`);

        // A real multitrack save goes through the application worker's
        // storage operation. Read it back from OPFS, including its source
        // table and the relative file the region reads.
        const multitrack = new Multitrack();
        const track = multitrack.tracks.add("stored");
        track.activeTakeLane.regions.add(0, 2, Content.onto({
          source: { source: 1, lifetime: "session", generation: 0 },
          start: 0, duration: 2,
        }));
        const saved = new SavedSession();
        saved.multitrack = multitrack;
        saved.sources.set(1, Source.file("app_window.wav").shaped(1, frames, rate));
        await saved.save("out/app_window_session.json");
        const sessionEditor = await gui.edit(saved, { title: "stored session" });
        await until(async () => {
          try {
            await sessionEditor.save("out/app_window_again.json");
            return true;
          } catch (error) {
            if (!String(error?.message ?? error).includes("pending work")) throw error;
            return false;
          }
        }, "source measurement and session storage");
        const reopened = await SavedSession.open("out/app_window_again.json");
        if (reopened.sources.get(1)?.location.path !== "app_window.wav" || reopened.multitrack.tracks.length !== 1) {
          throw new Error("the stored session did not retain its track and relative source");
        }
        track.name = "retained";
        await sessionEditor.output();
        await sessionEditor.close();
        track.name = "after close";
        await sessionEditor.open();
        await until(async () => {
          try { await sessionEditor.save("out/app_window_retained.json"); return true; }
          catch (error) {
            if (!String(error?.message ?? error).includes("pending work")) throw error;
            return false;
          }
        }, "reopened source measurement and session storage");
        if (sessionEditor.multitrack !== multitrack) throw new Error("reopening retargeted the client object");
        const retained = await SavedSession.open("out/app_window_retained.json");
        if ([...retained.multitrack.tracks][0]?.name !== "after close" || retained.sources.get(1)?.location.path !== "app_window.wav") {
          throw new Error("reopening lost the retained contents or source location");
        }
        // a session put in the window's place hands this one back, and the
        // window goes on as the host's own
        track.name = "before the new session";
        await sessionEditor.output();
        const window = sessionEditor.window;
        await sessionEditor.newFile();
        await until(() => sessionEditor.closed, "the window handing its session back");
        if ([...multitrack.tracks][0]?.name !== "before the new session") {
          throw new Error("the window did not hand back what it left the multitrack as");
        }
        sessionEditor.host.verb(window, "close");
        await until(() => !sessionEditor.host.isOpen(window.id), "the host's own window closing");
        // **a window with no session opens one from OPFS in its place**,
        // and a session another window holds brings that window forward
        const empty = new gui.editing.MultitrackEditor(null, { title: "empty" });
        await empty.open();
        if ((await empty.query("file")).empty !== true) throw new Error("the window opened over a session");
        await empty.openFile("out/app_window_retained.json");
        const opened = await empty.query("file");
        if (opened.path !== "out/app_window_retained.json" || empty.closed) {
          throw new Error(`the window did not open the stored session: ${JSON.stringify(opened)}`);
        }
        const rival = new gui.editing.MultitrackEditor(null, { title: "rival" });
        await rival.open();
        const refused = await rival.openFile("out/app_window_retained.json").then(() => null, (error) => error);
        if (!String(refused?.message ?? refused).includes("open in another window")) {
          throw new Error(`a session open in a window was opened twice: ${refused}`);
        }
        await rival.close();
        await empty.close();
        log("stored: the multitrack and its relative sources read back from OPFS, handed back when another session took the window, and opened from OPFS in an empty one");

        // **a roll is an application too**: the page's sequence is the window's,
        // a second roll opens beside the first in one history with a transport
        // of its own, and the last close hands the sequence back
        const notes = new EventSequence([
          [0, new Event({ midinote: 60, dur: 1 })],
          [1, new Event({ midinote: 64, dur: 1 })],
        ]);
        const keys = await gui.edit(notes, { title: "keys" });
        const hertz = await gui.edit(notes, { title: "hertz", yAxis: "hz" });
        const note = notes.events.item(0);
        note.set("midinote", 62);
        const state = await keys.act("handle", { call: { verb: "state" } });
        if (state.events[0].data.midinote !== 62) throw new Error(`the window has not the change: ${JSON.stringify(state)}`);
        if (!(await hertz.undo())) throw new Error("the other roll walked nothing");
        if (note.get("midinote") !== 60) throw new Error("the copy did not follow the step");
        await keys.play(0);
        if (!(await keys.playing()) || (await hertz.playing())) throw new Error("the transports are not one each");
        await keys.stop();
        await keys.close();
        note.set("midinote", 67);
        await hertz.close();
        if (notes.window !== null || note.get("midinote") !== 67) {
          throw new Error("the last close did not hand the sequence back");
        }
        log("roll: one history over two windows, a transport each, and the sequence handed back");

        // **a symbolic score is an application too**: the page's engraver
        // worker reads it for the application's thread, a verb is its turn, and
        // the file is written to the page's storage
        const score = await gui.notation.Score.open("@clef:G-2\n@timesig:4/4\n@data:4CDEF/ 4GABc'/");
        const page = await gui.edit(score, { title: "score" });
        const items = () => score.sheet().staves[0].voices[0].items;
        const firstNote = items()[0].id;
        await page.select([`n${firstNote}`]);
        if (!(await page.articulation("stacc"))) throw new Error(`the verb did nothing: ${page.refused}`);
        if (items()[0].marks?.articulations?.[0] !== "stacc") throw new Error("the copy did not follow the verb");
        if ((await page.save("out/app_window.mei")) !== "out/app_window.mei") throw new Error("the score was not saved");
        const pageOnDisk = await gui.notation.Score.read("out/app_window.mei");
        if (!pageOnDisk.mei().includes("stacc")) throw new Error("the file does not hold the edit");
        if (!(await page.undo())) throw new Error("the window walked nothing");
        if (items()[0].marks !== undefined) throw new Error("the copy did not follow the step");
        await page.play(0);
        if (!(await page.playing())) throw new Error("the score does not play");
        // **a failed read leaves the window**, and a file reads back as written
        const held = score.mei();
        let failed = false;
        try { await page.openFile("out/no-such-score.mei"); } catch { failed = true; }
        if (!failed || score.mei() !== held || score.path !== "out/app_window.mei") throw new Error("a failed read moved the score");
        await page.stop();
        await page.close();
        if (score.window !== null) throw new Error("the close did not hand the score back");
        // **another document in the window is no edit**: the score is handed
        // back, and the window goes on with no step back across the change
        const handed = await gui.edit(score, { title: "score" });
        const stays = handed.id;
        await handed.newFile();
        await handed.wait(5);
        if (!handed.closed || score.window !== null) throw new Error("new did not hand the score back");
        const after = await handed.host.callApp(stays, { query: "history" });
        if (after.canUndo !== false) throw new Error("a new document has something to walk back");
        await handed.host.callApp(stays, { do: { verb: "close" } });
        // **a page over the sequence a roll shows** is one history with it
        const shown = new EventSequence([[0, new Event({ midinote: 60, dur: 1 })], [1, new Event({ midinote: 62, dur: 1 })]]);
        const reel = await gui.edit(shown, { title: "roll" });
        const reading = await gui.edit(shown, { title: "page", view: "score", division: 8 });
        shown.events.item(0).set("midinote", 67);
        await reel.undoLabel();
        if (!(await reading.undo()) || shown.events.item(0).get("midinote") !== 60) {
          throw new Error("the page walked nothing of the roll's");
        }
        await reading.close();
        await reel.close();
        log("score: read and engraved by the worker, edited, saved to OPFS, and one history with a roll");

        verdict("PASS: an application's window opened at its declared size and a press on " +
          "it landed where it is drawn; one opened into an element drew there");
        await editor.close();
        await staged.close();
      } catch (error) {
        verdict(`FAIL: ${error?.message ?? error}`);
      }
    </script>
  </body>
</html>
