<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters: two host instances in one page</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #0d0d12; color: #ddd;
                   font-family: system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 46rem; margin: 0 auto; padding: 24px 16px; }
      .pair { display: flex; gap: 16px; }
      .pair > figure { flex: 1; margin: 0; }
      figcaption { font-size: 12px; color: #999; padding-bottom: 6px; }
      canvas { display: block; width: 100%; height: 300px;
               border: 1px solid #333; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Two hosts, one page, one id space each</h1>
      <p>Two independent GUI host instances in one document, each with its own
      audio engine. Both use <em>the same</em> def and widget ids on purpose:
      that they do not collide is the property under test.</p>

      <div class="pair">
        <figure>
          <figcaption>host A — window 1000</figcaption>
          <canvas id="a"></canvas>
        </figure>
        <figure>
          <figcaption>host B — window 1000, again</figcaption>
          <canvas id="b"></canvas>
        </figure>
      </div>
      <pre id="log">running…</pre>
    </main>

    <!--
      The acceptance for host instances (clients/web/test.sh, headless Chrome;
      ?smoke=1 auto-runs, verdict beaconed as a fetch and read from the HTTP
      access log -- the standard web-smoke posture, docs/decisions.md).

      A page held one host for as long as winit's one EventLoop was mistaken
      for one host. It is not: the loop drives any number of windows, so the
      instances share it and nothing else. What this asserts is the "nothing
      else", which is what lets independent clients -- isolated demos side
      by side, an editor beside a player -- live in one document
      without partitioning an id range between them:

        - both hosts draw, each into its own canvas;
        - `/gui_def 1000` in both defines two different windows, and a
          `/gui_query` to each answers with *its* widget, not the other's;
        - a gesture on one emits a `/gui_event` in that host's outbox only;
        - each host's audio leg reaches its own engine, so a bound widget
          drives its own node and leaves the sibling's untouched;
        - closing one leaves the other drawing and answering.

      The hosts are driven as raw OSC rather than through `GuiHost`, because
      the TS client resolves the *page's* host and what is under test is the
      layer below that.
    -->
    <script type="module">
      import {
        loadOsc, pageConnection, engine, Server, Synth, SynthDef,
      } from "../dist/index.js";
      import { control, out, sine } from "../dist/defs/index.js";
      import { decodePacket, encodeMessage } from "../dist/base/osc.js";

      const smoke = new URLSearchParams(location.search).has("smoke");
      const lines = [];
      const log = (line) => {
        lines.push(line);
        document.getElementById("log").textContent = lines.join("\n");
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // The same gesture path gui.html plays: real pointer events on the
      // canvas, so what is exercised is the host's own interaction.
      function pointer(canvas, type, x, y, buttons) {
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.width / rect.width;
        canvas.dispatchEvent(new PointerEvent(type, {
          bubbles: true, cancelable: true, pointerId: 1, isPrimary: true,
          pointerType: "mouse", button: 0, buttons,
          clientX: rect.left + x / scale,
          clientY: rect.top + y / scale,
        }));
      }

      /** Drains one host's outbox into decoded messages. */
      function drain(bridge) {
        const out = [];
        for (;;) {
          const packet = bridge.poll();
          if (packet === undefined) break;
          out.push(...decodePacket(packet));
        }
        return out;
      }

      /** A `/gui_query` round trip on one host, by polling for its reply. */
      async function query(bridge, id, seen) {
        bridge.feed(encodeMessage("/gui_query", [["i", id]]));
        for (let i = 0; i < 60; i++) {
          await sleep(50);
          for (const msg of drain(bridge)) {
            seen.push(msg);
            if (msg.addr === "/gui_info" && msg.args[0] === id) return msg.args;
          }
        }
        throw new Error(`host never answered /gui_query ${id}`);
      }

      // Deliberately identical between the two hosts: same window id, same
      // widget ids, same names. Only `title` and the slider's value differ, so
      // an answer can be attributed to the host it came from.
      const panel = (title, value) => JSON.stringify({
        type: "window", id: 1000, title, w: 480, h: 300,
        flow: "col", margin: 8.0, gap: 8.0,
        children: [
          { type: "label", id: 1001, text: title, h: 28 },
          { type: "knob", id: 1002, name: "freq", min: 50.0, max: 2000.0,
            value: 220.0, h: 110 },
          { type: "slider", id: 1003, name: "cutoff", min: 0.0, max: 1.0,
            value, h: 110 },
        ],
      });

      /** One host instance with an engine of its own, playing one tone. */
      async function boot(start, canvasId, title, value) {
        const bridge = start();
        const canvas = document.getElementById(canvasId);

        // An engine per host, not the page's: the point of the exercise is
        // that these two share no node, bus or buffer space.
        const audio = await engine({ channels: 2 });
        await audio.resume();
        audio.addReply((bytes) => bridge.server_reply(bytes));
        bridge.connect_page((bytes) => audio.send(bytes));

        const server = await new Server({ connection: await pageConnection(audio) }).boot();
        await new SynthDef(
          "hosts_tone", out(0.0, sine(control("freq", 220.0)).mul(control("amp", 0.1))),
        ).send(server);
        const synth = new Synth("hosts_tone", { freq: 220.0, amp: 0.1 }, { server });
        await server.sync();

        // The canvas is the page's to make and place; the host is only told
        // which def draws into it, and at what pixel size.
        bridge.attach(1000, canvas);
        const box = canvas.getBoundingClientRect();
        const scale = devicePixelRatio || 1;
        canvas.width = Math.round(box.width * scale);
        canvas.height = Math.round(box.height * scale);
        bridge.resize(1000, canvas.width, canvas.height, scale);
        bridge.feed(encodeMessage("/gui_def", [["i", 1000], ["s", panel(title, value)]]));

        // The knob drives this host's own engine, with no round trip through
        // this script -- the bypass path, per instance.
        bridge.feed(encodeMessage("/gui_bind", [
          ["i", 1002], ["s", "server"], ["s", "/node_set"],
          ["i", synth.id], ["s", "freq"],
        ]));
        return { bridge, canvas, synth, server, seen: [] };
      }

      async function accept() {
        await loadOsc();
        const { default: init, start } = await import("../dist/gui-host/clausters_gui.js");
        await init();

        // Two instances. Before this, the second `start()` was winit's
        // `RecreationAttempt` -- a panic inside the wasm, not a catchable error.
        const a = await boot(start, "a", "host A", 0.2);
        const b = await boot(start, "b", "host B", 0.8);
        log(`two hosts booted, both holding window 1000`);

        await sleep(1200);

        // Both drew, each into the canvas the document placed for it.
        for (const [name, host] of [["A", a], ["B", b]]) {
          if (host.canvas.width < 100 || host.canvas.height < 100) {
            throw new Error(
              `host ${name}'s canvas never got a size ` +
              `(${host.canvas.width}x${host.canvas.height})`);
          }
        }

        // The id spaces do not collide: widget 1003 exists in both, and each
        // host answers with the value *it* was given.
        const infoA = await query(a.bridge, 1003, a.seen);
        const infoB = await query(b.bridge, 1003, b.seen);
        const valueOf = (args) => {
          const i = args.indexOf("value");
          if (i < 0) throw new Error(`no value in /gui_info: ${JSON.stringify(args)}`);
          return args[i + 1];
        };
        if (Math.abs(valueOf(infoA) - 0.2) > 1e-3 || Math.abs(valueOf(infoB) - 0.8) > 1e-3) {
          throw new Error(
            `the two hosts' widget 1003 collided: ` +
            `A=${valueOf(infoA)} B=${valueOf(infoB)} (want 0.2 / 0.8)`);
        }
        log(`widget 1003 in both: A=${valueOf(infoA)}, B=${valueOf(infoB)}`);

        // A gesture on A's canvas: the /gui_event leaves through A's outbox
        // and B's stays empty. The slider's band is y 162..272 in the tree's
        // logical pixels; the canvas is device pixels, hence the scale.
        a.seen.length = 0;
        b.seen.length = 0;
        const scale = a.canvas.width / a.canvas.getBoundingClientRect().width;
        pointer(a.canvas, "pointerdown", (8 + 0.25 * 464) * scale, 217 * scale, 1);
        await sleep(80);
        pointer(a.canvas, "pointerup", (8 + 0.25 * 464) * scale, 217 * scale, 0);

        let events = [];
        for (let i = 0; i < 40 && events.length === 0; i++) {
          await sleep(50);
          a.seen.push(...drain(a.bridge));
          b.seen.push(...drain(b.bridge));
          events = a.seen.filter((m) => m.addr === "/gui_event");
        }
        if (events.length === 0) throw new Error("host A's slider emitted no /gui_event");
        const strays = b.seen.filter((m) => m.addr === "/gui_event");
        if (strays.length > 0) {
          throw new Error(`host B saw host A's events: ${JSON.stringify(strays)}`);
        }
        log(`/gui_event from A only: ${JSON.stringify(events[0].args)}`);

        // A's slider moved and B's did not: the same widget id, two states.
        if (Math.abs(valueOf(await query(b.bridge, 1003, b.seen)) - 0.8) > 1e-3) {
          throw new Error("the gesture on A moved B's widget");
        }

        // Each leg reaches its own engine: A's bound knob drives A's node and
        // B's node never hears it. The knob's band is y 44..154, and the dial
        // is the disc drawn in the middle of it -- only the disc turns, so the
        // press goes on the canvas's own centre line rather than on the 480 the
        // def asks for: these canvases are the document's, and the flex row
        // gives them whatever half a column is.
        const beforeA = (await a.synth.info()).controls.freq;
        const beforeB = (await b.synth.info()).controls.freq;
        const dialA = a.canvas.width / 2;
        pointer(a.canvas, "pointerdown", dialA, 100 * scale, 1);
        await sleep(60);
        pointer(a.canvas, "pointermove", dialA, 60 * scale, 1);
        await sleep(60);
        pointer(a.canvas, "pointerup", dialA, 60 * scale, 0);

        let afterA = beforeA;
        for (let i = 0; i < 40 && afterA === beforeA; i++) {
          await sleep(50);
          afterA = (await a.synth.info()).controls.freq;
        }
        if (afterA === beforeA) {
          throw new Error(`host A's bound knob never reached its engine (${afterA})`);
        }
        const afterB = (await b.synth.info()).controls.freq;
        if (afterB !== beforeB) {
          throw new Error(`host A's knob reached host B's engine (${beforeB} -> ${afterB})`);
        }
        log(`A's knob drove A's engine ${beforeA} -> ${afterA}, B's stayed ${afterB}`);

        // Closing one instance leaves the other whole: still answering, still
        // drawing, still driving its own engine.
        a.bridge.close();
        await sleep(400);
        if (Math.abs(valueOf(await query(b.bridge, 1003, b.seen)) - 0.8) > 1e-3) {
          throw new Error("closing host A disturbed host B");
        }
        const beforeClose = (await b.synth.info()).controls.freq;
        const dialB = b.canvas.width / 2;
        pointer(b.canvas, "pointerdown", dialB, 100 * scale, 1);
        await sleep(60);
        pointer(b.canvas, "pointermove", dialB, 60 * scale, 1);
        await sleep(60);
        pointer(b.canvas, "pointerup", dialB, 60 * scale, 0);
        let afterClose = beforeClose;
        for (let i = 0; i < 40 && afterClose === beforeClose; i++) {
          await sleep(50);
          afterClose = (await b.synth.info()).controls.freq;
        }
        if (afterClose === beforeClose) {
          throw new Error("host B stopped working when host A closed");
        }

        a.synth.free();
        b.synth.free();
        verdict(
          `PASS: two hosts in one page -- both drew, widget 1003 held 0.2 and ` +
          `0.8 at once, a gesture on A left B's outbox empty, A's bound knob ` +
          `drove ${beforeA} -> ${afterA} while B stayed ${afterB}, and B ` +
          `survived A's close (${beforeClose} -> ${afterClose})`);
      }

      accept().catch((error) => verdict(`FAIL: ${error}`));
      if (!smoke) log("open with ?smoke=1 to beacon the verdict");
    </script>
  </body>
</html>
