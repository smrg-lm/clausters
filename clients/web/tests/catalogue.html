<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters: the filled-out UGen catalogue, heard</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12;
                   color: #dddddd; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            max-width: 44rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <div>the families the catalogue was missing, played on the in-page
        engine and asserted on an analyser: the frequency-domain chain, the
        demand streams, the stereo-field matrices and the state-variable
        filter's morph.</div>
      <button id="boot">boot + play</button>
      <pre id="log"></pre>
    </main>

    <!--
      The audible half of W6's acceptance (clients/web/test.sh, headless
      Chrome). The *spec* half is tests/def-parity.test.ts, which compares
      every one of these builders against vectors frozen from the Python
      client; what a vector cannot show is that the graph the spec describes
      does what its family says, so each check below is a measurement on the
      engine's own output rather than on a message.

      Two families are deliberately not here, and neither is silent by
      accident: `conv` needs a prepared kernel buffer (a `/buffer_gen` the
      page would have to write first), and `diskIn`/`diskOut` stream the
      *server's* filesystem, which a tab does not have. Both are covered by
      the parity vectors alone.
    -->
    <script type="module">
      import {
        loadCore, server as engine, Server, Synth, SynthDef,
      } from "../dist/index.js";
      import {
        control, dseq, duty, fft, ifft, midSide, out, pvBrickWall, saw, sine,
        stereoWidth, svf, svfMorph, whiteNoise,
      } from "../dist/defs/index.js";

      const smoke = new URLSearchParams(location.search).has("smoke");
      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ---- measuring what came out ----

      // The magnitude (dB) of the bins between `lo` and `hi` Hz, either
      // averaged or taken at their loudest. Which one is not a detail: a
      // **band** of noise is what its bins average to, while a *tone* lands
      // in one or two of them and the empty neighbours would average it into
      // the floor. The analyser's own smoothing is off, so each read is one
      // frame's picture.
      function bandDb(analyser, lo, hi, bins, mode = "mean") {
        analyser.getFloatFrequencyData(bins);
        const perBin = analyser.context.sampleRate / analyser.fftSize;
        const from = Math.max(1, Math.floor(lo / perBin));
        const to = Math.min(bins.length - 1, Math.ceil(hi / perBin));
        if (mode === "max") {
          let top = -Infinity;
          for (let i = from; i <= to; i++) top = Math.max(top, bins[i]);
          return top;
        }
        let sum = 0;
        for (let i = from; i <= to; i++) sum += bins[i];
        return sum / (to - from + 1);
      }

      const toneDb = (analyser, lo, hi, bins) => bandDb(analyser, lo, hi, bins, "max");

      // The loudest reading over `ms`, which is what a *moving* source needs:
      // a stream that visits a pitch only every other item is silent there
      // half the time.
      async function peakToneDb(analyser, lo, hi, bins, ms) {
        let best = -Infinity;
        for (let t = 0; t < ms; t += 25) {
          await sleep(25);
          best = Math.max(best, toneDb(analyser, lo, hi, bins));
        }
        return best;
      }

      async function run() {
        const server = await new Server().boot();
        // The engine this handle booted -- its own, not the page's.
        const raw = server.engine;
        if (raw.context.state !== "running") {
          throw new Error(`context did not run: ${raw.context.state}`);
        }

        // One analyser per channel: the stereo-field checks are about the two
        // channels *differing*, which a summed tap cannot show.
        const splitter = raw.context.createChannelSplitter(2);
        raw.node.connect(splitter);
        const analysers = [0, 1].map((ch) => {
          const a = raw.context.createAnalyser();
          a.fftSize = 4096;
          a.smoothingTimeConstant = 0;
          splitter.connect(a, ch);
          return a;
        });
        const [left, right] = analysers;
        const bins = new Float32Array(left.frequencyBinCount);

        const notes = [];

        // ---- the frequency-domain chain ----
        //
        // The same graph as the Python client's `chain.py`: noise analysed
        // by `fft`, band-limited *in the spectral domain* by `pvBrickWall`
        // (`wipe > 0` zeroes the top fraction of bins) and resynthesised by
        // `ifft`. The frame is synth-private scratch, so only `fft` names a
        // size and nothing is allocated.
        const noise = () => whiteNoise().mul(0.2);
        await new SynthDef("cat_raw", out(0.0, noise())).send(server);
        await new SynthDef("cat_lp", out(0.0, ifft(pvBrickWall(
          fft(noise(), 1.0, { fftSize: 1024, hop: 0.5, wintype: 0 }),
          0.75 // keep the bottom quarter of the bins
        )))).send(server);
        await server.sync();

        let node = new Synth("cat_raw", {}, { server });
        await server.sync();
        await sleep(200);
        const rawHigh = bandDb(left, 8000, 16000, bins);
        const rawLow = bandDb(left, 200, 2000, bins);
        node.free();
        await server.sync();
        await sleep(100);

        node = new Synth("cat_lp", {}, { server });
        await server.sync();
        await sleep(300);
        const lpHigh = bandDb(left, 8000, 16000, bins);
        const lpLow = bandDb(left, 200, 2000, bins);
        node.free();
        await server.sync();

        // The band that was wiped has to collapse while the one that was kept
        // survives — an `ifft` that reconstructs everything, or nothing,
        // fails both halves.
        if (!(lpHigh < rawHigh - 20)) {
          throw new Error(
            `the brick wall did not cut: ${rawHigh.toFixed(1)} dB -> ` +
            `${lpHigh.toFixed(1)} dB above 8 kHz`);
        }
        if (!(lpLow > rawLow - 12)) {
          throw new Error(
            `the passband did not survive: ${rawLow.toFixed(1)} dB -> ` +
            `${lpLow.toFixed(1)} dB below 2 kHz`);
        }
        notes.push(`spectral: ${(rawHigh - lpHigh).toFixed(0)} dB cut above ` +
          `8 kHz, ${(rawLow - lpLow).toFixed(0)} dB in the passband`);

        // ---- the demand streams ----
        //
        // `duty` pulls one item every `dur` seconds and holds it, and *both*
        // its inputs are streams — so the whole sequence lives in the def and
        // no client clock is involved. The stream has to be heard to advance:
        // the two pitches are each dominant at some point, and neither is
        // there the whole time.
        await new SynthDef("cat_demand", out(0.0, sine(
          duty(dseq([0.12, 0.12], 0.0), 0.0, dseq([220.0, 1760.0], 0.0), 0),
        ).mul(0.2))).send(server);
        await server.sync();

        node = new Synth("cat_demand", {}, { server });
        await server.sync();
        const lowNote = await peakToneDb(left, 180, 280, bins, 700);
        const highNote = await peakToneDb(left, 1600, 1900, bins, 700);
        node.free();
        await server.sync();
        if (!(lowNote > -60) || !(highNote > -60)) {
          throw new Error(
            `the demand stream did not visit both pitches: 220 Hz at ` +
            `${lowNote.toFixed(1)} dB, 1760 Hz at ${highNote.toFixed(1)} dB`);
        }
        notes.push(`demand: both pitches heard (${lowNote.toFixed(0)} / ` +
          `${highNote.toFixed(0)} dB)`);

        // ---- the stereo field ----
        //
        // `midSide` is normalized to be **its own inverse**, so encoding and
        // decoding a pair returns it unchanged: a 300 Hz left and a 900 Hz
        // right come back on their own channels. Collapsing the same pair
        // with `stereoWidth(…, 0)` scales the side to nothing, which puts
        // both tones on both channels.
        const pair = () => [sine(300.0).mul(0.2), sine(900.0).mul(0.2)];
        await new SynthDef("cat_ms", (() => {
          const [l, r] = pair();
          const ms = midSide(l, r);
          const back = midSide(ms.at(0), ms.at(1));
          return out(0.0, back);
        })()).send(server);
        await new SynthDef("cat_mono", (() => {
          const [l, r] = pair();
          return out(0.0, stereoWidth(l, r, 0.0));
        })()).send(server);
        await server.sync();

        node = new Synth("cat_ms", {}, { server });
        await server.sync();
        await sleep(250);
        const msLeft = [toneDb(left, 260, 340, bins), toneDb(left, 850, 950, bins)];
        const msRight = [toneDb(right, 260, 340, bins), toneDb(right, 850, 950, bins)];
        node.free();
        await server.sync();
        await sleep(100);
        // Each channel keeps its own tone: the round trip is the identity.
        if (!(msLeft[0] > msLeft[1] + 20) || !(msRight[1] > msRight[0] + 20)) {
          throw new Error(
            `midSide is not its own inverse: left ${msLeft.map((v) => v.toFixed(0))}, ` +
            `right ${msRight.map((v) => v.toFixed(0))}`);
        }

        node = new Synth("cat_mono", {}, { server });
        await server.sync();
        await sleep(250);
        const monoLeft = [toneDb(left, 260, 340, bins), toneDb(left, 850, 950, bins)];
        const monoRight = [toneDb(right, 260, 340, bins), toneDb(right, 850, 950, bins)];
        node.free();
        await server.sync();
        // Zero width: the side is gone, so both tones sit on both channels.
        for (const [ch, name] of [[monoLeft, "left"], [monoRight, "right"]]) {
          if (!(ch[0] > -60) || !(ch[1] > -60)) {
            throw new Error(`zero width left the ${name} channel incomplete: ` +
              `${ch.map((v) => v.toFixed(0))}`);
          }
        }
        notes.push("stereo field: the mid/side round trip is the identity, " +
          "and zero width folds it to mono");

        // ---- the state-variable filter, swept ----
        //
        // `svfMorph` is the one builder here that composes arithmetic rather
        // than a UGen: it turns one position into the three tap gains, so the
        // response sweeps lowpass -> bandpass -> highpass with the graph
        // unchanged. A `kr` control makes the clamps graph nodes.
        const pos = control("morph", 0.0);
        await new SynthDef("cat_svf", out(0.0, svf(
          saw(110.0).mul(0.2), 1200.0, { rq: 0.5 }, ...svfMorph(pos),
        ))).send(server);
        await server.sync();

        node = new Synth("cat_svf", { morph: 0.0 }, { server });
        await server.sync();
        await sleep(250);
        const lowpassHigh = bandDb(left, 4000, 10000, bins);
        node.set({ morph: 2.0 });
        await server.sync();
        await sleep(250);
        const highpassHigh = bandDb(left, 4000, 10000, bins);
        node.free();
        await server.sync();
        if (!(highpassHigh > lowpassHigh + 15)) {
          throw new Error(
            `the morph did not sweep: ${lowpassHigh.toFixed(1)} dB at the ` +
            `lowpass end, ${highpassHigh.toFixed(1)} dB at the highpass end`);
        }
        notes.push(`svf: ${(highpassHigh - lowpassHigh).toFixed(0)} dB more ` +
          "above 4 kHz at the highpass end");

        const tree = await server.queryTree();
        if (tree.children.length !== 0) {
          throw new Error(`the tree still holds ${tree.children.length} node(s)`);
        }

        verdict(`PASS: the catalogue's new families sound\n${notes.join("\n")}`);
      }

      document.getElementById("boot").onclick = () =>
        run().catch((err) => verdict(`FAIL: ${err}`));
      if (smoke) run().catch((err) => verdict(`FAIL: ${err}`));
    </script>
  </body>
</html>
