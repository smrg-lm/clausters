<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters: the notebook front end carries audio</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #0d0d12; color: #ddd;
                   font-family: system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 46rem; margin: 0 auto; padding: 24px 16px; }
      .cell { border: 1px solid #333; margin: 8px 0; min-height: 40px; }
      pre { background: #1a1a22; padding: 8px 12px; font-size: 12px;
            white-space: pre-wrap; }

  <body>
    <main>
      <h1>A notebook cell's end of the wire</h1>
      <p>The widget module <code>anywidget</code> loads, driven by a fake model
      that plays the exact message sequence a kernel plays.</p>
      <div class="cell" id="cell-a"></div>
      <div class="cell" id="cell-b"></div>
      <pre id="log">running…</pre>
    </main>

    <!--
      The acceptance for `src/notebook/widget.ts` (clients/web/test.sh, headless
      Chrome; ?smoke=1 auto-runs, verdict beaconed as a fetch and read from the
      HTTP access log -- the standard web-smoke posture, docs/decisions.md).

      Everything else about the notebook is tested in a language that cannot
      reach this half: `notebook.test.ts` covers the pure helpers under node,
      and `clients/jupyter/tests/` covers the kernel with a fake widget. In
      between sits the code that actually carries the audio, and until this
      page it was exercised only by opening JupyterLab by hand.

      The regression it exists for: a packet on the server channel was handed
      to `state.engine?.then(...)`, and `state.engine` is null until the wasm
      host has finished booting. A def and a `/synth_new` sent by the cell that
      opened the window therefore arrived during that window and were dropped
      -- silently, with no reply to wait for and no error anywhere. The
      notebook drew, and never made a sound.

      So what is asserted here is the timing, not the wiring: a packet handed
      to a mounted front end reaches the engine *whenever it arrives*, before
      the boot as well as after it.

      And the lifetime rule, whose absence is the other half of the same
      complaint: a host and an engine live exactly as long as their kernel.
      Both signals that report a kernel going are exercised, because they are
      different mechanisms -- a comm closing, which destroys the model, and a
      restart, which closes nothing and is visible only on the kernel's own
      status. Closing a tab is deliberately not one of them: it leaves the
      kernel running, and reopening it must find its windows and its sound.
    -->
    <script type="module">
      // Count the page's AudioContexts, which is the resource actually at
      // stake: a browser allows about six, and every notebook opened in a
      // JupyterLab tab wants one. Patched before the module is imported so
      // the engine's own context is caught. Test-side on purpose -- nothing
      // in the shipped code should have to expose this.
      let liveContexts = 0;
      const openContexts = new Set();
      for (const name of ["AudioContext", "webkitAudioContext"]) {
        const Real = globalThis[name];
        if (Real === undefined) continue;
        globalThis[name] = class extends Real {
          constructor(...args) {
            super(...args);
            liveContexts += 1;
            openContexts.add(this);
            const close = this.close.bind(this);
            this.close = async () => {
              await close();
              liveContexts -= 1;
              openContexts.delete(this);
            };
          }
        };
      }

      const { loadOsc } = await import("../dist/index.js");
      const { decodePacket, encodeMessage } = await import("../dist/base/osc.js");
      const mod = await import("../dist/notebook/widget.js");
      const { default: widget, asBytes, liveSessions } = mod;

      const smoke = new URLSearchParams(location.search).has("smoke");
      const lines = [];
      const log = (line) => {
        lines.push(line);
        document.getElementById("log").textContent = lines.join("\n");
      };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // What `clausters_jupyter.assets` sends for backend="page", in its
      // order. Kept here by hand because the page has no Python to ask; a name
      // that drifts fails this loudly, which is the point. It is short because
      // the client arrives bundled -- one module, since a blob URL cannot
      // express the package's import cycles (see src/notebook/client.ts).
      const ASSETS = [
        "notebook-client.js",
        "base/tick-worker.js",
        "gui-host/clausters_gui_bg.wasm",
        "core/clausters_core_web_bg.wasm",
        "engine/clausters_web.js",
        "engine/clausters_web_bg.wasm",
        "engine/worklet.js",
        "engine/worklet-shim.js",
      ];

      async function fetchAssets() {
        const buffers = [];
        for (const name of ASSETS) {
          const response = await fetch(`../dist/${name}`);
          if (!response.ok) throw new Error(`no ${name} in dist/ - run ./build.sh`);
          buffers.push(await response.arrayBuffer());
        }
        return buffers;
      }

      /**
       * anywidget's model, as much of it as the widget module uses, plus the
       * kernel behind it. `deliver` is a message coming down the comm; `up`
       * collects what the front end sends back.
       */
      class FakeModel {
        constructor(traits) {
          this.traits = traits;
          this.handlers = new Map();
          this.gui = [];
          this.server = [];
          this.destroyed = false;
          this.onReady = null;
          // The shape the module reaches for on JupyterLab: the manager's
          // kernel connection and its lumino status signal. A restart closes
          // no comm, so this is the only thing that reports it.
          this.status = [];
          this.widget_manager = {
            kernel: {
              // Stable across a restart, which is how a re-run cell is
              // recognised as the successor of what it left behind.
              id: traits.kernel ?? "kernel-x",
              statusChanged: {
                connect: (handler) => this.status.push(handler),
              },
            },
          };
        }

        /** What a kernel restart looks like from here. */
        kernelStatus(status) {
          for (const handler of this.status) handler(this.widget_manager.kernel, status);
        }

        get(name) { return this.traits[name]; }

        on(event, handler) {
          if (!this.handlers.has(event)) this.handlers.set(event, []);
          this.handlers.get(event).push(handler);
        }

        send(content, _callbacks, buffers) {
          if (content.ch === "ready") { void this.onReady?.(content); return; }
          const into = content.ch === "gui" ? this.gui : this.server;
          for (const buffer of buffers ?? []) {
            into.push(...decodePacket(asBytes(buffer)));
          }
        }

        deliver(content, buffers) {
          for (const handler of this.handlers.get("msg:custom") ?? []) {
            handler(content, buffers ?? []);
          }
        }

        /** What the kernel's comm closing looks like from here. */
        destroy() {
          this.destroyed = true;
          for (const handler of this.handlers.get("destroy") ?? []) handler();
        }
      }

      /**
       * Mount one cell: render the widget into `el` and answer its "ready"
       * with the assets, exactly as `clausters_jupyter.widget` does.
       *
       * Returns before the host has booted, on purpose -- the window this
       * opens is what the first assertion aims at.
       */
      async function mount(session, elementId, assets, kernel = session) {
        const model = new FakeModel({
          session, kernel, engine: true, server_url: "", width: 480,
          height: 200,
        });
        let staged = null;
        model.onReady = (content) => {
          // The kernel's own rule: send the bytes unless the page already has
          // these ones. `have` is the page's digest, reported not told.
          staged = content.have;
          if (content.have !== "test-digest") {
            model.deliver({ ch: "assets", names: ASSETS, digest: "test-digest" },
                          assets);
          }
        };
        const cleanup = await widget.render({
          model, el: document.getElementById(elementId),
        });
        return { model, cleanup, staged: () => staged };
      }

      /** Ask the engine to answer, and say whether it did. */
      async function reaches(model, id, timeoutMs = 8000) {
        model.deliver({ ch: "server" },
                      [encodeMessage("/server_sync", [["i", id]])]);
        for (let i = 0; i * 50 < timeoutMs; i++) {
          await sleep(50);
          if (model.server.some(
              (m) => m.addr === "/server_sync.reply" && m.args[0] === id)) {
            return true;
          }
        }
        return false;
      }

      async function accept() {
        await loadOsc();
        const assets = await fetchAssets();
        log(`${ASSETS.length} assets staged, ${
          assets.reduce((n, b) => n + b.byteLength, 0) >> 20} MB`);

        // ---- the regression: a packet sent while the host is still booting.
        const a = await mount("session-a", "cell-a", assets);
        // No await between the mount and this: the engine does not exist yet,
        // which is precisely the state the first cell of every notebook sends
        // into (a def, then a /synth_new, then the window that displays).
        const early = await reaches(a.model, 1);
        if (!early) {
          throw new Error(
            "a packet sent before the boot finished never reached the engine " +
            "- the notebook draws and stays silent");
        }
        log("a packet sent during the boot reached the engine");

        // ---- and the steady state, so the fix is not "queue everything and
        // never drain".
        if (!await reaches(a.model, 2)) {
          throw new Error("a packet sent after the boot never reached the engine");
        }
        log("a packet sent after the boot reached the engine");

        // ---- a second notebook in the same page: its own host, on the assets
        // the first one staged, and an engine of its own that answers it.
        const b = await mount("session-b", "cell-b", assets);
        if (b.staged() !== "test-digest") {
          throw new Error(
            `the second cell asked for the assets again (have=${b.staged()})`);
        }
        if (!await reaches(b.model, 1)) {
          throw new Error("the second notebook's engine never answered");
        }
        log("a second session booted on the staged assets and answered");

        // ---- teardown, signal one: the kernel's comm closes (a kernel shut
        // down, a widget closed from Python). A session outlives its cells but
        // not its kernel -- without this every notebook ever opened in the tab
        // stays on the page, holding a GPU device and one of the six
        // AudioContexts a browser allows.
        const two = liveContexts;
        if (two < 2) throw new Error(`expected two engines, saw ${two}`);
        a.cleanup();
        a.model.destroy();
        const freed = async (was) => {
          for (let i = 0; i < 200 && liveContexts >= was; i++) await sleep(100);
          return liveContexts < was;
        };
        if (!await freed(two)) {
          throw new Error(
            `closing session A's comm freed nothing (${two} AudioContexts ` +
            `before, ${liveContexts} after)`);
        }
        if (liveSessions().includes("session-a")) {
          throw new Error("session A's engine closed but its host stayed");
        }
        log(`comm closed: ${two} -> ${liveContexts} live engines, ` +
            `sessions left: ${JSON.stringify(liveSessions())}`);

        // ---- and it took only its own: B still answers.
        if (!await reaches(b.model, 2)) {
          throw new Error("closing session A took session B's engine with it");
        }
        log("session B still answers after A closed");

        // ---- teardown, signal two: the kernel restarts. This one closes no
        // comm at all (the manager sets `comm_live = false` by assignment,
        // firing nothing), so the kernel's own status is the only report of
        // it, and B's cell stays mounted throughout -- what is gone is the
        // kernel, not the output.
        const one = liveContexts;
        b.model.kernelStatus("restarting");

        // A restart is not a free: the notebook is still open and about to
        // re-run its cells. What it *is* is silence, immediately -- a synth
        // running when its kernel restarts has nothing left that could stop
        // it, no cell to run and no node id anyone still holds.
        let sounding = [...openContexts].filter((c) => c.state === "running");
        for (let i = 0; i < 30 && sounding.length > 0; i++) {
          await sleep(100);
          sounding = [...openContexts].filter((c) => c.state === "running");
        }
        if (sounding.length > 0) {
          throw new Error("a restarted kernel left its engine sounding");
        }
        log("restart silenced the engine at once");

        await sleep(2000);
        if (liveContexts !== one || !liveSessions().includes("session-b")) {
          throw new Error(
            "a restart freed the session behind the notebook's back");
        }
        log("...and freed nothing: the notebook is still open");

        // Coming back is what frees it. The re-run cell builds a new session
        // -- Python makes a fresh id per kernel process -- and the kernel id
        // it carries is the one thing that survived the restart, so the new
        // front end can recognise what it is replacing.
        const c = await mount("session-b2", "cell-b", assets, "session-b");
        if (!await freed(one)) {
          throw new Error(
            "coming back to the notebook did not free what the restart left " +
            `(${one} AudioContexts, still ${liveContexts})`);
        }
        if (liveSessions().includes("session-b")) {
          throw new Error("the orphaned session's host outlived its engine");
        }
        if (!await reaches(c.model, 1)) {
          throw new Error("the session after the restart has no engine");
        }
        log(`came back: freed the orphan, sessions now ` +
            `${JSON.stringify(liveSessions())}`);

        // ---- and a kernel shut down for good frees its session without the
        // model count agreeing. Reopening a notebook's tab builds fresh models
        // for the same widgets while the ones from before are never destroyed
        // -- no comm closes, so nothing tells them to -- and a count alone
        // would keep a straggler forever. The extra mount here is that
        // straggler; `dead` has to free the session over its head.
        const stale = await mount("session-b2", "cell-a", assets, "session-b");
        const two2 = liveContexts;
        stale.model.kernelStatus("dead");
        if (!await freed(two2)) {
          throw new Error(
            "a kernel shut down for good left its session on the page, held " +
            "up by a model that no longer has a tab");
        }
        if (liveSessions().includes("session-b2")) {
          throw new Error("the dead kernel's host outlived its engine");
        }
        log("a dead kernel freed its session past a stale model");

        verdict("PASS: the cell carries audio through the boot; a restart "
                + "silences and coming back collects, a closed comm and a dead "
                + "kernel free outright");
      }

      accept().catch((error) => {
        verdict(`FAIL: ${error?.message ?? error}`);
        console.error(error);
      });
    </script>
  </body>
</html>
