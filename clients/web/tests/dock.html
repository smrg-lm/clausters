<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>clausters: the dock in a page</title>
  </head>
  <body>
    <div id="dock" style="width: 800px; height: 300px"></div>
    <pre id="log"></pre>
    <!--
      The dock in a page (clients/web/test.sh, headless). A host booted
      with a dock draws every window as a pane of one canvas, side by
      side: two windows opened after it and one the host had before leave no
      canvas of their own on the page, each pane's capture is the window's own
      picture at the pane's size, and a press on the dock's canvas
      reaches the pane under it -- the slider of the first pane moves, the
      second's does not, and a press over the second moves only the second.
      Then the dock's own door: the second pane put among the first's tabs
      and shown, a press on the first's tab showing it again, a layout put
      back as it was read, and the dock's picture written; the second pane
      taken out into a canvas of its own and put back; a window naming a
      page opening on it, the pages switched and every pane where it was
      left; and a pane closed leaving the dock.
      Verdict beaconed as a fetch, read from the access log.
    -->
    <script type="module">
      import { GuiHost, gui } from "../dist/index.js";
      import { loadCore } from "../dist/page.js";

      const log = (line) => { document.getElementById("log").textContent += line + "\n"; };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`).catch(() => {});
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test, what, ms = 20_000) => {
        const end = performance.now() + ms;
        for (;;) {
          if (await test()) return;
          if (performance.now() > end) throw new Error(`timeout: ${what}`);
          await sleep(20);
        }
      };

      // A press and a release at `(x, y)` of `canvas`, in its device pixels.
      const click = (canvas, x, y) => {
        const box = canvas.getBoundingClientRect();
        const scale = canvas.width / box.width;
        const at = { clientX: box.left + x / scale, clientY: box.top + y / scale, bubbles: true,
          composed: true, pointerId: 1, pointerType: "mouse", isPrimary: true };
        canvas.dispatchEvent(new PointerEvent("pointermove", { ...at, buttons: 0 }));
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...at, button: 0, buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...at, button: 0, buttons: 0 }));
      };

      try {
        await loadCore();
        const before = document.querySelectorAll("canvas").length;
        const element = document.getElementById("dock");
        const host = await new GuiHost().boot({ dock: element });
        const slider = (title) => gui.view({ title, w: 300, h: 200 }, gui.slider({ name: "s", value: 0.5 }));
        const a = host.open(slider("a"));
        const b = host.open(slider("b"));
        const canvas = element.querySelector("canvas");
        if (canvas === null) throw new Error("the dock has no canvas in its element");
        await sleep(1500);
        const extra = document.querySelectorAll("canvas").length - before - 1;
        log(`canvases: the dock's, and ${extra} more`);

        // each pane's picture is the window's own, at the pane's size: half
        // the dock, less the divider
        const pictures = [];
        for (const [name, win] of [["a", a], ["b", b]]) {
          const path = `dock_${name}.png`;
          await host.capture(win, path);
          pictures.push(path);
        }
        log(`captured: ${pictures.join(", ")}`);

        // a press on the dock's canvas reaches the pane under it, in
        // its own pixels: near the right end of the first pane's slider
        const values = async () => [await a.widget("s").query(), await b.widget("s").query()];
        const read = (info) => Number(info.props.value);
        const width = canvas.width;
        const state = await host.dockCall({ verb: "layout" });
        const rectOf = (st, id) => st.panes.find((p) => p.id === id).rect;
        const y = rectOf(state, a.id)[1] + 16 * (canvas.width / canvas.getBoundingClientRect().width);
        click(canvas, 0.45 * width, y);
        await sleep(400);
        let [va, vb] = (await values()).map(read);
        log(`after a press over the first pane: ${va.toFixed(3)}, ${vb.toFixed(3)}`);
        if (!(va > 0.8) || Math.abs(vb - 0.5) > 1e-6) {
          throw new Error(`the press did not reach the first pane alone: ${va}, ${vb}`);
        }
        click(canvas, 0.55 * width, y);
        await sleep(400);
        [va, vb] = (await values()).map(read);
        log(`after a press over the second pane: ${va.toFixed(3)}, ${vb.toFixed(3)}`);
        if (!(vb < 0.2)) throw new Error(`the press did not reach the second pane: ${vb}`);

        // the dock's door: b among a's tabs, shown; a press on a's tab
        // shows a; the layout read back is the one put back
        const saved = await host.dockLayout();
        let st = await host.dockCall({ verb: "join", pane: b.id, of: a.id });
        const shown = (st, id) => st.panes.find((p) => p.id === id).shown;
        log(`joined: ${JSON.stringify(st.layout)}`);
        if (!shown(st, b.id) || shown(st, a.id)) throw new Error("the joined pane is not the one shown");
        // on the tab's name, clear of its close mark
        const { tab, tab_close: mark } = st.panes.find((p) => p.id === a.id);
        const end = mark ? mark[0] : tab[0] + tab[2];
        click(canvas, (tab[0] + end) / 2, tab[1] + tab[3] / 2);
        await sleep(300);
        st = await host.dockCall({ verb: "layout" });
        if (!shown(st, a.id) || shown(st, b.id)) throw new Error("a press on a tab did not show its pane");
        st = await host.dockRestore(saved);
        if (JSON.stringify(st.layout) !== JSON.stringify(saved)) {
          throw new Error(`restored ${JSON.stringify(st.layout)} against ${JSON.stringify(saved)}`);
        }
        log(`dock capture: ${await host.dockCapture("dock_whole.png")}`);

        // out into a canvas of its own, and back
        const canvases = () => document.querySelectorAll("canvas").length - before - 1;
        st = await host.dockCall({ verb: "undock", pane: b.id });
        await sleep(300);
        if (st.panes.some((p) => p.id === b.id) || String(st.out) !== String(b.id)) {
          throw new Error(`undock: ${JSON.stringify(st)}`);
        }
        if (canvases() !== 1) throw new Error(`a pane taken out has ${canvases()} canvases of its own`);
        st = await host.dockCall({ verb: "dock", pane: b.id });
        await sleep(300);
        if (!st.panes.some((p) => p.id === b.id) || st.out.length !== 0 || canvases() !== 0) {
          throw new Error(`dock: ${JSON.stringify(st)}, ${canvases()} canvases`);
        }
        log("taken out and put back");

        // out again, as a floating panel: its bar's menu puts it back by hand
        const bar = st.bars[0].bar[3];
        st = await host.dockCall({ verb: "undock", pane: b.id });
        await sleep(300);
        const fw = [...document.querySelectorAll("canvas")].at(-1).width;
        const hand = (kind, x, y) => host.dockCall({ verb: "pointer", kind, x, y, panel: b.id });
        for (const kind of ["move", "press", "release"]) await hand(kind, fw - 1.5 * bar, bar / 2);
        await host.dockCall({ verb: "capture", path: "dock_float.png", panel: b.id });
        await hand("move", fw - 70, 1.5 * bar);
        st = await hand("press", fw - 70, 1.5 * bar);
        await sleep(300);
        if (!st.panes.some((p) => p.id === b.id) || st.out.length !== 0 || canvases() !== 0) {
          throw new Error(`back by hand: ${JSON.stringify(st)}, ${canvases()} canvases`);
        }
        log("a floating panel's menu put it back");

        // a window naming its page is an application, alone on a page of
        // its own: nothing is placed there, and switching pages moves panes
        // and frees none
        const main = await host.dockLayout();
        const c = host.open(gui.view({ title: "c", w: 300, h: 200, dockPage: "Mix" },
            gui.slider({ name: "s", value: 0.5 })));
        await sleep(500);
        st = await host.dockCall({ verb: "layout" });
        if (st.page !== "Mix" || st.panes.length !== 1 || st.panes[0].id !== c.id) {
          throw new Error(`the window naming its page: ${JSON.stringify(st)}`);
        }
        const placed = await host.dockCall({ verb: "place", pane: a.id }).then(() => null, (e) => e);
        if (!String(placed?.message ?? "").includes("alone on its page")) {
          throw new Error(`a pane was placed on an application's page: ${placed}`);
        }
        const mix = (await host.dockCall({ verb: "layout" })).layout;
        st = await host.dockCall({ verb: "page", name: "Main" });
        if (JSON.stringify(st.layout) !== JSON.stringify(main)) {
          throw new Error(`Main came back as ${JSON.stringify(st.layout)}, not ${JSON.stringify(main)}`);
        }
        st = await host.dockCall({ verb: "page", name: "Mix" });
        if (JSON.stringify(st.layout) !== JSON.stringify(mix)) throw new Error("Mix moved");
        st = await host.dockCall({ verb: "page", name: "Main" });
        log(`pages: ${st.pages.map((p) => p.name).join(", ")}`);
        c.close();

        // a pane closed leaves the dock
        b.close();
        await sleep(300);
        st = await host.dockCall({ verb: "layout" });
        if (st.panes.length !== 1 || st.panes[0].id !== a.id || JSON.stringify(st.pages).includes(`${c.id}`)) {
          throw new Error(`a closed pane stayed: ${JSON.stringify(st.pages)}`);
        }
        if (extra !== 0) throw new Error(`the panes left ${extra} canvases of their own on the page`);
        verdict("PASS dock");
      } catch (error) {
        verdict(`FAIL dock: ${error?.message ?? error} -- ${document.getElementById("log").textContent.replaceAll("\n", " / ")}`);
      }
    </script>
  </body>
</html>
