<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>clausters: the applications in a page</title>
  </head>
  <body>
    <pre id="log"></pre>
    <!--
      The editing applications in a page (clients/web/test.sh, headless,
      served isolated: `apps.html?isolated`). The page is cross-origin
      isolated, so it loads the host's applications' build, one module over
      one shared memory, and what that build runs on is checked here as it
      lands: a thread of the application is a worker over that memory, which
      parks and is woken from the main thread, and reads and writes the
      page's storage synchronously, as natively.
      Verdict beaconed as a fetch, read from the access log.
    -->
    <script type="module">
      import { loadCore, newGuiHost } from "../dist/index.js";

      const log = (line) => { document.getElementById("log").textContent += line + "\n"; };
      const verdict = (text) => {
        log(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`).catch(() => {});
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test, what, ms = 10_000) => {
        const end = performance.now() + ms;
        while (!test()) {
          if (performance.now() > end) throw new Error(`timeout: ${what}`);
          await sleep(10);
        }
      };

      try {
        if (!crossOriginIsolated) throw new Error("the page is not cross-origin isolated");
        await loadCore();
        const bridge = await newGuiHost();
        const apps = await import("../dist/gui-host-apps/clausters_gui.js");

        // **A thread is a worker over the shared memory**: it runs, parks,
        // and a wake from the main thread reaches it.
        apps.apps_thread_check();
        await until(() => apps.apps_thread_checked() === 1, "the thread to run");
        apps.apps_thread_check_wake();
        await until(() => apps.apps_thread_checked() === 2, "the thread to be woken");
        log("a thread: a worker over the shared memory, parked and woken from the main thread");

        // **A thread reads and writes the page's storage** as natively: a
        // folder made, a file written, sought and read back, listed, moved
        // and removed through `clausters_core::files`; the main thread is
        // refused one, since it cannot wait.
        apps.apps_files_check();
        await until(() => apps.apps_files_checked() !== 0, "the files check");
        if (apps.apps_files_checked() !== 1) throw new Error(`files: ${apps.apps_files_failed()}`);
        log("files: written, sought, read, listed, moved and removed from a thread");

        // **A working folder is held by a Web Lock**: one no tab holds is
        // swept as the next is made, the new one is held while it lives, and
        // it goes, with its lock, when it is let go.
        apps.apps_folder_check();
        await until(() => apps.apps_folder_checked() !== 0, "the working folder");
        if (apps.apps_folder_checked() !== 1) throw new Error(`working folder: ${apps.apps_folder()}`);
        const folder = apps.apps_folder();
        const leaf = folder.split("/").at(-1);
        const held = async () => (await navigator.locks.query()).held.map((l) => l.name);
        if (!(await held()).includes(`clausters-work:${leaf}`)) throw new Error(`${folder} is not held`);
        apps.apps_folder_check_wake();
        await until(() => apps.apps_folder_checked() === 3, "the folder to be let go");
        const gone = async () => {
          try {
            let dir = await navigator.storage.getDirectory();
            for (const part of folder.split("/")) dir = await dir.getDirectoryHandle(part);
            return false;
          } catch { return true; }
        };
        if (!(await gone())) throw new Error(`${folder} outlived its workspace`);
        if ((await held()).includes(`clausters-work:${leaf}`)) throw new Error(`${folder} is still held`);
        log("working folder: one left behind swept, its own held by a Web Lock and gone with it");

        verdict("PASS: the applications' host loaded over shared memory, a thread of it " +
          "ran in a worker, parked and was woken from the main thread, a thread read and " +
          "wrote the page's storage, and a working folder was held by a Web Lock and swept");
        bridge.close?.();
      } catch (error) {
        verdict(`FAIL: ${error?.message ?? error}`);
      }
    </script>
  </body>
</html>
