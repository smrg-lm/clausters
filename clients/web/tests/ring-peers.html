<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>acceptance: host and script both streaming</title>
  </head>
  <body>
    <!--
      The acceptance for ring client identities, and before that the probe that
      demonstrated their absence.

      Everything reaching the in-page engine goes through one shared-memory
      ring. The server used to see all of it as a single client
      (`ClientId::Ring`), and `/bus_stream` is one subscription per client,
      replaced on each call — so the script and the GUI host, both pushing
      through `engine.send`, took the stream from each other, and the loss was
      permanent in one direction: the host only re-subscribes when its own
      widget set changes. Ring frames now carry a peer tag, so the two are two
      clients, exactly as a native host and a script on two sockets are.

      The four phases are the probe's, now asserted rather than reported:

        phase 1  script only .................. its bus arrives
        phase 2  host opens a meter ........... BOTH buses arrive, and the
                                                script keeps gaining snapshots
        phase 3  script re-subscribes ......... both still arrive
        phase 4  1.9 s later, untouched ....... both still arrive

      Phase 2 is the one that used to fail, and phase 4 is the one that used to
      stay failed.
    -->
    <pre id="log"></pre>
    <script type="module">
      import {
        loadOsc, loadCore, pageConnection, server as engine, Server,
        Bus, Synth, SynthDef, GuiHost, gui, data, decodePacket, ANY_PEER, pageGuiConnection,
      } from "../dist/index.js";
      import { control, outCtl, sine } from "../dist/defs/index.js";

      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const verdict = (t) => {
        document.title = t;
        fetch(`/smoke-verdict-${encodeURIComponent(t)}`).catch(() => {});
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function run() {
        await loadOsc();
        await loadCore();
        const raw = await engine({ channels: 2 });
        await raw.resume();

        // A raw window onto every /bus_stream.reply the engine emits, whoever
        // subscribed: which bus indices arrive is the whole question. Replies
        // are addressed per client now, so this is the observer door.
        const seen = new Map();
        raw.addReply((bytes) => {
          for (const { addr, args } of decodePacket(bytes)) {
            if (addr !== "/bus_stream.reply") continue;
            for (let i = 0; i + 1 < args.length; i += 2) {
              const bus = Number(args[i]);
              seen.set(bus, (seen.get(bus) ?? 0) + 1);
            }
          }
        }, ANY_PEER);
        const snapshot = () => JSON.stringify([...seen.entries()].sort());
        const reset = () => seen.clear();

        // Every outbound packet, whoever sent it: the host's server leg and
        // the script's connection both call `engine.send`.
        const out = [];
        const realSend = raw.send.bind(raw);
        raw.send = (bytes, peer) => {
          for (const { addr, args } of decodePacket(bytes)) {
            if (addr === "/bus_stream" || addr === "/bus_tapStream") {
              out.push(`${addr}@${peer}(${args.join(",")})`);
            }
          }
          return realSend(bytes, peer);
        };

        const connection = await pageConnection();
        const server = await new Server(connection).boot();

        const scriptBus = Bus.control(1, { server });
        const hostBus = Bus.control(1, { server });
        await new SynthDef("probe_lfo",
          outCtl(control("bus", 0.0), sine(2.0).mul(0.5).add(0.5))).send(server);
        new Synth("probe_lfo", { bus: scriptBus.index }, { server });
        new Synth("probe_lfo", { bus: hostBus.index }, { server });
        await server.sync();

        // Phase 1: only the script is subscribed.
        const stream = await data.BusStream.open(server, [scriptBus],
                                                 { periodMs: 20 });
        // Each entry: the phase's name, the bus indices seen in it, and how
        // many snapshots the script's own BusStream gained (null when the
        // phase does not measure that).
        const checks = [];
        const busesSeen = () => [...seen.keys()];
        reset();
        await sleep(400);
        log(`phase 1 (script only): buses ${snapshot()}, `
          + `stream.snapshots ${stream.snapshots}`);

        // Phase 2: the GUI host opens a window with a meter on the other bus,
        // which makes it subscribe its own set through the same page.
        const host = await new GuiHost(await pageGuiConnection()).boot();
        host.open(gui.view({ title: "probe", w: 320, h: 160 },
          // Control-rate: an audio meter reads a bus *level* out of the data
          // plane and demands no `/bus_stream`, so it would subscribe nothing.
          gui.meter(hostBus.index, { rate: "control", h: 40 })));
        await sleep(800);   // the host ticks at ~30 fps and (re)subscribes

        const before = stream.snapshots;
        reset();
        await sleep(400);
        log(`phase 2 (host window open): buses ${snapshot()}, `
          + `script gained ${stream.snapshots - before}`);
        checks.push(["phase 2", busesSeen(), stream.snapshots - before]);

        // Phase 3: the script re-subscribes after the host did.
        await server.streamBuses(20, [scriptBus]);
        const before3 = stream.snapshots;
        reset();
        await sleep(400);
        log(`phase 3 (script re-subscribed): buses ${snapshot()}, `
          + `script gained ${stream.snapshots - before3}`);
        checks.push(["phase 3", busesSeen(), stream.snapshots - before3]);

        // Phase 4: does the host come back on its own?
        await sleep(1500);
        reset();
        await sleep(400);
        log(`phase 4 (1.9 s later, nobody touched it): buses ${snapshot()}`);
        checks.push(["phase 4", busesSeen(), null]);

        log(`outbound: ${out.join(" ")}`);

        // The assertions. Both buses must be arriving in every phase after the
        // host opened its window, and the script must never stop gaining.
        const failures = [];
        for (const [phase, buses, gained] of checks) {
          if (!buses.includes(scriptBus.index)) {
            failures.push(`${phase}: the script's bus ${scriptBus.index} stopped arriving`);
          }
          if (!buses.includes(hostBus.index)) {
            failures.push(`${phase}: the host's bus ${hostBus.index} stopped arriving`);
          }
          if (gained !== null && gained <= 0) {
            failures.push(`${phase}: the script gained ${gained} snapshots`);
          }
        }
        if (failures.length) {
          throw new Error(failures.join("; ") + " || log: " +
            document.getElementById("log").textContent.replace(/\n/g, " | "));
        }
        verdict(`PASS: a GUI host meter and a script bus stream both kept ` +
          `updating through ${checks.length} phases ` +
          `(buses ${scriptBus.index} script / ${hostBus.index} host)`);
      }
      run().catch((e) => verdict(`FAIL: ${e}`));
    </script>
  </body>
</html>
