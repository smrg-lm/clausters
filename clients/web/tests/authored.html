<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters authored-bundle acceptance</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #0d0d12; color: #ddd;
                   font-family: system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 46rem; margin: 0 auto; padding: 24px 16px; }
      p { font-size: 14px; }
      canvas { display: block; width: 100%; height: 240px; margin: 18px 0; }
      #verdict { font-size: 13px; white-space: pre-wrap; color: #9c9; }
    </style>
  </head>
  <body>
    <main>
      <h1>A bundle authored in the page, mounted without a disk</h1>
      <p id="verdict">running…</p>

      <p>The other half of the writer: <code>write</code> takes a directory and
      is a node verb, <code>files</code> is the same bundle as text — and a
      page that has just authored one mounts what it holds, with nothing
      served and nothing fetched.</p>

      <canvas id="surface"></canvas>
    </main>

    <!--
      W15's page half. The writer authors a bundle in the tab; `openBundle`
      mounts it from `files` rather than from a `base` URL:

        - the writer emits the whole directory as text, validated through the
          core exactly as `write` would validate it;
        - the mount draws it, allocates its symbols and boots it;
        - nothing was fetched: no request for a bundle path appears in the
          page's own resource timeline, which is what "without a round trip
          through disk" means;
        - the unmount gives back everything the mount took.

      The verdict is beaconed as a fetch — the standard web-smoke posture
      (docs/decisions.md).
    -->
    <script type="module">
      import {
        Bundle, defs, gui, openBundle, startBundle, freeBundle, startPage,
        server, ANY_PEER, loadCore,
      } from "/dist/index.js";
      import { decodePacket } from "/dist/base/osc.js";

      const verdict = (text) => {
        document.getElementById("verdict").textContent = text;
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };

      async function until(cond, what, ms = 20000) {
        const t0 = performance.now();
        for (;;) {
            if (cond()) return;
            if (performance.now() - t0 > ms) {
                throw new Error(typeof what === "function" ? what() : what);
            }
            await new Promise((r) => setTimeout(r, 100));
        }
      }

      // The instrument: a tone whose amplitude follows an LFO, and the LFO
      // published on a control bus so a meter can draw it. The bus reaches the
      // def as a **control** — the rule that lets two instances share one def.
      function tone() {
        const freq = defs.control("freq", 220.0);
        const lfoBus = defs.control("lfo_bus", 0.0);
        const lfo = defs.sine(3.0).mul(0.4).add(0.5);
        return new defs.SynthDef(
          "tone",
          defs.out(0.0, defs.sine(freq).mul(lfo).mul(0.1)),
          defs.outCtl(lfoBus, lfo),
        );
      }

      function authored() {
        const b = new Bundle("page-voice");
        const freq = b.param("freq", "float", { default: 220.0, min: 60.0, max: 700.0 });
        const title = b.param("title", "string", { default: "authored here" });
        const lfo = b.bus("lfo");
        const node = b.node("tone");
        b.synthdef(tone());
        b.gui(
          gui.view(
            { title, layout: "col", w: 480, h: 240 },
            gui.knob({ label: "freq", value: freq, min: 60.0, max: 700.0,
                       bind: ["/node_set", node, "freq"], id: 2 }),
            gui.meter(lfo, { rate: "control", label: "lfo", id: 3 }),
          ),
        );
        b.boot(["/synth_new", "page-voice.tone", node, 0, 0,
                "freq", freq, "lfo_bus", lfo]);
        return b;
      }

      async function accept() {
        // The core is the writer's validator, so it goes in first — the same
        // `await loadCore()` a node script writing a bundle would run, here
        // finding the module next to the glue instead of on disk.
        await loadCore();
        const files = authored().files({ tag: "page-voice" });
        const paths = Object.keys(files).sort().join(" ");
        const expected = ["bundle.json", "defs/guidefs/page-voice.json",
                          "defs/synthdefs/page-voice.tone.json", "index.js"].join(" ");
        if (paths !== expected) throw new Error(`the writer emitted ${paths}`);

        const canvas = document.getElementById("surface");
        const box = canvas.getBoundingClientRect();
        canvas.width = Math.round(box.width * devicePixelRatio);
        canvas.height = Math.round(box.height * devicePixelRatio);
        const mounted = await openBundle({ files, canvas, attributes: { freq: "330" } });
        if (mounted.params.freq !== 330) {
            throw new Error(`the attribute did not resolve: ${mounted.params.freq}`);
        }
        if (!(mounted.symbols.tone > 0) || !(mounted.symbols.lfo > 0)) {
            throw new Error(`nothing was allocated: ${JSON.stringify(mounted.symbols)}`);
        }

        // Phase 2: the def, and the boot that instantiates it.
        await startPage();
        await startBundle(mounted);
        const engine = await server();

        const seen = new Set();
        let failed = null;
        // ANY_PEER: the snapshots belong to the host's subscription, not to
        // this script's client, and replies are addressed per client.
        engine.addReply((bytes) => {
          for (const { addr, args } of decodePacket(bytes)) {
            if (addr === "/fail") failed = JSON.stringify(args);
            if (addr !== "/bus_stream.reply") continue;
            for (let i = 0; i + 1 < args.length; i += 2) {
              if (args[i] === mounted.symbols.lfo) seen.add(args[i + 1]);
            }
          }
        }, ANY_PEER);
        await until(() => seen.size >= 3,
                    () => `the meter never moved (${seen.size} values, ${failed})`);
        if (failed) throw new Error(`/fail: ${failed}`);

        // Nothing was served: the bundle never existed anywhere but in this
        // tab. (The page's own modules are in the timeline, of course — what
        // must not be there is a bundle path.)
        const fetched = performance.getEntriesByType("resource")
          .filter((r) => /page-voice|bundle\.json|defs\/guidefs/.test(r.name));
        if (fetched.length > 0) {
            throw new Error(`the mount fetched ${fetched.map((r) => r.name)}`);
        }

        await freeBundle(mounted);
        verdict(`PASS: a bundle authored in the page mounted from memory ` +
          `(node ${mounted.symbols.tone}, bus ${mounted.symbols.lfo}), ` +
          `freq="330" resolved, its meter moved over ${seen.size} values, ` +
          `and nothing was fetched to do it`);
      }

      accept().catch((error) => verdict(`FAIL: ${error}`));
    </script>
  </body>
</html>
