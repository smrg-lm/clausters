# Read the Docs build for the Clausters web client documentation.
#
# This repository hosts THREE documentation sites (one per platform); each is a
# separate Read the Docs project pointing at its own config file via the
# project's "Settings > Advanced > Path to configuration file":
#   - the server/workspace book -> repo-root .readthedocs.yaml      (builds docs/)
#   - the Python client book    -> clients/python/.readthedocs.yaml
#   - this web client book      -> clients/web/.readthedocs.yaml    (this file)
#
# Read the Docs has no native mdBook builder, so the build is driven with
# build.commands: fetch a prebuilt mdBook, generate the API pages with TypeDoc,
# build the book, and copy the HTML into $READTHEDOCS_OUTPUT/html. TypeDoc
# parses the sources with its own TypeScript 5.9 (installed here, never saved
# into the package's node_modules, whose TypeScript is the v7 that compiles the
# package); the package itself is never built.
#
# Its dev dependencies are installed all the same: the parse reads the
# package's tsconfig, which asks for the `node` type library, so without them
# TypeDoc stops at TS2688 -- and it treats warnings as errors. A checkout is
# not a working copy; nothing here exists that the repository does not carry.
version: 2

build:
  os: ubuntu-24.04
  tools:
    nodejs: "22"
  commands:
    - npm install --no-save --prefix "$HOME/typedoc" typedoc@0.28 typedoc-plugin-markdown@4 typescript@5.9
    - mkdir -p "$HOME/bin"
    - |
      MDBOOK_VERSION=0.4.40
      # `-f` and the retries are the whole point of spelling this out: piped
      # into tar, a 5xx or a rate-limit page downloads as HTML and fails as
      # "gzip: stdin: not in gzip format" -- a red build blaming the books
      # for a blip at the other end of the wire.
      curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
        "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
        | tar -xz -C "$HOME/bin"
    - bash -c "cd clients/web && npm ci"
    - bash -c "cd clients/web && $HOME/typedoc/node_modules/.bin/typedoc"
    - "$HOME/bin/mdbook build clients/web/docs"
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -r clients/web/docs/book/. "$READTHEDOCS_OUTPUT/html/"
