<!doctype html><html><body><div id="stage" style="width:900px;height:220px"></div><pre id="log"></pre>
<script type="module">
import { loadOsc, loadCore, GuiHost, guiHost, gui } from "../dist/index.js";
const log = (l) => { document.getElementById("log").textContent += l + "\n"; };
try {
  await loadOsc(); await loadCore();
  const host = await GuiHost.page();
  const page = await guiHost();
  document.getElementById("stage").append(page.canvas);
  const SR = 48000, TEMPO = 2, BEAT = SR / TEMPO;
  const win = host.open(gui.window({ title: "curve", layout: "col", margin: 8 },
    gui.track({ name: "lane", label: "sweep", sampleRate: SR, tempo: TEMPO },
      gui.clip({ name: "c1", offset: 0, dur: 4 * BEAT, label: "flat-quads",
                 points: [0, 200, 2, 0, 2 * BEAT, 900, 2, 0, 4 * BEAT, 300, 1, 0],
                 points_min: 130, points_max: 970 }),
    ),
    gui.track({ name: "lane2", label: "sweep2", sampleRate: SR, tempo: TEMPO },
      gui.clip({ name: "c2", offset: 0, dur: 4 * BEAT, label: "tuples+minmax",
                 points: [[0, 200, "exp"], [2 * BEAT, 900, "exp"], [4 * BEAT, 300, "lin"]],
                 min: 130, max: 970, exp: true }),
    ),
  ));
  page.fit(win.id, document.getElementById("stage"));
  await new Promise((r) => setTimeout(r, 800));
  for (const name of ["c1", "c2"]) {
    const info = await host.query(win.widget(name).id).catch((e) => String(e));
    log(name + ": " + JSON.stringify(info));
  }
} catch (e) { log("error: " + e); }
</script></body></html>
