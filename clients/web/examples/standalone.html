<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters standalone (browser)</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12;
                   color: #dddddd; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
      #bar button { background: #22222c; color: #ddd; border: 1px solid #444;
                    padding: 4px 10px; cursor: pointer; font: inherit; }
      #note { padding: 0 12px 8px; font-size: 13px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="bar"><button id="power">Power</button></div>
    <div id="note">a native-saved standalone bundle, booted entirely in this
tab: the engine in an AudioWorklet, the GUI host on a canvas, no server
process anywhere. Press Power (the autoplay gesture) to boot.</div>

    <!--
      The browser twin of `clausters-gui --standalone <name>`, on the raw
      package API (the element version is examples/demo.html): fetches the
      bundle (?bundle=<url prefix>, default "../bundle-demo"; ?name=<GuiDef
      name>, default the manifest's) and boots it with `bootBundle` over the
      page singletons. See src/bundle.ts for the manifest, and
      docs/clients.md for the quick start.

      ?smoke=1 is the scripted-acceptance mode (scripts/smoke-web-standalone.sh
      under headless Chrome): boots without the gesture, watches the streamed
      /c_set of the GuiDef's meter bus, and beacons a PASS/FAIL verdict as a
      fetch the runner reads from the HTTP access log.
    -->
    <script type="module">
      import { server, bootBundle, loadOsc, decodePacket }
        from "../dist/index.js";

      const params = new URLSearchParams(location.search);
      const smoke = params.has("smoke");
      const note = (text) => {
        document.getElementById("note").textContent = text;
      };
      const verdict = (text) => {
        note(text);
        document.title = text.split("\n")[0];
        fetch(`/smoke-verdict-${encodeURIComponent(text.split("\n")[0])}`)
          .catch(() => {});
      };

      const boot = async () => {
        const engine = await server();
        await engine.resume();
        await loadOsc();

        // Observe the bus stream for the harness/smoke readout: every
        // /c_set the meter subscription brings in.
        let snapshots = 0;
        const seen = new Set();
        let dead = null;
        engine.addReply((bytes) => {
          for (const { addr, args } of decodePacket(bytes)) {
            if (addr === "/fail") dead = `engine /fail: ${JSON.stringify(args)}`;
            if (addr !== "/c_set") continue;
            snapshots += 1;
            for (let i = 0; i + 1 < args.length; i += 2) seen.add(args[i + 1]);
          }
        });

        const { id } = await bootBundle({
          base: params.get("bundle") ?? "../bundle-demo",
          name: params.get("name"),
        });
        note(`bundle up: GuiDef ${id} opened, engine live (context ` +
             `${engine.context.sampleRate} Hz). Meters stream over /c_stream.`);

        if (!smoke) return;
        // Smoke asserts: the meter's control bus streams (proof the host
        // parsed the GuiDef, subscribed /c_stream over the in-page leg, and
        // the engine's boot /s_new is producing values) with at least two
        // distinct values (the LFO moves — a live meter, not a stuck one).
        const t0 = performance.now();
        while (performance.now() - t0 < 20000) {
          if (dead) throw new Error(dead);
          const moving = [...seen].filter((v) => Math.abs(v) > 0.01);
          if (snapshots >= 5 && moving.length >= 2) {
            return verdict(`PASS: GuiDef ${id} up; ${snapshots} /c_set ` +
              `snapshots, ${moving.length} distinct live values`);
          }
          await new Promise((r) => setTimeout(r, 100));
        }
        throw new Error(`meter stream never moved (${snapshots} snapshots, ` +
          `values ${JSON.stringify([...seen])})`);
      };

      const power = document.getElementById("power");
      power.onclick = () => {
        power.disabled = true;
        boot().catch((e) => verdict(`FAIL: ${e}`));
      };
      if (smoke) {
        power.disabled = true;
        boot().then(
          () => {},
          (e) => verdict(`FAIL: ${e}`),
        );
      }
    </script>
  </body>
</html>
