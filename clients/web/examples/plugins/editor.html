<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Native effect editor</title>
<!--
Same calls, names and tones as clients/python/examples/plugins/editor.py.
Build the web package and serve this tree. Start a native server with
--ws 57112 and plugin-clap,plugin-vst3, with its matching helper beside it.
Python boots that process; a page attaches to one started separately.
List the plugins: the server looks in the standard CLAP and VST3
directories, or in the directory or binary given, and the list holds the
effects it found that have a native editor. Choose a mono/stereo effect with
an audible preset and an X11 editor, such as "Parametric Equalizer x8
Stereo". The repository CLAP gain and VST3 fixtures also work. Edit the
native window on the server's machine while the quiet tones play; Finish
closes the session.
-->
<label>Server <input id="url" value="ws://127.0.0.1:57112"></label><br>
<label>Directory or binary on server (optional) <input id="path"></label>
<button id="list">List plugins</button><br>
<label>Effect <select id="plugin"></select></label><br>
<button id="open" disabled>Open editor</button><button id="finish" disabled>Finish</button>
<pre id="log"></pre>
<script type="module">
import { PluginDef, Session, Synth, SynthDef, defs } from "../../dist/index.js";
const { out, sine } = defs;
const $ = (id) => document.getElementById(id);
const smoke = new URLSearchParams(location.search).has("smoke");
let session = null, catalog = null;
async function finish() {
    if (session) await session.close();
    session = null; catalog = null;
    $("plugin").replaceChildren(); $("open").disabled = true; $("finish").disabled = true;
}
$("list").onclick = async () => {
    try {
        $("list").disabled = true;
        await finish();
        session = (await Session.live($("url").value)).activate();
        // The catalog is what the server found installed; its effects with a
        // native editor fill the list, each named by what it is called and its format.
        const paths = $("path").value ? [$("path").value] : [];
        catalog = await session.server.plugins(paths, { timeout: 60.0 });
        const effects = catalog.effects().filter((p) => p.hasEditor);
        $("plugin").replaceChildren(...effects.map((p) =>
            new Option(`${p.name} (${p.format}, ${p.vendor})`, JSON.stringify({ name: p.name, format: p.format }))));
        $("open").disabled = !effects.length;
        $("log").textContent = `${effects.length} effects with an editor found.`;
    } catch (error) { $("log").textContent = String(error); await finish(); }
    finally { $("list").disabled = false; }
};
$("open").onclick = async () => {
    let source, voice;
    try {
        $("open").disabled = true; $("list").disabled = true;
        const server = session.server;
        // The one chosen carries its ports, parameters and identity.
        const { name, format } = JSON.parse($("plugin").value);
        const effect = catalog.find(name, { format, kind: "effect" });
        if (!effect.hasEditor) throw new Error("choose an effect with a native X11 editor");
        // Its main input reads bus 4, where the tones are; its main output is bus 0.
        // A tmp_ name keeps the def out of the data directory: a stored plugin def
        // is probed again on every boot, and this one means nothing to a later session.
        await new PluginDef("tmp_editor_effect", effect, { inputs: 4 }).send(server);
        await new SynthDef("editor_tone", out(4.0, sine(220.0).mul(0.08)), out(5.0, sine(330.0).mul(0.08))).send(server);
        source = new Synth("editor_tone", {}, { server });
        voice = new Synth("tmp_editor_effect", {}, { server });
        await server.sync();
        await voice.openPluginEditor();
        $("log").textContent = JSON.stringify(await voice.queryPluginEditor());
        await voice.closePluginEditor();
        await voice.openPluginEditor();
        $("finish").disabled = false;
        await new Promise((resolve) => { $("finish").onclick = resolve; });
        await voice.closePluginEditor();
        voice.free(); source.free(); await finish();
        $("log").textContent = "Native editor closed; session finished.";
        if (smoke) await fetch("/smoke-verdict-PASS-plugin-editor");
    } catch (error) {
        $("log").textContent = String(error); await finish();
        if (smoke) await fetch(`/smoke-verdict-FAIL-${encodeURIComponent(String(error))}`);
    } finally { $("list").disabled = false; }
};
if (smoke) {
    const params = new URLSearchParams(location.search);
    $("url").value = params.get("url") ?? $("url").value;
    $("path").value = params.get("path") ?? "";
    await $("list").onclick();
    const wanted = [...$("plugin").options].find((o) => JSON.parse(o.value).name === params.get("name"));
    if (wanted) $("plugin").value = wanted.value;
    $("open").click();
}
</script></html>
