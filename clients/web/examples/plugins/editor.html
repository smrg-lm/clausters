<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Native effect editor</title>
<!--
Same calls, names and tones as clients/python/examples/plugins/editor.py.
Build the web package and serve this tree. Start a native server with
--ws 57112 and plugin-clap,plugin-vst3, with its matching helper beside it.
Python boots that process; a page attaches to one started separately.
Name the effect by what it is called, as server.plugins() lists them; the
server looks in the standard CLAP and VST3 directories, or in the directory
or binary given, and the format says which when the name is in both.
Choose a mono/stereo effect with an audible preset and an X11 editor, such as
"Parametric Equalizer x8 Stereo". The repository CLAP gain and VST3 fixtures
also work. Edit the native window on the server's machine while the quiet
tones play; Finish closes the session.
-->
<label>Server <input id="url" value="ws://127.0.0.1:57112"></label><br>
<label>Plugin name <input id="name" placeholder="Parametric Equalizer x8 Stereo"></label><br>
<label>Directory or binary on server (optional) <input id="path"></label><br>
<label>Format (optional) <input id="format" placeholder="clap or vst3"></label><br>
<button id="open">Open editor</button><button id="finish" disabled>Finish</button>
<pre id="log"></pre>
<script type="module">
import { PluginDef, Session, Synth, SynthDef, defs } from "../../dist/index.js";
const { out, sine } = defs;
const $ = (id) => document.getElementById(id);
$("open").onclick = async () => {
    let session, source, voice;
    try {
        $("open").disabled = true;
        session = (await Session.live($("url").value)).activate();
        const server = session.server;
        // The catalog is what the server found installed: the effect is found by
        // its name, and carries its ports, parameters and identity.
        const paths = $("path").value ? [$("path").value] : [];
        const effect = (await server.plugins(paths, { timeout: 60.0 })).find(
            $("name").value, { format: $("format").value || undefined, kind: "effect" });
        if (!effect.hasEditor) throw new Error("choose an effect with a native X11 editor");
        // Its main input reads bus 4, where the tones are; its main output is bus 0.
        // A tmp_ name keeps the def out of the data directory: a stored plugin def
        // is probed again on every boot, and this one means nothing to a later session.
        await new PluginDef("tmp_editor_effect", effect, { inputs: 4 }).send(server);
        await new SynthDef("editor_tone", out(4.0, sine(220.0).mul(0.08)), out(5.0, sine(330.0).mul(0.08))).send(server);
        source = new Synth("editor_tone", {}, { server });
        voice = new Synth("tmp_editor_effect", {}, { server });
        await server.sync();
        await voice.openPluginEditor();
        $("log").textContent = JSON.stringify(await voice.queryPluginEditor());
        await voice.closePluginEditor();
        await voice.openPluginEditor();
        $("finish").disabled = false;
        await new Promise((resolve) => { $("finish").onclick = resolve; });
        await voice.closePluginEditor();
        voice.free(); source.free(); await session.close(); session = null;
        $("log").textContent = "Native editor closed; session finished.";
        if (new URLSearchParams(location.search).has("smoke")) await fetch("/smoke-verdict-PASS-plugin-editor");
    } catch (error) {
        $("log").textContent = String(error);
        if (new URLSearchParams(location.search).has("smoke")) await fetch(`/smoke-verdict-FAIL-${encodeURIComponent(String(error))}`);
    } finally { if (session) await session.close(); $("open").disabled = false; $("finish").disabled = true; }
};
const params = new URLSearchParams(location.search);
if (params.has("smoke")) {
    $("url").value = params.get("url") ?? $("url").value;
    $("name").value = params.get("name") ?? "";
    $("path").value = params.get("path") ?? "";
    $("format").value = params.get("format") ?? "";
    $("open").click();
}
</script></html>
