<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Persistent native instrument</title>
<!--
Same calls and event sequence as clients/python/examples/plugins/persistent.py.
Start a native server built with plugin-clap,plugin-vst3, its matching helper
beside it (the Linux package and scripts/refresh-bin.sh both provide that
pair), with --ws 57112; build the web package and serve this tree over HTTP.
This page attaches to that server; a page cannot boot a native process
(Python can). Name an installed CLAP or VST3 instrument by what it is
called, as server.plugins() lists them; the server looks in the standard
CLAP and VST3 directories, or in the directory or binary given, and the
format says which when the name is in both. It needs a native
note-expression port and an audible initial preset, such as Surge XT; an
effects collection has none. Samplers need samples in their initial state.
-->
<label>Server <input id="url" value="ws://127.0.0.1:57112"></label><br>
<label>Plugin name <input id="name" placeholder="Surge XT"></label><br>
<label>Directory or binary on server (optional) <input id="path"></label><br>
<label>Format (optional) <input id="format" placeholder="clap or vst3"></label><br>
<button id="play">Play</button><pre id="log"></pre>
<script type="module">
import { Group, PluginDef, Routine, Session, Synth } from "../../dist/index.js";
const $ = (id) => document.getElementById(id);
$("play").onclick = async () => {
    let session, voice, governed;
    try {
        $("play").disabled = true;
        session = (await Session.live($("url").value)).activate();
        session.clock.setTempo(2.0);
        const server = session.server;
        // The catalog is what the server found installed: the instrument is found
        // by its name, and carries its ports, parameters and identity.
        const paths = $("path").value ? [$("path").value] : [];
        const keys = (await server.plugins(paths, { timeout: 60.0 })).find(
            $("name").value, { format: $("format").value || undefined, kind: "instrument" });
        if (!keys.noteInputs.length || !(keys.noteInputs[0].dialects & 1)) throw new Error("choose an instrument with a native note-expression port");
        // Its main output is bus 0. A tmp_ name keeps the def out of the data
        // directory: a stored plugin def is probed again on every boot, and this
        // one means nothing to a later session.
        await new PluginDef("tmp_persistent_keys", keys).send(server);
        // The instrument is outside the governed group, so live input keeps
        // processing during a stop. Notes go to its main note input.
        governed = new Group({ server });
        voice = new Synth("tmp_persistent_keys", {}, { target: 0, server });
        await server.setTransport(0, 2.0);
        await server.transportGroup(governed);
        await server.laneNew(3100, governed);
        await server.laneSet(3100, { notes: [
            [12000, 48000, { plugin: voice.id }, { key: 64, velocity: 0.15 }, "gate"],
            [60000, 108000, { plugin: voice.id }, { key: 69, velocity: 0.15 }, "gate"],
        ] });
        await server.transportPlay();
        function* phrase() {
            voice.pluginEvent({ kind: "note_on", source: 1, note_id: 1, channel: 0, key: 60, value: 0.15 });
            voice.pluginEvent({ kind: "note_on", source: 1, note_id: 2, channel: 0, key: 67, value: 0.15 });
            yield 0.5;
            voice.pluginEvent({ kind: "expression", source: 1, note_id: 1, channel: 0, key: 60, id: 6, value: 0.4 });
            yield 0.5;
            voice.pluginEvent({ kind: "note_off", source: 1, note_id: 1, channel: 0, key: 60, value: 0.0 });
            yield 1.0;
            voice.pluginEvent({ kind: "note_off", source: 1, note_id: 2, channel: 0, key: 67, value: 0.0 });
        }
        new Routine(phrase).play();
        await session.run(3.0);
        if ((await server.status()).synths !== 1) throw new Error("notes must share one persistent instance");
        await server.transportStop();
        await server.laneFree(3100);
        voice.free(); governed.free(); await session.close(); session = null;
        $("log").textContent = "Played live notes and lane notes on one persistent instance.";
        if (new URLSearchParams(location.search).has("smoke")) await fetch("/smoke-verdict-PASS-persistent-plugin");
    } catch (error) { $("log").textContent = String(error); if (new URLSearchParams(location.search).has("smoke")) await fetch(`/smoke-verdict-FAIL-${encodeURIComponent(String(error))}`); }
    finally { if (session) await session.close(); $("play").disabled = false; }
};
const params = new URLSearchParams(location.search);
if (params.has("smoke")) {
    $("url").value = params.get("url") ?? $("url").value;
    $("name").value = params.get("name") ?? "";
    $("path").value = params.get("path") ?? "";
    $("format").value = params.get("format") ?? "";
    $("play").click();
}
</script></html>
