<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Persistent native instrument</title>
<!--
Same calls and event sequence as clients/python/examples/plugins/persistent.py.
The instrument is one node; the lane, the live notes and a pattern whose
Events name that node as their instrument all play it, and none of them makes
a node of its own.
Start a native server built with plugin-clap,plugin-vst3, its matching helper
beside it (the Linux package and scripts/refresh-bin.sh both provide that
pair), with --ws 57112; build the web package and serve this tree over HTTP.
This page attaches to that server; a page cannot boot a native process
(Python can). List the plugins: the server looks in the standard CLAP and
VST3 directories, or in the directory or binary given, and the list holds the
instruments it found with a native note-expression port; an effects
collection has none. Choose one with an audible initial preset, such as
Surge XT.
Samplers need samples in their initial state.
-->
<label>Server <input id="url" value="ws://127.0.0.1:57112"></label><br>
<label>Directory or binary on server (optional) <input id="path"></label>
<button id="list">List plugins</button><br>
<label>Instrument <select id="plugin"></select></label><br>
<button id="play" disabled>Play</button><pre id="log"></pre>
<script type="module">
import { Group, PluginDef, Routine, Session, Synth, seq } from "../../dist/index.js";
const $ = (id) => document.getElementById(id);
const smoke = new URLSearchParams(location.search).has("smoke");
let session = null, catalog = null;
async function finish() {
    if (session) await session.close();
    session = null; catalog = null;
    $("plugin").replaceChildren(); $("play").disabled = true;
}
$("list").onclick = async () => {
    try {
        $("list").disabled = true;
        await finish();
        session = (await Session.live($("url").value)).activate();
        session.clock.setTempo(2.0);
        // The catalog is what the server found installed; its instruments with a
        // native note-expression port fill the list, each named by what it is
        // called and its format.
        const paths = $("path").value ? [$("path").value] : [];
        catalog = await session.server.plugins(paths, { timeout: 60.0 });
        const instruments = catalog.instruments().filter((p) => p.noteInputs.length && p.noteInputs[0].dialects & 1);
        $("plugin").replaceChildren(...instruments.map((p) =>
            new Option(`${p.name} (${p.format}, ${p.vendor})`, JSON.stringify({ name: p.name, format: p.format }))));
        $("play").disabled = !instruments.length;
        $("log").textContent = `${instruments.length} instruments with note expression found.`;
    } catch (error) { $("log").textContent = String(error); await finish(); }
    finally { $("list").disabled = false; }
};
$("play").onclick = async () => {
    let voice, governed;
    try {
        $("play").disabled = true; $("list").disabled = true;
        const server = session.server;
        const { name, format } = JSON.parse($("plugin").value);
        const keys = catalog.find(name, { format, kind: "instrument" });
        if (!keys.noteInputs.length || !(keys.noteInputs[0].dialects & 1)) throw new Error("choose an instrument with a native note-expression port");
        // Its main output is bus 0. A tmp_ name keeps the def out of the data
        // directory: a stored plugin def is probed again on every boot, and this
        // one means nothing to a later session.
        await new PluginDef("tmp_persistent_keys", keys).send(server);
        // The instrument is outside the governed group, so live input keeps
        // processing during a stop. Notes go to its main note input.
        governed = new Group({ server });
        voice = new Synth("tmp_persistent_keys", {}, { target: 0, server });
        await server.setTransport(0, 2.0);
        await server.transportGroup(governed);
        await server.laneNew(3100, governed);
        await server.laneSet(3100, { notes: [
            [12000, 48000, { node: voice.id }, { key: 64, velocity: 0.15 }, "gate"],
            [60000, 108000, { node: voice.id }, { key: 69, velocity: 0.15 }, "gate"],
        ] });
        await server.transportPlay();
        function* phrase() {
            voice.pluginEvent({ kind: "note_on", source: 1, note_id: 1, channel: 0, key: 60, value: 0.15 });
            voice.pluginEvent({ kind: "note_on", source: 1, note_id: 2, channel: 0, key: 67, value: 0.15 });
            yield 0.5;
            voice.pluginEvent({ kind: "expression", source: 1, note_id: 1, channel: 0, key: 60, id: 6, value: 0.4 });
            yield 0.5;
            voice.pluginEvent({ kind: "note_off", source: 1, note_id: 1, channel: 0, key: 60, value: 0.0 });
            yield 1.0;
            voice.pluginEvent({ kind: "note_off", source: 1, note_id: 2, channel: 0, key: 67, value: 0.0 });
        }
        new Routine(phrase).play();
        // A pattern plays the same node: each event names it as its
        // instrument, so each note is a note of the plugin, not a synth.
        seq.pbind({ instrument: voice, midinote: seq.pseq([72, 74, 76, 79]), dur: 0.5, amp: 0.15 }).play();
        await session.run(4.0);
        if ((await server.status()).synths !== 1) throw new Error("notes must share one persistent instance");
        await server.transportStop();
        await server.laneFree(3100);
        voice.free(); governed.free(); await finish();
        $("log").textContent = "Played live notes and lane notes on one persistent instance.";
        if (smoke) await fetch("/smoke-verdict-PASS-persistent-plugin");
    } catch (error) {
        $("log").textContent = String(error); await finish();
        if (smoke) await fetch(`/smoke-verdict-FAIL-${encodeURIComponent(String(error))}`);
    } finally { $("list").disabled = false; }
};
if (smoke) {
    const params = new URLSearchParams(location.search);
    $("url").value = params.get("url") ?? $("url").value;
    $("path").value = params.get("path") ?? "";
    await $("list").onclick();
    const wanted = [...$("plugin").options].find((o) => JSON.parse(o.value).name === params.get("name"));
    if (wanted) $("plugin").value = wanted.value;
    $("play").click();
}
</script></html>
