<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters-gui (web)</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0d12;
        color: #dddddd;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #bar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        flex-wrap: wrap;
      }
      #bar input {
        background: #1a1a22;
        color: #ddd;
        border: 1px solid #333;
        padding: 4px 6px;
        width: 220px;
      }
      #bar button {
        background: #22222c;
        color: #ddd;
        border: 1px solid #444;
        padding: 4px 10px;
        cursor: pointer;
      }
      #note {
        padding: 0 12px 8px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <input id="server" value="ws://127.0.0.1:57120" />
      <button id="connect">connect</button>
      <button id="panel">panel</button>
      <button id="meters">meters</button>
      <button id="bulk">bulk</button>
    </div>
    <div id="note">
      clausters-gui browser host. Renders over WebGPU where available and falls
      back to WebGL2 otherwise. Connect to a `--ws` audio server, then open a
      demo; see docs/clients.md ("The GUI host in the browser").
    </div>

    <!--
      Throwaway harness — explicitly NOT a product client (the TypeScript client
      is the separate clients/web track). It only proves the host: each demo
      builds the same GuiDef JSON the Python builders emit (the panel, meters
      and bulk examples) and feeds it through the binding surface.

      - panel:  controls + an inline waveform; turning a control logs a
        /gui_event; the bound `freq` knob forwards straight to the server.
      - meters: a meter + scope on control bus 10 streamed over WebSocket
        (/c_stream), driven by the bound `bus 10` knob — a self-contained
        loop: knob -> /c_set -> server -> /c_set snapshots -> meter.
      - bulk:   three waveforms — a fetched peak cache (tests/sine.peaks),
        fetched raw f32 samples (tests/sine.f32, pyramid built in wasm), and
        a server buffer pulled over /b_query + chunked /b_getn. Generate the
        two files and buffer with gui_bulk.py's setup.
    -->
    <script type="module">
      import init, { start } from "../dist/gui-host/clausters_gui.js";

      // A short synthetic signal for the inline waveform view.
      const N = 4096;
      const data = Array.from({ length: N }, (_, i) => {
        const t = i / N;
        return Math.sin(t * Math.PI * 12) * (1 - t) * 0.85;
      });

      // The same shapes the Python GuiDef builders emit: a tree of
      // {id, type, ...props, children}.
      const defs = {
        panel: {
          type: "window",
          title: "clausters-gui (web)",
          w: 480,
          h: 420,
          layout: "col",
          children: [
            { id: 1, type: "label", text: "clausters-gui over the binding surface" },
            { id: 2, type: "slider", label: "cutoff", min: 20.0, max: 20000.0, value: 800.0 },
            { id: 3, type: "knob", label: "res", min: 0.0, max: 1.0, value: 0.3 },
            {
              id: 4,
              type: "knob",
              label: "freq",
              min: 50.0,
              max: 2000.0,
              value: 220.0,
              bind: ["/n_set", 1000, "freq"],
            },
            { id: 5, type: "toggle", label: "gate", value: 1 },
            { id: 6, type: "button", label: "ping" },
            { id: 7, type: "waveform", data: data, base_bucket: 64 },
          ],
        },
        meters: {
          type: "window",
          title: "Meters over WebSocket",
          w: 640,
          h: 440,
          layout: "col",
          children: [
            { id: 1, type: "label", text: "bus 10 streamed with /c_stream (no shm)" },
            {
              id: 2,
              type: "panel",
              layout: "row",
              children: [
                { id: 10, type: "knob", label: "bus 10", min: -1.0, max: 1.0, value: 0.0, bind: ["/c_set", 10] },
                { id: 11, type: "meter", bus: 10, min: -1.0, max: 1.0, label: "bus" },
                { id: 12, type: "scope", bus: 10, min: -1.0, max: 1.0, label: "bus" },
              ],
            },
          ],
        },
        bulk: {
          type: "window",
          title: "Bulk data in the browser",
          w: 640,
          h: 520,
          layout: "col",
          children: [
            { id: 1, type: "label", text: "peak cache (fetch)" },
            { id: 2, type: "waveform", cache: "../tests/sine.peaks" },
            { id: 3, type: "label", text: "raw f32 (fetch + wasm pyramid)" },
            { id: 4, type: "waveform", path: "../tests/sine.f32", base_bucket: 512 },
            { id: 5, type: "label", text: "server buffer 0 (/b_getn over WS)" },
            { id: 6, type: "waveform", buffer: 0 },
          ],
        },
      };

      init()
        .then(() => {
          const gui = start();
          const note = document.getElementById("note");
          let events = 0;
          let connected = "";

          document.getElementById("connect").onclick = () => {
            connected = document.getElementById("server").value;
            gui.connect_server(connected);
          };
          for (const name of ["panel", "meters", "bulk"]) {
            document.getElementById(name).onclick = () =>
              gui.def(1, JSON.stringify(defs[name]));
          }

          // Drain the host's outbound events (also logged to the console by the
          // host). A real client would decode these OSC packets; here we just
          // count them so the queue does not grow.
          setInterval(() => {
            while (gui.poll()) events += 1;
            note.textContent =
              "open a demo; /gui_event count: " + events +
              (connected ? " | server: " + connected : " | not connected");
          }, 150);
        })
        .catch((e) => {
          document.getElementById("note").textContent =
            "failed to start (no WebGPU or WebGL2 available?): " + e;
        });
    </script>
  </body>
</html>
