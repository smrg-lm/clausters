<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clausters GUI from TypeScript</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0d12;
        color: #dddddd;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 12px 12px;
      }
      #bar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        flex-wrap: wrap;
      }
      #bar input {
        background: #1a1a22;
        color: #ddd;
        border: 1px solid #333;
        padding: 4px 6px;
        width: 220px;
      }
      #bar button {
        background: #22222c;
        color: #ddd;
        border: 1px solid #444;
        padding: 4px 10px;
        cursor: pointer;
      }
      #note {
        padding: 0 12px 8px;
        font-size: 13px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="play">play a tone</button>
      <button id="panel">panel</button>
      <button id="meters">meters</button>
      <button id="views">views</button>
      <input id="ws" value="ws://127.0.0.1:57220" />
      <button id="remote">drive a native host</button>
    </div>
    <div id="note">building a GUI from TypeScript…</div>

    <!--
      The GUI client, end to end: the GuiDef builders (`gui.window`, `gui.knob`,
      …) compose the tree, `GuiHost` sends it and reads the widgets back, and
      the panel drives the audio engine running in this tab's AudioWorklet —
      no server process anywhere. The same code drives a *native*
      `clausters-gui --ws` host: `GuiHost.connect(url)` instead of
      `GuiHost.page()` is the one line that names a carrier.

      - panel:  a tone's controls. `freq` is **bound** — its value goes
        straight from the host to the engine, with no round trip through this
        script — while `amp` and the waveform selector come back as
        /gui_event and are applied here, so both paths are visible at once.
      - meters: a level meter and a scope on a control bus, with a bound knob
        writing that bus: knob -> /bus_set -> engine -> the host's /bus_stream
        subscription -> the views. A loop with no script in it.
      - views:  the editor-grade waveform and spectrogram of a rendered
        signal, under one navigation group (`link`), plus a bpf envelope
        editor whose break-points come back as a "points" event.
    -->
    <script type="module">
      import {
        loadOsc, pageConnection, server as engine, Server, Bus, Synth,
        SynthDef, GuiHost, gui,
      } from "../dist/index.js";
      import { control, lpf, out, saw } from "../dist/defs/index.js";

      const note = document.getElementById("note");
      const say = (text) => { note.textContent = text; };

      await loadOsc();

      // The audio side: one engine in this tab, one `Server` over it. The
      // AudioContext starts suspended under the autoplay policy and the
      // engine only runs (and answers) while it does, so the server is opened
      // on the first click rather than at load — every button goes through
      // `audio()`.
      const raw = await engine({ channels: 2 });
      let server = null;
      let voice = null;

      async function audio() {
        await raw.resume();
        if (!server) {
          server = await Server.open(await pageConnection());
          // A tone whose cutoff a knob sweeps and whose pitch a bound one does.
          const freq = control("freq", 220.0);
          const amp = control("amp", 0.2);
          const cutoff = control("cutoff", 2000.0);
          await new SynthDef(
            "gui_tone", out(0.0, lpf(saw(freq), cutoff).mul(amp))).send(server);
        }
        return server;
      }

      const playing = () => (voice ??= new Synth("gui_tone", { freq: 220.0, amp: 0.2 }, { server }));

      // The GUI side. `GuiHost.page()` drives the wasm host on this page's
      // canvas; `GuiHost.connect(url)` would drive a native one, and nothing
      // below this line would change.
      let host = await GuiHost.page();

      const panel = () => gui.window(
        { title: "a tone", w: 520, h: 300, layout: "col", margin: 8.0, gap: 8.0 },
        gui.label("freq is bound to the engine; amp and cutoff come back here",
                  { h: 24, textSize: 1.5 }),
        gui.panel(
          { layout: "row" },
          gui.knob({ name: "freq", label: "freq", min: 50.0, max: 2000.0,
                     value: 220.0 }),
          gui.knob({ name: "cutoff", label: "cutoff", min: 100.0, max: 8000.0,
                     value: 2000.0 }),
          gui.slider({ name: "amp", label: "amp", min: 0.0, max: 0.5,
                       value: 0.2, vertical: true, w: 90 }),
        ),
        gui.panel(
          { layout: "row", h: 44 },
          gui.button({ name: "play", label: "play" }),
          gui.button({ name: "stop", label: "stop" }),
        ),
      );

      const meters = (bus) => gui.window(
        { title: "a bus, metered", w: 560, h: 320, layout: "col", gap: 8.0 },
        gui.label(`control bus ${bus}: the knob writes it, the views read it`,
                  { h: 24, textSize: 1.5 }),
        gui.panel(
          { layout: "row" },
          gui.knob({ name: "level", label: `bus ${bus}`, min: -1.0, max: 1.0,
                     value: 0.0, w: 120 }),
          gui.meter(bus, { rate: "control", min: -1.0, max: 1.0,
                           label: "level", w: 80 }),
          gui.scope(bus, { rate: "control", min: -1.0, max: 1.0,
                           label: "history" }),
        ),
      );

      // A short synthetic signal for the heavy views: a decaying sweep.
      const N = 48000;
      const samples = Array.from({ length: N }, (_, i) => {
        const t = i / N;
        return Math.sin(i * 0.02 * (1 + 3 * t)) * (1 - t) ** 2;
      });

      const views = () => gui.window(
        { title: "the editor views", w: 720, h: 560, layout: "col", gap: 8.0 },
        gui.waveform({ name: "wave", blob: 0, sampleRate: 48000.0,
                       baseBucket: 256, ruler: "time", rulerY: "db", link: 1 }),
        gui.spectrogram({ name: "stft", blob: 0, sampleRate: 48000.0,
                          windowSize: 1024, freqScale: "log", link: 1 }),
        gui.bpf({ name: "env", h: 140,
                  points: [[0.0, 0.0], [0.3, 1.0, "exp"], [1.0, 0.0, -4.0]],
                  label: "an envelope — drag a point" }),
      );

      // ---- the three demos, each opened through the same `GuiHost` ----

      // One window at a time here, so each demo closes the last -- and closing
      // takes its canvas with it, because `open` gives every view one of its
      // own. A page that wanted the three side by side would just not close.
      let win = null;
      const open = (tree, blobs = []) => {
        if (win) {
          win.canvas.remove();
          win.close();
        }
        win = host.open(tree, { blobs });
        return win;
      };

      document.getElementById("play").onclick = async () => {
        await audio();               // resumes the context (the gesture)
        playing();
        say("playing — open a demo");
      };

      document.getElementById("panel").onclick = async () => {
        await audio();
        playing();
        const w = open(panel());
        // The bound control: its value never passes through this script.
        w.widget("freq").bind("/node_set", voice.id, "freq");
        // The scripted controls: the event comes here, and this code decides.
        w.widget("cutoff").onEvent((value) => {
          if (voice) voice.set({ cutoff: value });
          say(`cutoff ${value.toFixed(0)} Hz (through the script)`);
        });
        w.widget("amp").onEvent((value) => {
          if (voice) voice.set({ amp: value });
        });
        w.widget("play").onEvent((down) => { if (down) playing(); });
        w.widget("stop").onEvent((down) => {
          if (down && voice) { voice.free(); voice = null; }
        });
        say("panel: turn `freq` (bound, no script) and `cutoff` (scripted)");
      };

      document.getElementById("meters").onclick = async () => {
        await audio();
        const bus = Bus.control(1, { server });
        const w = open(meters(bus.index));
        w.widget("level").bind("/bus_set", bus.index);
        say(`meters: the knob writes bus ${bus.index}; the host streams it back`);
      };

      document.getElementById("views").onclick = () => {
        const w = open(views(), [gui.samplesToBlob(samples)]);
        w.widget("env").onEvent((tag, ...points) => {
          if (tag === "points") say(`envelope edited: ${points.length / 4} points`);
        });
        say("views: zoom with the wheel, drag to select — both lanes move as one");
      };

      // The same client against a native host: only the carrier changes.
      document.getElementById("remote").onclick = async () => {
        const url = document.getElementById("ws").value;
        try {
            host.stop();
            host = await GuiHost.connect(url);
            win = null;
            say(`driving the native host at ${url} — open a demo`);
        } catch (error) {
            say(`could not reach ${url}: ${error}`);
        }
      };

      say("ready: press play (the autoplay gesture), then open a demo");
    </script>
  </body>
</html>
