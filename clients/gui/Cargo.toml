# Independent workspace: this crate is intentionally NOT a member of the root
# `clausters` workspace. It is the GUI client track under `clients/gui` and must
# never entangle the core server build. Building from `clients/gui/` uses this
# manifest; building the core from the repo root ignores it.
[workspace]

[package]
name = "clausters-gui"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Exploratory GUI client track for Clausters: a GPU waveform prototype and the widget-protocol design."

[lib]
name = "clausters_gui"
path = "src/lib.rs"
# `cdylib` so wasm-bindgen can emit the browser host's `.wasm` + JS bindings
# (the G12 web surface); `rlib` so the native binaries still link the library.
crate-type = ["cdylib", "rlib"]

# Binaries are auto-discovered from src/bin/ (waveform, spectrogram, and the
# headless GUI host `clausters-gui`).

[features]
default = ["midi", "notation", "patcher"]
# Live MIDI input painting piano-roll notes (a `midi_in` roll opens a virtual
# input port other apps/devices route into). On by default — the host must
# paint notes when it runs standalone, with no language client to do it — and
# native-only (the dependency below is target-gated off wasm).
midi = ["dep:clausters-midi"]
# Standalone mode: boot a saved GuiDef bundle against an in-process embedded
# server. Off by default because it links the `clausters` server crate (engine +
# audio backend), which is heavy — keeping it opt-in is the size/packaging reason
# the gui is a separate crate. Build with `cargo build --features standalone`.
#
# It pulls the server's `synth` family, because the server is linked with
# `default-features = false` (below) and a bundle whose defs no family can load
# is a window with nothing behind it: `--standalone` skipped every persisted
# SynthDef with a warning and the boot's `/synth_new` failed. `faust` stays
# opt-in (`standalone-faust`) because it needs libfaust at build time; `synth`
# needs nothing.
standalone = ["dep:clausters", "clausters/synth"]
# Standalone with Faust support: also pull the server's `faust` feature so a
# bundle's persisted FaustDefs reload into the embedded server. Needs libfaust
# at build time (see the root LOG.md F0 recipe); without it standalone still
# runs, just skipping FaustDefs (with a warning). Build with
# `cargo build --features standalone-faust`.
standalone-faust = ["standalone", "clausters/faust"]
# The `score` element: music notation, and the fill tessellation (`lyon`) that
# turns SMuFL glyph outlines and engraving fills into the mesh. On by default —
# it is shipped behaviour, and a feature exists so a build can *drop* it, never
# so it has to be asked for. A build with it out drops the `score` row from
# `elements::builtin`, and a def naming one is `Unknown`: laid out, not painted,
# exactly as a host older than that def already behaves.
notation = ["dep:lyon"]
# The `plane`-with-boxes patcher: the graph view and its cord editing. Same
# shape as `notation` — on by default, and a build without it reads a patcher
# node as the ordinary scroll workspace the `plane` name otherwise means.
patcher = []
# A real (outline) typeface behind a glyph atlas, instead of the embedded 5x7
# bitmap. Off by default because it is weight: the rasterizer plus the face a
# build points at are hundreds of kilobytes in a wasm bundle, and a page holding
# forty canvases is the profile this crate optimizes for. With the feature on
# but no face loaded (`--font <path>` natively, `GuiBridge::font` in the page)
# the host draws exactly as it does without it — the bitmap face is the floor,
# never a fallback that has to be reasoned about.
font-atlas = ["dep:fontdue"]

[dependencies]
# The shared OSC seam (single `decode_packet` door, encode/bundle/message,
# timetag math) the host's transports ride. A path dependency on the core: it
# pulls only `rosc`, so the default gui build stays light.
clausters-core = { path = "../../crates/clausters-core" }
# The document's **clipboard**, and nothing else about the document: the host
# holds no composition, but a cut/copy/paste crosses windows, defs and processes
# carrying whatever kind of payload it was given, and that type is the crate's.
# It costs nothing to link -- serde and serde_json, both already here -- and
# building the same JSON by hand in the host would be the second definition of a
# format whose whole point is that one definition crosses everything.
clausters-document = { path = "../../crates/clausters-document" }
# The full server crate, linked ONLY under the `standalone` feature for the
# in-process embedded server (`host::embed`). `embed` exposes the in-process
# `Clausters` API; `realtime` brings the audio backend. Default features off so
# the standalone build does not also pull MIDI/PipeWire. A normal gui build never
# compiles this.
clausters = { path = "../..", default-features = false, features = ["embed", "realtime"], optional = true }
# GuiDef = JSON inside one OSC argument, exactly as a SynthDef/GraphDef. serde's
# number handling keeps ids i32 and control values f32 across the wire.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logging, like the server (the host logs the parsed tree).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
# Fill tessellation for the `score` widget: turns SMuFL glyph outlines and
# engraving fills (beams, slurs, ties) — bezier paths — into the triangle mesh
# the existing painter already draws. Pure Rust, wasm-safe (no compute/storage),
# so the score renderer runs natively and in the browser through one pipeline.
lyon = { version = "1.0", optional = true }
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.13"
# The glyph rasterizer of the `font-atlas` feature: pure Rust, `no_std` by
# default (hashbrown + simd, no `parallel`), so it compiles for wasm32 with no
# system dependency and no C toolchain — which is the whole reason it is this
# crate rather than a FreeType binding.
fontdue = { version = "0.9", optional = true }

# Read-only mmap of the audio server's shared-memory segment, for zero-message
# meters/scopes (`host::shm`). Unix-only — the same raw-mmap path the server's
# IPC uses, and the server's segment is itself Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Live MIDI input (the `midi` feature): the shared MIDI crate's virtual input
# port (midir/ALSA seq), consumed in-process through its safe Rust face.
# Target-gated off wasm — the browser host keeps display parity only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clausters-midi = { path = "../../crates/clausters-midi", features = ["live"], optional = true }
# The WebSocket leg of the script front (`--ws`): the browser's carrier into a
# native host, mirroring the audio server's `osc::ws` (same version).
tungstenite = "0.21"

# The browser host (`host::web`, G12/G13): wasm-bindgen for the JS entry point
# and the binding surface, wasm-bindgen-futures to await the async WebGPU
# bring-up off the main thread, the panic hook so a Rust panic shows in the
# browser console, and `web-sys`/`js-sys` for the console logs and the native
# `WebSocket` carrying the audio-server leg (G13). Native builds pull none.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same wgpu as native, but with the WebGL2 backend compiled in alongside the
# default WebGPU one (cargo unifies features, so the wasm build gets webgpu +
# webgl while native stays webgpu/native-only). This is what lets `gpu.rs` fall
# back to WebGL2 on browsers whose WebGPU is disabled (notably Linux), so the
# web host keeps working where WebGPU is not available.
wgpu = { version = "29.0.3", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "WebSocket",
    "BinaryType",
    "Window",
    "Document",
    "Element",
    # The server->host leg (streamed buses, buffer replies) and the bulk fetch.
    "MessageEvent",
    "Response",
] }
