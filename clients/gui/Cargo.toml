# Independent workspace: this crate is intentionally NOT a member of the root
# `clausters` workspace. It is the GUI client track under `clients/gui` and must
# never entangle the core server build. Building from `clients/gui/` uses this
# manifest; building the core from the repo root ignores it.
[workspace]

[package]
name = "clausters-gui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Exploratory GUI client track for Clausters: a GPU waveform prototype and the widget-protocol design."

[lib]
name = "clausters_gui"
path = "src/lib.rs"

# Binaries are auto-discovered from src/bin/ (waveform, spectrogram, and the
# headless GUI host `clausters-gui`).

[features]
# Standalone mode: boot a saved GuiDef bundle against an in-process embedded
# server. Off by default because it links the `clausters` server crate (engine +
# audio backend), which is heavy — keeping it opt-in is the size/packaging reason
# the gui is a separate crate. Build with `cargo build --features standalone`.
standalone = ["dep:clausters"]

[dependencies]
# The shared OSC seam (single `decode_packet` door, encode/bundle/message,
# timetag math) the host's transports ride. A path dependency on the core: it
# pulls only `rosc`, so the default gui build stays light.
clausters-core = { path = "../../crates/clausters-core" }
# The full server crate, linked ONLY under the `standalone` feature for the
# in-process embedded server (`host::embed`). `embed` exposes the in-process
# `Clausters` API; `realtime` brings the audio backend. Default features off so
# the standalone build does not also pull MIDI/PipeWire. A normal gui build never
# compiles this.
clausters = { path = "../..", default-features = false, features = ["embed", "realtime"], optional = true }
# GuiDef = JSON inside one OSC argument, exactly as a SynthDef/GraphDef. serde's
# number handling keeps ids i32 and control values f32 across the wire.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logging, like the server (the host logs the parsed tree).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.13"

# Read-only mmap of the audio server's shared-memory segment, for zero-message
# meters/scopes (`host::shm`). Unix-only — the same raw-mmap path the server's
# IPC uses, and the server's segment is itself Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
