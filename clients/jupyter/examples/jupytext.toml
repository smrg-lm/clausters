# Pair every example here with a notebook of the same name.
#
# The `.py` is the authored form and the one in git: it diffs, it reviews, and
# it is what the rest of this project's examples look like. The `.ipynb` beside
# it is generated, so it is git-ignored -- an editor's file rather than a
# second copy of the example.
#
# With this in place JupyterLab syncs the two in both directions: open either,
# edit either, and the other follows on save. Regenerate the notebooks after
# pulling with, from this directory:
#
#     ../../../.venv/bin/jupytext --sync nb_*.py
#
# The `percent` format is the `# %%` cell convention these files already use
# (VS Code's and Jupyter's), so nothing about them had to change to be paired.

formats = "py:percent,ipynb"

# Keep the metadata out of the `.py`. Paired without this, jupytext writes
# fourteen lines of its own bookkeeping -- including a pinned jupytext_version
# that churns on every upgrade -- above the docstring, in files whose whole
# convention is that the docstring is the first thing read. The notebook is the
# generated half, so that is where the kernel belongs.
notebook_metadata_filter = "-all"
