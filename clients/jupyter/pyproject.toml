[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausters-jupyter"
version = "0.8.1"
description = "The Clausters GUI in a Jupyter notebook cell"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
dependencies = [
    # Lockstep with the repo: this package vendors the web client built from
    # the same tag, so the wheel's version is the version of the wasm in it.
    "clausters==0.8.1",
    "anywidget>=0.9",
]

[project.urls]
Homepage = "https://github.com/smrg-lm/clausters"

[tool.setuptools.packages.find]
include = ["clausters_jupyter*"]

[tool.setuptools.package-data]
# The vendored web client: staged by scripts/refresh-web.sh, not built here.
clausters_jupyter = ["_web/**/*", "static/*.js"]
