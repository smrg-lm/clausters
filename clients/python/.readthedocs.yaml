# Read the Docs build for the Clausters Python client documentation.
#
# This repository hosts TWO documentation sites (one per platform); each is a
# separate Read the Docs project pointing at its own config file via the
# project's "Settings > Advanced > Path to configuration file":
#   - the server/workspace book -> repo-root .readthedocs.yaml      (builds docs/)
#   - this Python client book   -> clients/python/.readthedocs.yaml (this file)
#
# Read the Docs has no native mdBook builder, so the build is driven with
# build.commands: fetch a prebuilt mdBook, generate the API page with
# pydoc-markdown, build the book, and copy the HTML into $READTHEDOCS_OUTPUT/html.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install pydoc-markdown
    - mkdir -p "$HOME/bin"
    - |
      MDBOOK_VERSION=0.4.40
      curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/bin"
    - bash -c "cd clients/python && pydoc-markdown"
    - "$HOME/bin/mdbook build clients/python/docs"
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -r clients/python/docs/book/. "$READTHEDOCS_OUTPUT/html/"
