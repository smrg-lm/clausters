[build-system]
# `wheel` for the platform-tagged wheel (the package ships compiled cdylibs;
# see setup.py). cargo builds the cdylibs themselves, outside pip. setuptools>=77
# for PEP 639: the SPDX `license` expression and the `license-files` key below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausters"
version = "0.8.0"
description = "High-level Python client for the Clausters audio server (Faust-first)."
readme = "README.md"
# 3.11 for the standard-library `tomllib`, used by `clausters.config` to read
# the shared TOML config file (also Read the Docs' pinned version).
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# Ship the full license text in the wheel (PEP 639 -> .dist-info/licenses/).
license-files = ["COPYING"]
authors = [{ name = "Lucas Samaruga" }]
# Stdlib only at runtime: the native core is reached through ctypes over the
# `clausters-ffi` cdylib (and the embed/shm transports over `clausters`), both
# built by cargo, not pip. A numpy user can wrap the returned `array('f')`
# without it ever being a dependency here.
dependencies = []

# The PyPI sidebar: without these the published page links nowhere, and the
# books are effectively unreachable (they do not surface in search on their own).
[project.urls]
Documentation = "https://clausters-python.readthedocs.io/"
"Server documentation" = "https://clausters.readthedocs.io/"
Source = "https://github.com/smrg-lm/clausters"
Issues = "https://github.com/smrg-lm/clausters/issues"

# `clausters` on the PATH: runs the bundled standalone server binary (a separate
# networked / shared-memory server). The in-process embedded server needs no
# command — it is imported (`clausters.Clausters`).
[project.scripts]
clausters = "clausters._cli:main"

# Development-only dependencies (PEP 735): the test runner. Not part of the
# published package — install with `pip install --group dev` (or `uv sync`).
[dependency-groups]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["clausters", "clausters.base", "clausters.seq", "clausters.defs", "clausters.form", "clausters.gui"]

# The cargo-built artifacts that build_native.py stages into the package: the
# cdylibs in _libs/ (embedded server / numeric core), libfaust and the libLLVM it
# JITs with (also _libs/, so a FaustDef compiles on a machine with neither
# installed) and the two binaries in _bin/ — the standalone server (run via the
# `clausters` console-script) and the `clausters-gui` visual server (launched by
# `Session.gui`). Bundled in the wheel so an installed package is self-contained:
# server, Faust and GUI, no separate install. The `.so*` glob is deliberate:
# versioned sonames (libfaust.so.2, libLLVM.so.21.1) are what the loader asks for.
#
# libverovio (the `score` widget's engraver) is covered by the same `.so` glob;
# `_libs/verovio/**` is its SMuFL resource data, which has to travel with it —
# verovio bakes its resource path in at build time, so a staged copy is told
# where its data is at runtime. Thousands of one-glyph files, hence the
# recursive glob.
[tool.setuptools.package-data]
clausters = ["_libs/*.so", "_libs/*.so.*", "_libs/*.dylib", "_libs/*.dll", "_bin/*",
             "_libs/verovio/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
