# pydoc-markdown configuration for the Clausters Python client API reference.
#
# It reads the package source *statically* (docspec parses the AST; it does not
# import the modules), so the API page is generated without building or loading
# any native cdylib. Run it from this directory:
#
#   cd clients/python && pydoc-markdown      # writes docs/src/api.md
#
# Only the public modules are listed. The private loaders and wire helpers
# (_native, _osclib, _libpath, _midi, _oscinterface, _midiinterface) are
# intentionally excluded. The output is plain Markdown -- no Sphinx directives.
loaders:
  - type: python
    search_path: ["."]
    modules:
      - clausters
      - clausters.play
      - clausters.plot
      - clausters.render
      - clausters.scope
      - clausters.session
      - clausters.responders
      - clausters.bundle
      - clausters.ipc
      - clausters.errors
      - clausters.base
      - clausters.base.builtins
      - clausters.base.absobject
      - clausters.base.stream
      - clausters.base.clock
      - clausters.base.timebase
      - clausters.base.netaddr
      - clausters.base.main
      - clausters.seq
      - clausters.seq.event
      - clausters.seq.pattern
      - clausters.seq.eventstream
      - clausters.seq.timeline
      - clausters.defs
      - clausters.defs.expr
      - clausters.defs.signals
      - clausters.defs.boxes
      - clausters.defs.ugens
      - clausters.defs.asdef
      - clausters.defs.faustdef
      - clausters.defs.synthdef
      - clausters.defs.graphdef
      - clausters.defs.server
      - clausters.defs.node
      - clausters.defs.bus
      - clausters.defs.buffer
      - clausters.defs.clocksync
      - clausters.form
      - clausters.form.element
      - clausters.form.group
      - clausters.form.render
      - clausters.gui
      - clausters.gui.guidef
      - clausters.gui.editor
      - clausters.gui.host
      - clausters.gui.notation
      - clausters.gui.transport
processors:
  - type: filter
    documented_only: true
    exclude_private: true
    exclude_special: true
    skip_empty_modules: true
  - type: smart
# No `crossref` processor, deliberately. It rewrites `#name` into a cross
# reference, and these docstrings are plain Markdown with no cross-reference
# syntax at all (see CLAUDE.md), so it had nothing to resolve -- while it did
# corrupt every hex color literal: `"#rrggbb[aa]"` came out as ``"`rrggbb`[aa]"``,
# dropping the `#` and injecting backticks inside an existing code span, which
# left the published reference documenting the wrong color format. There is no
# way to escape a `#` for it (the pattern is `\B\#`, exempting only Markdown
# anchor links). Removing it changed nothing else in the generated page.
renderer:
  type: markdown
  filename: docs/src/api.md
  render_toc: true
  render_toc_title: "API reference"
  insert_header_anchors: true
  descriptive_class_title: false
  add_method_class_prefix: true
