# pydoc-markdown configuration for the Clausters Python client API reference.
#
# It reads the package source *statically* (docspec parses the AST; it does not
# import the modules), so the API pages are generated without building or
# loading any native cdylib.
#
# The modules are not listed here: the reference is one page per package, and
# docs/gen_api.py runs pydoc-markdown once per page with that page's modules on
# the command line (`-m`), writing docs/src/api/<package>.md. Run that script,
# not pydoc-markdown alone. The output is plain Markdown -- no Sphinx directives.
loaders:
  - type: python
    search_path: ["."]
processors:
  - type: filter
    documented_only: true
    exclude_private: true
    exclude_special: true
    skip_empty_modules: true
  - type: smart
# No `crossref` processor, deliberately. It rewrites `#name` into a cross
# reference, and these docstrings are plain Markdown with no cross-reference
# syntax at all (see CLAUDE.md), so it had nothing to resolve -- while it did
# corrupt every hex color literal: `"#rrggbb[aa]"` came out as ``"`rrggbb`[aa]"``,
# dropping the `#` and injecting backticks inside an existing code span, which
# left the published reference documenting the wrong color format. There is no
# way to escape a `#` for it (the pattern is `\B\#`, exempting only Markdown
# anchor links). Removing it changed nothing else in the generated page.
renderer:
  type: markdown
  # No filename: the page goes to stdout, and gen_api.py writes it under its
  # package's title.
  render_toc: true
  render_toc_title: ""
  insert_header_anchors: true
  descriptive_class_title: false
  add_method_class_prefix: true
