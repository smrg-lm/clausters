# mdBook configuration for the Clausters Python client documentation.
#
# The book sources live in `src/`; `src/SUMMARY.md` is the table of contents.
# The API reference pages `src/api/` are *generated* from the package docstrings
# by pydoc-markdown (see ./gen_api.py and ./build.sh) and are git-ignored
# along with the build output `book/`.
#
# Build locally with `./build.sh` (generates the API page, then runs mdbook).
# This is a separate book from the server/workspace documentation in the repo's
# root `docs/` (built by the root book.toml): two books, one per platform,
# cross-linked. See ../.readthedocs.yaml for the Read the Docs build.

[book]
title = "clausters - Python client"
authors = ["Lucas Samaruga"]
description = "High-level Python client for the Clausters audio server (Faust-first)."
src = "src"
language = "en"

[build]
build-dir = "book"

# Names in backticks in the hand-written pages become links into the API
# reference (api_links.py, over the table gen_api.py writes). Without the
# table -- mdbook run before gen_api.py -- the pages pass through unchanged.
# The command finds the script through the book's root, which mdBook passes in
# the context it writes to stdin: mdBook runs it from wherever mdBook itself was
# run (the repository root on CI and Read the Docs, clients/python locally).
[preprocessor.api-links]
command = """python3 -c "import json, sys; sys.argv[1:2] == ['supports'] and sys.exit(0); d = json.load(sys.stdin); sys.path.insert(0, d[0]['root']); import api_links; api_links.run(d)" """

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/smrg-lm/clausters"

# The API reference is a page per module, about a hundred: the sidebar opens one
# level (the packages and the top-level modules) and each package unfolds on
# demand.
[output.html.fold]
enable = true
level = 1
