# The errors the client books' code blocks are known to have, each with why
# it stands. book_blocks.py fails on any error not named here, and on an
# entry here that no longer fails.
#
# `chapter` is the file the block is in, `code` a piece of the line the
# checker points at, `error` its TS code (web), and `language = "python"` for
# the Python book's.

# The harness's limits: a block uses a variable made in another section of
# its page, which book_blocks.py declares as `any`.

[[known]]
chapter = "docs/src/bundles.md"
code = "text.length"
error = "TS18046"
reason = "`b` is the Bundle of the page's first section; read as `any`, its files() answers unknown values"

