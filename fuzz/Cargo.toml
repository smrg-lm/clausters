# Fuzzing harness for the network edge (cargo-fuzz / libFuzzer).
#
# Not a workspace member (see `[workspace]` below): the root workspace should
# never build a target that links the libFuzzer runtime. *Running* the fuzzer
# needs nightly (`cargo +nightly fuzz run <target>`, for -Zsanitizer), but the
# crate itself checks and lints on stable, which is what the commit hook does
# when a commit touches this directory. See `docs/contributing.md` ("Fuzzing").
[package]
name = "clausters-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
clausters-core = { path = "../crates/clausters-core" }

[[bin]]
name = "decode_packet"
path = "fuzz_targets/decode_packet.rs"
test = false
doc = false
bench = false

[workspace]
