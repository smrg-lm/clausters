[package]
name = "clausters-editing"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "The projections an editable structure owes its three endpoints: the props a host draws it with, the payloads an edit becomes, and the operations that make a server sound it. One implementation, bound by every client and linked by the host."

[features]
# **The roll's notation mode** (`notes::notation`): a gesture read by the
# rules of notation and its performance derived from the page, which is the
# document's notation layer. Off by default, as the document's is; the
# applications turn it on wherever a score is edited.
notation = ["dep:clausters-notation", "clausters-document/notation"]

[dependencies]
# The drawing and numeric rules a projection is built out of -- a curve's axis,
# the mixer's defs, the tempo map.
clausters-core = { path = "../clausters-core" }
# The notation model, for the `notation` feature alone.
clausters-notation = { path = "../clausters-notation", optional = true }
# The model every projection is a projection *of*: the piece, its picture and
# what an edit means. The rule this crate exists for is that the document
# describes and does not encode -- so the dependency runs this way and never
# back.
clausters-document = { path = "../clausters-document" }
# Flat data at the boundary: a projection's answer is JSON, because that is what
# a prop payload and an OSC argument already are. The instance projection has
# state that crosses too -- the operations a client applies, and what it made of
# the last ones -- so it derives rather than hand-writing that shape.
serde = { workspace = true }
serde_json = { workspace = true }
