# Envelopes, lines and the done actions that end a synth.
#
# The `env` builders of both clients: each `[[ugen]]` is generated into
# `clients/python/clausters/defs/ugens/_generated/env.py` and
# `clients/web/src/defs/ugens/_generated/env.ts` by
# `crates/clausters-server/tests/ugen_builders.rs`, which reads its
# signature from the registry and its documentation from here. Each
# `[[hand]]` is a kind whose builder is written by hand in the client's
# `env` module, and why. That test's documentation has the format.

[[ugen]]
kind = "FreeSelf"
builder = "free_self"
required = ["signal"]
doc = '''
Frees the enclosing synth while `signal` is greater than zero, passing
it through unchanged. The trigger-driven counterpart of a `DoneAction` --
use it when what ends the note is not the envelope.
'''

[[ugen]]
kind = "PauseSelf"
builder = "pause_self"
required = ["signal"]
doc = '''
Pauses the enclosing synth while `signal` is greater than zero, passing
it through. Resume with `Server.run`; it re-pauses only if the signal is
still up, so this is a gate rather than a one-way door.
'''

[[ugen]]
kind = "Done"
builder = "done"
required = ["source"]
doc = '''
1 once `source` has finished, 0 before -- a trigger the rest of the
graph can read.

`source` must be a ugen that *can* finish (`env_gen`, `line`, `x_line`);
the server rejects the def by name otherwise. What it reads is the done
flag, not the value on the wire: an envelope that has played out sits at
its final level, which tells you nothing.
'''

[[ugen]]
kind = "FreeSelfWhenDone"
builder = "free_self_when_done"
required = ["source"]
doc = '''
Passes `source` through and frees the synth once it has finished. The
idiom for an envelope whose own `done_action` is `DoneAction.NONE`
because something else in the graph still needs it.
'''

[[hand]]
kind = "EnvGen"
why = "the `Env` leads, where its flattened array trails on the wire"

[[hand]]
kind = "DetectSilence"
why = "`done_action` is a `DoneAction`"

[[hand]]
kind = "Line"
why = "`done_action` is a `DoneAction`"

[[hand]]
kind = "EnvShape"
why = "`shape` is a curve's name, resolved here"

[[hand]]
kind = "XLine"
why = "`done_action` is a `DoneAction`"
