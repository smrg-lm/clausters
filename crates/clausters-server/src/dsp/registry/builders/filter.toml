# Filters, delays and smoothers: what a signal is put through.
#
# The `filter` builders of both clients: each `[[ugen]]` is generated into
# `clients/python/clausters/defs/ugens/_generated/filter.py` and
# `clients/web/src/defs/ugens/_generated/filter.ts` by
# `crates/clausters-server/tests/ugen_builders.rs`, which reads its
# signature from the registry and its documentation from here. Each
# `[[hand]]` is a kind whose builder is written by hand in the client's
# `filter` module, and why. That test's documentation has the format.

[[ugen]]
kind = "LPF"
builder = "lpf"
required = ["signal"]
doc = '''
Second-order Butterworth lowpass: -3 dB at `freq`, -12 dB/octave.
'''

[[ugen]]
kind = "HPF"
builder = "hpf"
required = ["signal"]
doc = '''
Second-order Butterworth highpass: -3 dB at `freq`, -12 dB/octave.
'''

[[ugen]]
kind = "OnePole"
builder = "one_pole"
required = ["signal"]
doc = '''
`y[n] = (1-|coef|)*x[n] + coef*y[n-1]` -- lowpass for a positive
coefficient, highpass for a negative one, unity in the passband.

The parameter is the **pole**, not a cutoff, as in sclang. Use `lag` when
what you want is a time constant.
'''

[[ugen]]
kind = "OneZero"
builder = "one_zero"
required = ["signal"]
doc = '''
`y[n] = (1-|coef|)*x[n] + coef*x[n-1]` -- the zero-only sibling of
`one_pole`.
'''

[[ugen]]
kind = "LeakDC"
builder = "leak_dc"
required = ["signal"]
doc = '''
Removes DC: a zero exactly at 0 Hz with a pole just inside it. The
default corner is low enough to leave audio untouched.
'''

[[ugen]]
kind = "Integrator"
builder = "integrator"
required = ["signal"]
doc = '''
Leaky accumulator, `y[n] = x[n] + coef*y[n-1]`. The coefficient is
clamped just inside 1 on the server, so it always forgets eventually
instead of running away on a DC input.
'''

[[ugen]]
kind = "Lag"
builder = "lag"
required = ["signal"]
doc = '''
One-pole smoother: `signal` lagged over `time` seconds (symmetric);
`time` 0 passes through. The same UGen the server inserts for a lagged
control -- use it directly to smooth any signal.
'''

[[ugen]]
kind = "VarLag"
builder = "var_lag"
required = ["signal"]
doc = '''
One-pole smoother with separate rise (`up`) and fall (`down`) times.
'''

[[ugen]]
kind = "BufDelayN"
builder = "buf_delay_n"
required = ["bufnum", "chan", "signal"]
doc = '''
`delay_n` over a channel of a pool buffer.
'''

[[ugen]]
kind = "BufDelayL"
builder = "buf_delay_l"
required = ["bufnum", "chan", "signal"]
doc = '''
`delay_l` over a channel of a pool buffer.
'''

[[ugen]]
