builder = "buf_comb_n"
required = ["bufnum", "chan", "signal"]
doc = '''
`comb_n` over a channel of a pool buffer.
'''

[[ugen]]
kind = "BufCombL"
builder = "buf_comb_l"
required = ["bufnum", "chan", "signal"]
doc = '''
`comb_l` over a channel of a pool buffer.
'''

[[ugen]]
kind = "BufCombC"
builder = "buf_comb_c"
required = ["bufnum", "chan", "signal"]
doc = '''
`comb_c` over a channel of a pool buffer.
'''

[[ugen]]
kind = "BufAllpassN"
builder = "buf_allpass_n"
required = ["bufnum", "chan", "signal"]
doc = '''
`allpass_n` over a channel of a pool buffer.
'''

[[ugen]]
kind = "BufAllpassL"
builder = "buf_allpass_l"
required = ["bufnum", "chan", "signal"]
doc = '''
`allpass_l` over a channel of a pool buffer.
'''

[[ugen]]
kind = "BufAllpassC"
builder = "buf_allpass_c"
required = ["bufnum", "chan", "signal"]
doc = '''
`allpass_c` over a channel of a pool buffer.
'''

