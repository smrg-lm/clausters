[package]
name = "clausters-web"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The engine's JS door: a thin wasm-bindgen shell over the clausters server crate (SynthDef family, no Faust/cpal) for running the engine in the browser."

[lib]
# cdylib is what wasm-bindgen consumes to emit the .wasm + JS bindings; rlib
# lets native cargo tests exercise the same shell functions.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine itself, lean: the SynthDef family plus the embed seam (the
# in-memory ring segment and the render entry). No cpal, no libfaust, no
# midir — the browser has none of them; the AudioWorklet is the backend.
clausters = { path = "../..", default-features = false, features = [
    "synth",
    "embed",
] }

# The JS binding surface only exists on the wasm target, so the native
# workspace build stays free of wasm machinery.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
