[package]
name = "clausters-midi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Reusable MIDI file I/O for clausters clients and server: a flat-data C ABI (POD in, malloc'd file bytes out) over a Standard MIDI File writer (midly). The MIDI 2.0 Clip File (midi2-clip) is the planned full-resolution follow-up."

[lib]
# cdylib is the binding surface (libclausters_midi.so/.dylib/.dll); rlib lets
# the in-crate tests link the same functions. Same pattern as clausters-ffi.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-Rust Standard MIDI File reader/writer, no system dependency.
midly = "0.5"
