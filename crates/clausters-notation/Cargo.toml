[package]
name = "clausters-notation"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "The notation model of Clausters: the symbolic score and its edits, the MEI encoder and reader, and the walk from an engraving to the display list a host draws. Pure Rust and wasm-safe; the engraver is a port a binding implements."

[dependencies]
# Exact duration arithmetic (`ratio`), what an event's notation keys mean
# (`event`) and the tempo map a score's tempo marks build.
clausters-core = { path = "../clausters-core" }
# roxmltree reads an engraving's SVG and an MEI document (a read-only DOM, no
# writer), and regex parses the SVG's transforms and glyph references.
roxmltree = "0.20"
regex = "1"
# The display list, the score's edits and their answers cross every binding
# as JSON.
serde = { workspace = true }
serde_json = { workspace = true }
