[package]
name = "clausters-document"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "The Clausters document: the single authoritative model of a composition -- the tree of elements and their placements, shared by every client and by the standalone GUI host."

[dependencies]
# The document is a serde tree: it is the normative format, and every client
# round-trips against it rather than holding handles into it. `serde_json` is
# what carries a leaf's configuration, which the document transports and never
# interprets -- see the crate docs on why a leaf is opaque.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`, and it is not optional: a payload that leaves the pile for
# the spill store is written as JSON and read back, and serde_json's default
# parser is a fast approximation -- so a span of samples came back a few ulps
# from where it went, and an undo wrote values nobody had ever had. The same
# parser reads every document a session saved, so exactness is the format's
# concern before it is the history's.
serde_json = { version = "1", features = ["float_roundtrip"] }
