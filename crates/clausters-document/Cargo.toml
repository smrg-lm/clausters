[package]
name = "clausters-document"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "The Clausters document: the single authoritative model of a multitrack -- the tree of elements and their placements, shared by every client and by the standalone GUI host."

[features]
# A score rendered into a sequence (`events::score`): the one place this crate
# reads the notation layer, which is a feature of the core's. Off by default,
# since a sequence needs none of it; on wherever a score is edited.
notation = ["dep:clausters-notation"]

[dependencies]
# The document is a serde tree: it is the normative format, and every client
# round-trips against it rather than holding handles into it. `serde_json` is
# what carries a leaf's configuration, which the document transports and never
# interprets -- see the crate docs on why a leaf is opaque.
serde = { workspace = true }
# `float_roundtrip`, and it is not optional: a payload that leaves the pile for
# the spill store is written as JSON and read back, and serde_json's default
# parser is a fast approximation -- so a span of samples came back a few ulps
# from where it went, and an undo wrote values nobody had ever had. The same
# parser reads every document a session saved, so exactness is the format's
# concern before it is the history's.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The node system: `multitrack::nodes` says what a piece is as nodes and
# groups, which means it needs the tempo map that turns a beat into a second
# (`clausters_core::tempomap`) and the def and port names a piece is wired with
# (`clausters_core::mixer`). Both are the shared rule rather than a second one,
# which is the whole reason to depend on it instead of restating them here.
clausters-core = { path = "../clausters-core" }
# The notation model, for the `notation` feature alone.
clausters-notation = { path = "../clausters-notation", optional = true }
# A sequence taken in with ids that repeat is repaired, and the repair is
# logged: renumbering an event is a reading of the data the data did not make,
# so it is said where whoever runs the program reads (`events::ids`).
tracing = { workspace = true }
