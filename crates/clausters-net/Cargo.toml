[package]
name = "clausters-net"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "The stream transports of clausters: OSC over TCP (length-prefixed) and over WebSocket (one packet per binary message), with the hub that turns the connections into one event queue. Linked by the audio server and the GUI host, so both fronts have one implementation of each carrier."

[dependencies]
tracing = "0.1"

# The WebSocket carrier. Synchronous, no async runtime: the handshake and the
# frame codec over a std `TcpStream`, matching the thread-per-connection model
# of the TCP carrier. Default features only (no TLS): `ws://`, not `wss://`.
# Target-gated off wasm32 (its `rand` pulls `getrandom`, which cannot build
# there) -- a page is a WebSocket client, never a server.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.21"
