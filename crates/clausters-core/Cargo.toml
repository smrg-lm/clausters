[package]
name = "clausters-core"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared native core for Clausters: numeric builtins, seeded RNG and timing/OSC math, used by the server and every client binding."

[features]
# The pure half of the notation layer (off by default): the verovio-SVG ->
# display-list walk and the voice -> MEI encoder, the format-agnostic parts a
# JS/wasm client reuses. The native libverovio binding lives in the separate
# `clausters-notation` crate; this feature is only the wasm-safe logic. Pulls
# an XML reader, a regex engine and JSON so the walk and the encoder compile.
notation = ["dep:roxmltree", "dep:regex", "dep:serde_json"]

[dependencies]
# Only the `osc` module needs it; the builtins/rng/tempoclock hot paths are
# dependency-free and allocation-free so the audio thread can call them.
rosc = "0.11"
# The `notation` feature only (all wasm-safe, pure Rust): roxmltree reads the
# verovio SVG (a single read-only DOM, no writer), regex parses its transforms
# and glyph refs exactly as the Python original did, and serde_json serializes
# the display list the FFI hands back size-then-fill.
roxmltree = { version = "0.20", optional = true }
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# The `fft` module's forward real FFT, shared by the GUI spectrogram and the
# server's coming FFT/IFFT UGens. `no_std` and zero-allocation (compile-time
# power-of-two sizes), so a real-time caller never allocates. The default
# `size-4096` covers the STFT window sizes; a small, task-specific dep tree.
microfft = "0.6"
# The `config` module's deserialize derives. Agnostic (compiles on wasm); the
# TOML parser that reads the files is native-only, gated below.
serde = { version = "1", features = ["derive"] }

# Reading config is a native-only, startup-time concern (a browser host never
# touches the filesystem), so the TOML parser is gated off `wasm32` to keep the
# wasm build lean — the config structs themselves are agnostic and compile
# everywhere.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = "0.8"
