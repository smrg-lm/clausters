[package]
name = "clausters-core"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared native core for Clausters: numeric builtins, seeded RNG and timing/OSC math, used by the server and every client binding."

[dependencies]
# Only the `osc` module needs it; the builtins/rng/tempoclock hot paths are
# dependency-free and allocation-free so the audio thread can call them.
rosc = "0.11"
# The `numeric` module's special functions (`erf`, `tgamma`, the Bessel
# functions), which std does not have: an established implementation rather
# than one written here.
libm = "0.2"
# The `bundle` module's format is JSON -- a manifest, a GuiDef template whose
# props are arbitrary values -- so the resolver reads and writes `Value`
# directly.
serde_json = { workspace = true }
# The `fft` module's real FFT, both directions, shared by the GUI
# spectrogram and the server's spectral UGens. `no_std` and zero-allocation
# (compile-time power-of-two sizes), so a real-time caller never allocates.
# The sizes run from 64 to 32768, scsynth's range for an `FFT`: the feature is
# `size-32768`, not the `size-16384` that microfft 0.6 gates its 32768-point
# real FFT behind: the sine table that transform reads is the one
# `size-32768` selects, and under `size-16384` it indexes past the smaller
# table (an out-of-bounds panic at 32768, found by the round-trip test).
microfft = { version = "0.6", default-features = false, features = ["size-32768"] }
# The `config` module's deserialize derives. Agnostic (compiles on wasm); the
# TOML parser that reads the files is native-only, gated below.
serde = { workspace = true }

# Reading config is a native-only, startup-time concern (a browser host never
# touches the filesystem), so the TOML parser is gated off `wasm32` to keep the
# wasm build lean -- the config structs themselves are agnostic and compile
# everywhere.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = "0.8"
