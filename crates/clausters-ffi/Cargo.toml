[package]
name = "clausters-ffi"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "C ABI over clausters-core: the language-agnostic surface every client binding (Python ctypes now, JS N-API/wasm later) sits on."

[lib]
# cdylib is the binding surface (libclausters_ffi.so/.dylib/.dll); rlib lets
# the in-crate tests link the same functions.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The notation layer's pure half (the SVG -> display-list walk, the voice -> MEI
# encoder): logic every client shares, so no binding reimplements it. Off by
# default, exactly as in the core it forwards to.
notation = ["clausters-core/notation"]
# The engraver and the editable score on top of it — this one links libverovio,
# so it stays opt-in the way the Faust family does in the server. The Python
# reference wheel turns it on (clients/python/build_native.py).
verovio = ["notation", "dep:clausters-notation", "clausters-notation/verovio"]

[dependencies]
clausters-core = { path = "../clausters-core" }
# The native half of the notation layer (libverovio); `verovio` only.
clausters-notation = { path = "../clausters-notation", optional = true }
# The patcher cord->bus pass crosses as JSON (the flat-data boundary): a Patch
# in, its Compiled wiring out.
serde_json = "1"
# WebSocket *client* transport (`clausters_ws_*`): the same crate the server's
# `osc::ws` listener uses, here for the client side, so the protocol has one
# implementation. Non-optional: every binding can reach a `--ws` server without
# a second WebSocket implementation. Default features only (handshake, no TLS):
# we speak `ws://`, not `wss://`.
tungstenite = "0.21"
