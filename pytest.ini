# What `pytest` collects when it is run from the repo root.
#
# Without this file there is no configuration up here, so pytest takes the root
# as its rootdir and walks everything under it -- including `third_party/`,
# where the vendored Faust source carries test suites of its own. They are not
# ours, they are not expected to pass, and one of them (py2max's) writes to a
# relative `outputs/` directory, which is how ~40 Max/MSP patches once appeared
# in the workspace root. The directories are git-ignored, which is exactly why
# the collection was surprising: nothing showed up in `git status` to explain it.
#
# The Python in this repo is the client, and its own configuration lives in
# clients/python/pyproject.toml -- still the one that applies when pytest is run
# from there, since the closest config wins. This mirrors it for the root.
[pytest]
pythonpath = clients/python clients/jupyter
testpaths = clients/python/tests clients/jupyter/tests
# Replaces pytest's defaults, so the useful ones are repeated here.
norecursedirs = third_party target book .venv *.egg .* _darcs build CVS dist node_modules
