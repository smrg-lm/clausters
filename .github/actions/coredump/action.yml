# Core-dump capture for the intermittent Faust SIGILL (docs/decisions.md).
#
# Used twice per job. Called with no input it *arms* dumping: it points
# kernel.core_pattern at a plain file (the runner default pipes to apport,
# which is not installed, so cores would vanish) and installs gdb. Called with
# `analyze: true` in an `if: failure()` step it *reports*: for every core it
# finds, the signal, the faulting instruction at $pc and the full backtrace of
# every thread, printed to the log and uploaded as an artifact.
#
# The one question this exists to answer: is the trapping instruction `ud2`
# (an optimizer-planted trap), a non-baseline instruction (a JIT target
# problem), or garbage (a jump into freed memory)? Each points somewhere
# different, and no amount of reasoning substitutes for reading it.
#
# The steps must run in the SAME job as the failing command, and that command
# needs `ulimit -c unlimited` in its own shell -- a limit set in another step
# does not carry over.

name: coredump
description: Arm core dumps, or analyze the cores left by a failed step.

inputs:
  analyze:
    description: "true to report on existing cores instead of arming capture."
    required: false
    default: "false"
  name:
    description: Artifact name suffix, to keep parallel jobs from colliding.
    required: false
    default: cores

runs:
  using: composite
  steps:
    - name: Arm core dumps
      if: inputs.analyze != 'true'
      shell: bash
      run: |
        sudo mkdir -p /cores
        sudo chmod 777 /cores
        # %e executable, %p pid, %s the fatal signal.
        sudo sysctl -w kernel.core_pattern='/cores/core.%e.%p.sig%s'
        sudo sysctl -w kernel.core_uses_pid=1
        sudo apt-get update
        sudo apt-get install -y gdb
        echo "core_pattern = $(cat /proc/sys/kernel/core_pattern)"

    - name: Analyze cores
      if: inputs.analyze == 'true'
      shell: bash
      run: |
        shopt -s nullglob
        cores=(/cores/core.*)
        if [ ${#cores[@]} -eq 0 ]; then
          echo "No core dumps: this failure was not a fatal signal."
          exit 0
        fi
        for core in "${cores[@]}"; do
          echo "::group::$core"
          # The binary name is embedded in the core file name (%e).
          exe=$(gdb -q -batch -c "$core" 2>/dev/null \
                | sed -n "s/.*Core was generated by \`\([^ ']*\).*/\1/p" | head -1)
          echo "executable guess: ${exe:-<unknown>}"
          gdb -q -batch \
              -ex "set pagination off" \
              -ex "info registers rip" \
              -ex "echo \n=== faulting instruction ===\n" \
              -ex "x/4i \$pc" \
              -ex "echo \n=== backtrace (all threads) ===\n" \
              -ex "thread apply all bt" \
              ${exe:+"$exe"} "$core" 2>&1 | tail -200
          echo "::endgroup::"
        done

    - uses: actions/upload-artifact@v4
      if: inputs.analyze == 'true'
      with:
        name: coredump-${{ inputs.name }}
        path: /cores
        if-no-files-found: ignore
        retention-days: 7
