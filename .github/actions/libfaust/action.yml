# Make libfaust (LLVM backend) available under a prefix, cheaply and shared.
#
# Restores it from the Actions cache; on a miss it builds it from source with
# the vendored, reproducible recipe (third_party/build-faust.sh, pinned by
# third_party/faust.pin) and stages the libLLVM that libfaust JITs with *beside*
# libfaust.so in `<prefix>/lib`. build.rs writes a DT_RPATH of `<prefix>/lib`
# (and `--disable-new-dtags` keeps it an RPATH, inherited by transitive deps),
# so a job that only restores this cache resolves both libfaust and its libLLVM
# through that rpath — no LLVM runtime has to be installed on the consuming
# machine. This is the same self-contained arrangement the Python wheel ships.
#
# The pinned commit and LLVM version come from third_party/faust.pin (the single
# source of truth, read here into the cache key too), so there is nothing to
# keep in sync in the callers. Used by ci.yml (a `libfaust` job populates the
# cache; every faust-linking job restores it) and release.yml. Bump the cache
# `-vN` suffix if the staged layout changes; edit faust.pin to upgrade the
# commit or the LLVM version (either changes the key and rebuilds).
name: Set up libfaust
description: Restore, or build and cache, libfaust with the LLVM backend and its libLLVM staged beside it.

inputs:
  prefix:
    description: Install prefix; libfaust lands in <prefix>/lib, headers in <prefix>/include/faust.
    required: true

runs:
  using: composite
  steps:
    - name: Read the Faust pin
      shell: bash
      run: |
        set -euo pipefail
        . "$GITHUB_WORKSPACE/third_party/faust.pin"
        echo "FAUST_SHA=$FAUST_SHA" >> "$GITHUB_ENV"
        echo "FAUST_LLVM_VERSION=$FAUST_LLVM_VERSION" >> "$GITHUB_ENV"

    - name: Restore the libfaust install
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.prefix }}/lib/libfaust*
          ${{ inputs.prefix }}/lib/libLLVM*
          ${{ inputs.prefix }}/include/faust
          ${{ inputs.prefix }}/share/faust
        key: libfaust-${{ env.FAUST_SHA }}-llvm${{ env.FAUST_LLVM_VERSION }}-${{ runner.os }}-v3

    - name: Build libfaust from source (vendored recipe) and stage its libLLVM
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The pinned LLVM (faust.pin) is newer than the distro default, so pull
        # it from apt.llvm.org for the current Ubuntu codename.
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${FAUST_LLVM_VERSION} main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y cmake make g++ zlib1g-dev pkg-config "llvm-${FAUST_LLVM_VERSION}-dev"
        # One recipe, shared with local dev and release: fetch the pin, build the
        # dynamic libfaust.so, install into the prefix, stage libLLVM beside it.
        # A throwaway source tree keeps the repo checkout clean.
        FAUST_PREFIX="${{ inputs.prefix }}" FAUST_SRC="$RUNNER_TEMP/faust-src" \
          "$GITHUB_WORKSPACE/third_party/build-faust.sh"
