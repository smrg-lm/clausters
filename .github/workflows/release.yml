# Release: on a version tag (v*), build the self-contained Python wheel
# (client + embedded server + standalone server binary, see clients/python/
# setup.py) and the standalone server binary, publish the wheel to PyPI and
# the web client to npm, and attach the wheel and the binary to a GitHub
# release. The three artifacts carry ONE version -- the repository's SemVer --
# so they are cut by the same tag rather than each on its own schedule.
#
# PyPI auth is Trusted Publishing (OIDC): the PyPI project `clausters` must
# list this repository/workflow as a trusted publisher and the repo must have
# a `pypi` environment (see docs/contributing.md, "Releases"). No API token
# is stored.
#
# npm auth is an automation token in the `npm` environment's NPM_TOKEN secret,
# not OIDC: npm's own trusted publishing is configured per package, on a
# package that already exists in the registry, so a token is what can create
# one. The tarball carries provenance, which is what needs id-token: write.
#
# Linux x86_64 only for now; adding macOS/Windows wheels is a matter of
# extending the build matrix once those targets are verified by hand.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # `faust` is a default feature, so the wheel and the standalone server both
  # link libfaust and the wheel bundles it (+ its libLLVM). The pinned commit
  # and LLVM version live in third_party/faust.pin, read by the libfaust composite.
  FAUST_PREFIX: /home/runner/.local
  # The engraver behind the `score` widget, bundled for the same reason: an
  # installed wheel must engrave and edit notation with nothing else on the
  # machine. Nothing links it (the client binds it with ctypes), but it has to
  # exist here to be staged. Pinned in third_party/verovio.pin.
  VEROVIO_PREFIX: /home/runner/.local
  # Refuse every CLAUSTERS_SKIP_*: a release ships the whole package or nothing.
  # Each skip drops a piece that only fails at the *user's* run time -- the
  # `score` widget, a def family -- and publishing is one-way, so a silent skip
  # here is a broken release on PyPI.
  CLAUSTERS_REQUIRE_COMPLETE: "1"

jobs:
  build:
    name: wheel + server binary (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # libfaust for the default build; the composite restores the same cache
      # CI populates (caches are shared repo-wide from the default branch), and
      # builds it from source on a miss. build_native stages libfaust + libLLVM
      # out of <prefix>/lib into the wheel.
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}
      # libverovio, staged into the wheel the same way. Cheap on a cache hit and
      # independent of the Rust build -- nothing in the workspace links it.
      - uses: ./.github/actions/verovio
        with:
          prefix: ${{ env.VEROVIO_PREFIX }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel (release profile; wheel-only, see note)
        # No sdist: the package builds cdylibs from the Rust workspace, which
        # an sdist of clients/python would not contain.
        working-directory: clients/python
        run: |
          pip install build
          python -m build --wheel
      - name: Package the standalone server binary
        run: |
          cargo build --release
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C target/release -czf "clausters-server-${VERSION}-linux-x86_64.tar.gz" clausters
      - uses: actions/upload-artifact@v6
        with:
          name: wheel
          path: clients/python/dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: server-binary
          path: clausters-server-*.tar.gz

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    # Gated on the npm leg, not merely on the wheel build: publishing is
    # one-way, so the release either goes out whole or not at all. A web build
    # that breaks after the wheel is on PyPI cannot be taken back, and it is
    # the npm side that carries the long, uncached wasm build -- the one with
    # something to fail at. The order between the two registries is arbitrary;
    # what matters is that one of them is a gate.
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: publish the web client to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-wasm
      # The three wasm bundles are staged by a wasm-bindgen CLI that must be the
      # exact version the lockfiles pin (the glue they exchange is a private
      # format). Taken as the prebuilt release binary rather than
      # `cargo install`, which would rebuild it on every run.
      - name: The pinned wasm-bindgen CLI
        run: |
          PIN=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          echo "staging wasm-bindgen $PIN"
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${PIN}/wasm-bindgen-${PIN}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/bin" \
              "wasm-bindgen-${PIN}-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # build.sh compiles the engine, the GUI host and the core's JS door to
      # wasm, stages the bundles into dist/ and emits src/ -> dist/. The
      # checker then refuses a tree that is missing either half, or a version
      # that disagrees with the crate's -- one release, one version.
      - name: Build the package
        working-directory: clients/web
        run: |
          npm ci
          ./build.sh
          npm run check-package
      - name: Publish
        working-directory: clients/web
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
