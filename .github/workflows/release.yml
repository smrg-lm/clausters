# Release: on a version tag (v*), build the self-contained Python wheel
# (client + embedded server + standalone server binary, see clients/python/
# setup.py) and the standalone server binary, publish the wheel to PyPI and
# the web client to npm, and attach the wheel and the binary to a GitHub
# release. The three artifacts carry ONE version -- the repository's SemVer --
# so they are cut by the same tag rather than each on its own schedule.
#
# PyPI auth is Trusted Publishing (OIDC): the PyPI project `clausters` must
# list this repository/workflow as a trusted publisher and the repo must have
# a `pypi` environment (see docs/contributing.md, "Releases"). No API token
# is stored.
#
# npm auth is an automation token in the `npm` environment's NPM_TOKEN secret,
# not OIDC: npm's own trusted publishing is configured per package, on a
# package that already exists in the registry, so a token is what can create
# one. The tarball carries provenance, which is what needs id-token: write.
#
# Linux x86_64 only for now; adding macOS/Windows wheels is a matter of
# extending the build matrix once those targets are verified by hand.
#
# Nothing publishes before `verify` passes. A tag is not a proof: it can sit on
# a commit whose CI is red, or that CI never ran on at all, and publishing is
# one-way in exactly the way the CLAUSTERS_REQUIRE_COMPLETE rule below already
# recognizes -- that rule keeps an *incomplete* package off PyPI, and this gate
# keeps a *broken* one off. It also runs the eight feature-matrix
# configurations CI does not cover (see the job's own comment), which is the
# one place they become automatic instead of remembered.

name: Release

# The manual trigger is a dry run of the gate, and only of the gate: `verify`
# runs exactly as it would for a release, and every job that builds or
# publishes an artifact is skipped, so the workflow can be proved on Actions
# without a tag and without anything reaching a registry. A tag is one-way; the
# job that guards it should not be first exercised by the run it guards.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `faust` is a default feature, so the wheel and the standalone server both
  # link libfaust and the wheel bundles it. The pinned commit
  # and LLVM version live in third_party/faust.pin, read by the libfaust composite.
  FAUST_PREFIX: /home/runner/.local
  # The engraver behind the `score` widget, bundled for the same reason: an
  # installed wheel must engrave and edit notation with nothing else on the
  # machine. Nothing links it (the client binds it with ctypes), but it has to
  # exist here to be staged. Pinned in third_party/verovio.pin.
  VEROVIO_PREFIX: /home/runner/.local
  # Refuse every CLAUSTERS_SKIP_*: a release ships the whole package or nothing.
  # Each skip drops a piece that only fails at the *user's* run time -- the
  # `score` widget, a def family -- and publishing is one-way, so a silent skip
  # here is a broken release on PyPI.
  CLAUSTERS_REQUIRE_COMPLETE: "1"

jobs:
  # The gate every other job hangs off. Two halves, both of them things no
  # other automation does for the commit being published:
  #
  #  - `check.sh` -- the fmt + clippy + rustdoc matrix. CI covers five of its
  #    fifteen configurations (the two fmts, and the workspace/gui/default
  #    clippy runs); the other ten -- clippy under neither def family, `synth`
  #    alone, `faust` alone, clausters-ffi with `verovio`, the featureless build
  #    with no libfaust to link, and all five rustdoc builds -- were, until this
  #    job, run only by a maintainer who remembered
  #    to; they are what `check.sh --fast` runs. Once per release is
  #    the right frequency for them: they are slow, they rarely break, and the
  #    moment being wrong is unrecoverable is this one. It only ever reads --
  #    it is a gate, not a formatter, and it never gets a --fix pass.
  #  - `cargo test` on the default set and on `+embed`, the same two runs CI's
  #    test-default job makes, against the exact commit the tag points at.
  #
  # Deliberately NOT re-run here: the libfaust-free test combos, the GUI/wasm
  # gate and the Python suite. Those are CI's per-push job and duplicating them
  # would double an already long release for little: the failure this gate
  # exists to catch is a tag on an unverified commit, and a compile or lint
  # error under any configuration surfaces in the runs above.
  verify:
    name: verify the tagged commit (tests + the full feature matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Job-scoped, and it must stay that way. Virtualized runners misreport
      # their CPU features, so a host-tuned Faust JIT hits an illegal
      # instruction here (the same reason ci.yml sets this workflow-wide; see
      # docs/decisions.md). The build and publish jobs below leave it unset on
      # purpose -- what ships must be host-tuned for the user's real machine.
      CLAUSTERS_FAUST_TARGET: "x86_64-unknown-linux-gnu:x86-64"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The matrix builds `faust` alone and the default set, both of which link
      # libfaust; the composite restores the same cache CI populates.
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify
      # Every configuration runs even when an earlier one fails, and the script
      # exits non-zero if any did -- so one run reports the whole picture
      # instead of stopping at the first break.
      - name: The fmt + clippy + rustdoc matrix
        run: .claude/skills/feature-matrix/check.sh
      # Mirrors ci.yml's test-default invocation, including --test-threads=1 and
      # the coredump capture: this is the run that has historically produced the
      # Faust SIGILL, and a release failing here is exactly when the dump is
      # worth having.
      - uses: ./.github/actions/coredump
      - run: ulimit -c unlimited && cargo test --workspace -- --test-threads=1
      - run: ulimit -c unlimited && cargo test --workspace --features embed -- --test-threads=1
      - uses: ./.github/actions/coredump
        if: failure()
        with:
          analyze: "true"
          name: verify

  build:
    name: wheel + server binary (linux x86_64)
    needs: verify
    # Tag pushes only -- see the workflow_dispatch note above. The three jobs
    # below carry the same guard rather than relying on a skipped `needs:`
    # propagating: what must not run on a dry run is stated where it would run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # libfaust for the default build; the composite restores the same cache
      # CI populates (caches are shared repo-wide from the default branch), and
      # builds it from source on a miss. build_native stages libfaust out of
      # <prefix>/lib into the wheel.
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}
      # libverovio, staged into the wheel the same way. Cheap on a cache hit and
      # independent of the Rust build -- nothing in the workspace links it.
      - uses: ./.github/actions/verovio
        with:
          prefix: ${{ env.VEROVIO_PREFIX }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel (release profile; wheel-only, see note)
        # No sdist: the package builds cdylibs from the Rust workspace, which
        # an sdist of clients/python would not contain.
        working-directory: clients/python
        run: |
          pip install build
          python -m build --wheel
      - name: Package the standalone server binary
        run: |
          cargo build --release
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C target/release -czf "clausters-server-${VERSION}-linux-x86_64.tar.gz" clausters
      - uses: actions/upload-artifact@v6
        with:
          name: wheel
          path: clients/python/dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: server-binary
          path: clausters-server-*.tar.gz

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    # Gated on the npm leg, not merely on the wheel build: publishing is
    # one-way, so the release either goes out whole or not at all. A web build
    # that breaks after the wheel is on PyPI cannot be taken back, and it is
    # the npm side that carries the long, uncached wasm build -- the one with
    # something to fail at. The order between the two registries is arbitrary;
    # what matters is that one of them is a gate.
    needs: [build, publish-npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: publish the web client to npm
    # Behind `verify` on its own account, not merely by sitting after `build`:
    # this job publishes, and it is the one leg that does not depend on the
    # wheel build, so without this it would be the way an unverified commit
    # reached a registry.
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-wasm
      # The three wasm bundles are staged by a wasm-bindgen CLI that must be the
      # exact version the lockfiles pin (the glue they exchange is a private
      # format). Taken as the prebuilt release binary rather than
      # `cargo install`, which would rebuild it on every run.
      - name: The pinned wasm-bindgen CLI
        run: |
          PIN=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          echo "staging wasm-bindgen $PIN"
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${PIN}/wasm-bindgen-${PIN}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/bin" \
              "wasm-bindgen-${PIN}-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # The two vendored wasm artifacts build.sh stages beside its own: the
      # Faust compiler a page JITs defs with and the engraver it lays scores
      # out with. Built from the same pins the native libraries use, because
      # neither has a usable published build (the composite says why). Without
      # this step build.sh prints its two "note: vendor/... missing" lines and
      # publishes a package with no compiler and no engraver -- which is what
      # check-package now refuses.
      - uses: ./.github/actions/wasm-vendor
      # build.sh compiles the engine, the GUI host and the core's JS door to
      # wasm, stages the bundles into dist/ and emits src/ -> dist/. The
      # checker then refuses a tree that is missing either half, or a version
      # that disagrees with the crate's -- one release, one version.
      - name: Build the package
        working-directory: clients/web
        run: |
          npm ci
          ./build.sh
          npm run check-package
      - name: Publish
        working-directory: clients/web
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release assets
    # Behind both registries, for the reason publish-pypi is behind npm: the
    # release page is the announcement, and announcing a release whose
    # packages are not installable is worse than announcing it late.
    needs: [build, publish-npm, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
