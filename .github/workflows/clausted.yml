# clausted: the standalone Python editor under clausted/ (Tauri 2 + Svelte 5).
#
# A workflow of its own rather than a job in ci.yml, for the `paths` filter:
# clausted shares no code with the server, the clients or the host, so a change
# anywhere else cannot break it and a change to it cannot break them. It runs
# only when clausted/ (or this file) changes, and ci.yml never builds it.
#
# `npm run build` is the frontend's compile check, as svelte-check is its type
# check. The cargo steps are debug builds, which point Tauri at the dev server
# instead of embedding `dist/`, so they do not depend on it.

name: clausted

on:
  push:
    branches: [main]
    paths:
      - "clausted/**"
      - ".github/workflows/clausted.yml"
  pull_request:
    paths:
      - "clausted/**"
      - ".github/workflows/clausted.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: frontend + fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clausted
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Tauri's Linux build deps (WebKitGTK 4.1 and friends), as in the README.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clausted/src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --check
        working-directory: clausted/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: clausted/src-tauri
      - run: cargo test
        working-directory: clausted/src-tauri
