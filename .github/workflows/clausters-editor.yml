# clausters-editor: the code editor, crates/clausters-editor.
#
# The crate is a member of the workspace, so ci.yml builds, lints and tests
# its Rust with the rest, checks its library for wasm32 and builds its page
# (the `web` job). This workflow keeps what is the editor's alone: the
# session's driver (Python, spoken to as a subprocess), the third-party
# notices, the Python wheel, and the page's npm lockfile against the
# advisory databases. It runs only when the crate (or this file) changes.
#
# The weekly schedule runs the `audit` job alone: an advisory is published
# against a lockfile nobody touched, so it is checked between changes too, the
# way audit.yml checks the rest of the project's lockfiles.

name: clausters-editor

on:
  push:
    branches: [main]
    paths:
      - "crates/clausters-editor/**"
      - ".github/workflows/clausters-editor.yml"
      - "third_party/verovio.pin"
  pull_request:
    paths:
      - "crates/clausters-editor/**"
      - ".github/workflows/clausters-editor.yml"
      - "third_party/verovio.pin"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: driver + notices
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: crates/clausters-editor
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # The driver, spoken to as a subprocess.
      - run: python3 -m unittest discover -s python -p 'test_*.py'
      # The third-party notices follow the dependencies: a lockfile change that
      # adds or bumps a crate or a package of the page without regenerating
      # them fails here. Pinned, since another cargo-about may word the same
      # licenses differently. The page's dependencies are read installed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: npm ci
        working-directory: crates/clausters-editor/page
      # libverovio's license is read from its pinned source, which a checkout
      # does not carry (third_party/verovio is ignored, and the composite
      # restores only the built library): the one file, at the pinned commit.
      - name: libverovio's license, from the pinned source
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          . third_party/verovio.pin
          mkdir -p third_party/verovio
          curl -fsSL "$VEROVIO_ORIGIN/raw/$VEROVIO_SHA/COPYING.LESSER" \
            -o third_party/verovio/COPYING.LESSER
      - run: node scripts/notices.mjs --check

  # The Python package (`pip install clausters-editor`, or clausters[editor]).
  # Built on the oldest Ubuntu the runners offer, since the wheel's manylinux
  # tag is the build machine's glibc: a wheel built here runs on every
  # distribution since. It carries libverovio, the score editor's engraver,
  # restored or built by the composite the client's jobs use. Kept as an
  # artifact; publishing it is a release step.
  wheel:
    name: Python wheel (manylinux_2_35)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    env:
      VEROVIO_PREFIX: /home/runner/.local
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev clang
      - uses: ./.github/actions/verovio
        with:
          prefix: ${{ env.VEROVIO_PREFIX }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: editor-wheel
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel crates/clausters-editor/wheel
      - uses: actions/upload-artifact@v6
        with:
          name: clausters-editor-wheel
          path: crates/clausters-editor/wheel/dist/*.whl

  # The page's lockfile against the advisory databases. Only vulnerabilities
  # fail, and npm audit skips devDependencies, which build the page and are
  # not shipped in it. The crates are the workspace's, which audit.yml checks.
  audit:
    name: npm audit (the page)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: crates/clausters-editor/page
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm audit --omit=dev
