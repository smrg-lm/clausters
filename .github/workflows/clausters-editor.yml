# clausters-editor: the standalone Python editor under clausters-editor/ (Tauri 2 + Svelte 5).
#
# A workflow of its own rather than a job in ci.yml, for the `paths` filter:
# clausters-editor shares no code with the server, the clients or the host, so a change
# anywhere else cannot break it and a change to it cannot break them. It runs
# only when clausters-editor/ (or this file) changes, and ci.yml never builds it.
#
# `npm run build` is the frontend's compile check, as svelte-check is its type
# check. The cargo steps are debug builds, which point Tauri at the dev server
# instead of embedding `dist/`, so they do not depend on it.
#
# The weekly schedule runs the `audit` job alone: an advisory is published
# against a lockfile nobody touched, so it is checked between changes too, the
# way audit.yml checks the rest of the project's lockfiles.

name: clausters-editor

on:
  push:
    branches: [main]
    paths:
      - "clausters-editor/**"
      - ".github/workflows/clausters-editor.yml"
  pull_request:
    paths:
      - "clausters-editor/**"
      - ".github/workflows/clausters-editor.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: frontend + fmt + clippy + test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: clausters-editor
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Tauri's Linux build deps (WebKitGTK 4.1 and friends), as in the README.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clausters-editor/src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The third-party notices follow the dependencies: a lockfile change that
      # adds or bumps a package without `npm run notices` fails here. Pinned,
      # since another cargo-about may word the same licenses differently.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: npm run notices -- --check
      - run: cargo fmt --check
        working-directory: clausters-editor/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: clausters-editor/src-tauri
      - run: cargo test
        working-directory: clausters-editor/src-tauri

  # The Python package (`pip install clausters-editor`, or clausters[editor]).
  # Built on the oldest Ubuntu with WebKitGTK 4.1, since the wheel's manylinux
  # tag is the build machine's glibc: a wheel built here runs on every
  # distribution that has the library. Kept as an artifact; publishing it is
  # a release step.
  wheel:
    name: Python wheel (manylinux_2_35)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clausters-editor/src-tauri
      - name: Build the wheel
        working-directory: clausters-editor
        run: |
          npm ci
          pip install build
          python -m build --wheel wheel
      - uses: actions/upload-artifact@v6
        with:
          name: clausters-editor-wheel
          path: clausters-editor/wheel/dist/*.whl

  # Both lockfiles against the advisory databases. Only vulnerabilities fail:
  # cargo audit passes on unmaintained, unsound and yanked crates and prints
  # them, and npm audit skips devDependencies, which build the app and are not
  # shipped in it.
  audit:
    name: cargo audit + npm audit
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: clausters-editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: npm audit --omit=dev
