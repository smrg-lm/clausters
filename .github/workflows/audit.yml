# Dependency audit: every lockfile of the project against the public advisory
# databases -- RustSec for the two Cargo workspaces, the npm registry's for the
# web client. The Python client declares no runtime dependencies, so it has
# nothing to audit; clausters-editor audits its own lockfiles in
# clausters-editor.yml.
#
# A workflow of its own rather than a job in ci.yml for the schedule: an
# advisory is published against a lockfile nobody touched, so a check that runs
# only on a push says nothing about the weeks between pushes. It runs weekly,
# on demand, and on any push or pull request that moves a lockfile.
#
# Only vulnerabilities fail a job. cargo audit prints unmaintained, unsound and
# yanked crates as warnings and passes; read them in the log. npm audit skips
# devDependencies (--omit=dev): the gate is what a user installs, and a build
# tool's advisory is not one of those.
#
# The `stable` job is here for the same schedule and the same reason: a new
# rustc is published against a tree nobody touched. The toolchain is pinned
# (rust-toolchain.toml), so a release can no longer turn the tree red on its
# own, and this job is how the tree hears of one: weekly and on demand it runs
# fmt, clippy and the libfaust-free tests against the newest stable. When it
# goes red, raise the pin and fix what the new compiler reports, in one commit.
# It never runs on a push, so it cannot fail a change that did nothing wrong.

name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "clients/gui/Cargo.lock"
      - "clients/web/package-lock.json"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "clients/gui/Cargo.lock"
      - "clients/web/package-lock.json"
      - ".github/workflows/audit.yml"

jobs:
  cargo:
    name: cargo audit (${{ matrix.lockfile }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        lockfile: [Cargo.lock, clients/gui/Cargo.lock]
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file ${{ matrix.lockfile }}

  npm:
    name: npm audit (clients/web)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm audit --omit=dev
        working-directory: clients/web

  stable:
    name: the newest stable toolchain (fmt + clippy + tests)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          toolchain: stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: stable-canary
          workspaces: |
            .
            clients/gui
      - run: bash third_party/prepare-clap.sh
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path clients/gui/Cargo.toml
      # Without libfaust: the server with the SynthDef family, and every crate
      # but the two wasm ones, which link the Faust family (see ci.yml's `test`
      # job for why they sit out a libfaust-free run).
      - run: cargo clippy --workspace --all-targets --no-default-features --features synth --exclude clausters-web --exclude clausters-nrt-web -- -D warnings
      - run: cargo clippy --all-targets --manifest-path clients/gui/Cargo.toml -- -D warnings
      - run: cargo test --workspace --no-default-features --features synth --exclude clausters-web --exclude clausters-nrt-web
