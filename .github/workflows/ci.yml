# Continuous integration: the checks CLAUDE.md / docs/contributing.md require
# by hand, automated. Jobs mirror the local commands one-to-one so a red job
# is reproducible locally with the same line.
#
# The `faust` job builds libfaust from source (the reproducible recipe in
# third_party/BUILD-FAUST.md) pinned to the same commit verified locally, and
# caches the ~/.local install; a cache hit makes the job cheap. Bump
# FAUST_SHA (and the cache `-vN` suffix on rebuild-without-SHA-change) to
# upgrade.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (workspace + gui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps (cpal/midir/pipewire build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            clients/gui
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path clients/gui/Cargo.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --all-targets --manifest-path clients/gui/Cargo.toml -- -D warnings

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The def-family build matrix from CLAUDE.md: the core must compile
        # and test with any combination of `synth`/`faust` and without
        # `embed`. The faust combos live in the `faust` job (they need
        # libfaust); `embed` rides on top of the default set here.
        include:
          - name: default
            flags: ""
          - name: no-features
            flags: --no-default-features
          - name: synth-only
            flags: --no-default-features --features synth
          - name: default+embed
            flags: --features embed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace ${{ matrix.flags }}

  gui:
    name: gui tests + wasm gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/gui
      - run: cargo test --manifest-path clients/gui/Cargo.toml
      # G11 browser-readiness gate: the agnostic host core must keep
      # compiling for wasm32 with the native I/O shell excluded.
      - name: wasm build gate
        working-directory: clients/gui
        run: ./check-wasm.sh

  python:
    name: python client (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev clang
      - uses: Swatinem/rust-cache@v2
      # Debug profile: the tests only need working cdylibs, not optimized ones.
      - name: Build and stage the native artifacts
        run: python clients/python/build_native.py --debug
      - run: pip install pytest
      - name: pytest
        working-directory: clients/python
        run: python -m pytest -q

  docs:
    name: mdBooks (server + python client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned like Read the Docs (pydoc-markdown's deps lag newest CPython).
          python-version: "3.12"
      - name: Install mdBook (same version as the Read the Docs builds)
        run: |
          mkdir -p "$HOME/bin"
          MDBOOK_VERSION=0.4.40
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: pip install pydoc-markdown
      - name: Server / workspace book
        run: mdbook build .
      - name: Python client book (pydoc-markdown API page + book)
        run: |
          cd clients/python
          pydoc-markdown
          mdbook build docs

  faust:
    name: cargo test --features faust (libfaust from source, cached)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The commit BUILD-FAUST.md verified (master-dev, "Set version to
      # 2.86.0"). Bump deliberately, together with a local re-verification.
      FAUST_SHA: 56c9e678d
      FAUST_PREFIX: /home/runner/.local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (incl. the libfaust build chain)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev clang \
            cmake make g++ llvm-dev zlib1g-dev
      - name: Cache the libfaust install
        id: faust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/libfaust*
            ~/.local/include/faust
            ~/.local/share/faust
          key: libfaust-${{ env.FAUST_SHA }}-${{ runner.os }}-v1
      - name: Build libfaust (LLVM backend) from source
        if: steps.faust-cache.outputs.cache-hit != 'true'
        run: |
          # Shallow fetch of the pinned commit + its submodules, then the
          # recipe from third_party/BUILD-FAUST.md (dynamic libfaust.so
          # against the system libLLVM, installed under ~/.local).
          git init faust-src
          cd faust-src
          git remote add origin https://github.com/grame-cncm/faust
          git fetch --depth 1 origin "$FAUST_SHA"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) make most \
            CMAKEOPT="-DINCLUDE_DYNAMIC=ON -DLINK_LLVM_STATIC=off -DLLVM_CONFIG=llvm-config"
          make install PREFIX="$HOME/.local"
          "$HOME/.local/bin/faust" --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: faust
      # Single-threaded: libfaust/LLVM is not safe for concurrent compilation
      # in one process (a known libfaust limitation; see CLAUDE.md).
      - run: cargo test --features faust -- --test-threads=1
