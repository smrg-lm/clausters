# Continuous integration: the checks CLAUDE.md / docs/contributing.md require
# by hand, automated. Jobs mirror the local commands one-to-one so a red job
# is reproducible locally with the same line.
#
# `faust` is a default feature, so every job that links the default build set
# (clippy, the default+embed tests, the Python client, and the standalone
# server) needs libfaust with the LLVM backend. A single `libfaust` job builds
# it from source through the vendored recipe (third_party/build-faust.sh, pinned
# by third_party/faust.pin) and caches the ~/.local install (LLVM is linked
# into libfaust, so that is one library); every downstream job `needs: libfaust`
# and restores that
# cache through the `.github/actions/libfaust` composite (a cache hit makes it
# free, and no LLVM runtime has to be installed to consume it). Edit faust.pin
# to upgrade the commit or LLVM version (either changes the cache key).
#
# libverovio works the same way (`.github/actions/verovio`, pinned by
# third_party/verovio.pin) but is needed by the `python` job alone: nothing in
# the Rust workspace links it -- the notation track is client-side, and the
# library is staged into the Python package and bound with ctypes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The pinned Faust commit and LLVM version live in third_party/faust.pin (the
  # single source of truth), read by the .github/actions/libfaust composite.
  # build.rs locates libfaust here (it also falls back to ~/.local on its own).
  FAUST_PREFIX: /home/runner/.local
  # Force the Faust LLVM JIT onto a baseline x86-64 target (host triple, generic
  # mcpu). Virtualized CI runners can misreport their CPU features, so host-tuned
  # JIT code hits an illegal instruction at run time on some Azure SKUs. A full
  # triple is needed (not just `:x86-64`): with an empty triple, newer LLVM still
  # host-detects the CPU features and re-introduces the crash. Unset in
  # production (wheel/server), so a real machine gets host-tuned code. See
  # docs/decisions.md.
  CLAUSTERS_FAUST_TARGET: "x86_64-unknown-linux-gnu:x86-64"

jobs:
  # Build libfaust once (or hit the cache) so the faust-linking jobs below can
  # just restore it. On a cold cache this is the long pole; downstream jobs
  # `needs: libfaust`, so they start only once the cache is warm.
  libfaust:
    name: build/cache libfaust (LLVM backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}

  lint:
    name: fmt + clippy (workspace + gui)
    needs: libfaust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # clippy --workspace lints the default build, which links libfaust.
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}
      - name: System deps (cpal/midir/pipewire build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            clients/gui
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path clients/gui/Cargo.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --all-targets --manifest-path clients/gui/Cargo.toml -- -D warnings

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The libfaust-free half of the def-family matrix from CLAUDE.md: the
        # core must compile and test with `synth` alone and with neither def
        # family. These need no libfaust, so they carry no `needs: libfaust`
        # and stay fast. The faust-linking combos (the full default set, and
        # `+embed` on top of it) live in the `test-default` job below.
        #
        # The two wasm crates sit out both rows, and that is the point of the
        # `--exclude`s rather than an oversight. Each depends on `clausters`
        # with `features = ["faust"]` -- for them `faust` is the def *family*
        # and the compiler is libfaust-wasm, no native library involved -- but
        # cargo unifies features across the workspace, so building them for the
        # *host* turns the family back into `-lfaust` and the libfaust-free run
        # fails to link on a runner that deliberately has no libfaust. What
        # CLAUDE.md and BUILD.md promise is the root crate's featureless build,
        # and that is what these rows check. The wasm crates are proved where
        # they are meant to run: `scripts/check-wasm.sh` checks all three
        # against wasm32 in the `gui` job.
        include:
          - name: no-features
            flags: --no-default-features --exclude clausters-web --exclude clausters-nrt-web
          - name: synth-only
            flags: --no-default-features --features synth --exclude clausters-web --exclude clausters-nrt-web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace ${{ matrix.flags }}

  gui:
    name: gui tests + wasm gates (host + engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # clients/gui links ALSA through midir (clausters-midi); the native
      # `cargo test` below needs libasound2-dev. The wasm gates need nothing.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Both workspaces: the host gate builds clients/gui, the engine gate
          # builds the root one.
          workspaces: |
            .
            clients/gui
      - run: cargo test --manifest-path clients/gui/Cargo.toml
      # G11 browser-readiness gate: the agnostic host core must keep
      # compiling for wasm32 with the native I/O shell excluded.
      - name: wasm build gate (GUI host)
        working-directory: clients/gui
        run: ./check-wasm.sh
      # The other two bundles clients/web/build.sh stages: the engine in its
      # browser-viable feature sets, and the shared core's codec. Without this
      # the web package's compile was proved nowhere before the release
      # workflow's publish-npm job -- a `#[cfg(unix)]` function called from a
      # Drop broke it on main, and every job here stayed green.
      - name: wasm build gate (engine + shared core)
        run: ./scripts/check-wasm.sh

  # The web acceptance smokes: the pages that only a browser can judge -- the
  # engine live in an AudioWorklet, a standalone bundle booting in a tab, a
  # bundle mounted as a custom element, and the two authored bundles whose
  # GuiDefs drive the engine with no page script at all. Each beacons a verdict
  # this reads out of an HTTP access log, and until now nothing ran any of them:
  # all three scripts that existed were broken at once and stayed that way,
  # while the two authored pages carried assertions that had never fired.
  #
  # Chrome comes preinstalled on the runner image (google-chrome-stable); the
  # script fails with a clear message if it ever stops being there.
  web:
    name: web smokes (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          # Both workspaces: build.sh compiles the engine and the core codec
          # from the root one and the GUI host from clients/gui.
          workspaces: |
            .
            clients/gui
          key: web-wasm
      # The same pinned CLI the release workflow stages, and for the same
      # reason: the glue wasm-bindgen exchanges with the crate is a private
      # format, so the versions must agree exactly.
      - name: The pinned wasm-bindgen CLI
        run: |
          PIN=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          echo "staging wasm-bindgen $PIN"
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${PIN}/wasm-bindgen-${PIN}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/bin" \
              "wasm-bindgen-${PIN}-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: npm install (build.sh emits the package with tsc)
        working-directory: clients/web
        run: npm ci
      # The two authored-bundle cases write their bundles with the Python
      # client, which the script puts on PYTHONPATH itself -- and builds
      # `clausters-ffi` for, since writing a bundle validates it through the
      # core's C ABI. That crate's default feature set is empty, so this needs
      # no libfaust and no libverovio: nothing here talks to a server, and the
      # full staged package (build_native) would be a job of its own.
      - name: The smokes
        run: ./scripts/smoke-web.sh

  python:
    name: python client (pytest)
    needs: libfaust
    runs-on: ubuntu-latest
    # Scoped to this job: it is the only one that stages the Python package, and
    # nothing in the Rust workspace links verovio. The pinned commit lives in
    # third_party/verovio.pin, read by the .github/actions/verovio composite.
    env:
      VEROVIO_PREFIX: /home/runner/.local
      # Refuse every CLAUSTERS_SKIP_*: this job stages a whole package or none.
      # A missing piece is invisible downstream -- the notation tests skip
      # themselves without an engraver, a def family only fails once someone
      # sends a def -- so the run would still come back green.
      CLAUSTERS_REQUIRE_COMPLETE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # build_native builds the default (faust) cdylibs and stages libfaust
      # into the package, and the FaustDef tests JIT-compile at runtime; all of
      # that needs libfaust restored here.
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}
      # libverovio, staged into the package by build_native too. Without it the
      # notation tests skip themselves, so a `score` widget that cannot engrave
      # would look exactly like a green run -- hence required, not optional.
      - uses: ./.github/actions/verovio
        with:
          prefix: ${{ env.VEROVIO_PREFIX }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
      # Debug profile: the tests only need working cdylibs, not optimized ones.
      - name: Build and stage the native artifacts
        run: python clients/python/build_native.py --debug
      - run: pip install pytest
      # Diagnostic for the intermittent Faust SIGILL (see docs/decisions.md):
      # capture the trapping instruction the next time it fires, so the cause
      # stops being guessed at.
      - uses: ./.github/actions/coredump
      - name: pytest
        working-directory: clients/python
        run: ulimit -c unlimited && python -m pytest -q
      - uses: ./.github/actions/coredump
        if: failure()
        with:
          analyze: "true"
          name: python

  # The three books, each built the way its own Read the Docs project builds
  # it -- same mdBook version, same generators, same commands. That equivalence
  # is the point: a book that breaks here would break there, and Read the Docs
  # only reports it after the push, on a checkout nobody is watching.
  docs:
    name: mdBooks (server + python + web clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Pinned like Read the Docs (pydoc-markdown's deps lag newest CPython).
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install mdBook (same version as the Read the Docs builds)
        run: |
          mkdir -p "$HOME/bin"
          MDBOOK_VERSION=0.4.40
          # `-f` and the retries: piped into tar, a 5xx or a rate-limit page
          # downloads as HTML and fails as "gzip: stdin: not in gzip format"
          # -- a red build blaming the books for a blip at the other end of
          # the wire. Read the Docs fetches it the same way.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: pip install pydoc-markdown
      - name: Server / workspace book
        run: mdbook build .
      - name: Python client book (pydoc-markdown API page + book)
        run: |
          cd clients/python
          pydoc-markdown
          mdbook build docs
      # TypeDoc parses with its own TypeScript, installed apart from the
      # package's; the package's own dev dependencies are installed because
      # its tsconfig asks for the `node` type library. No wasm and no Rust:
      # the parse is static, over the three declaration files the repository
      # carries. This mirrors clients/web/.readthedocs.yaml step for step.
      - name: Web client book (TypeDoc API pages + book)
        run: |
          npm install --no-save --prefix "$HOME/typedoc" \
            typedoc@0.28 typedoc-plugin-markdown@4 typescript@5.9
          cd clients/web
          npm ci
          "$HOME/typedoc/node_modules/.bin/typedoc"
          mdbook build docs

  # The faust-linking half of the def-family matrix: the full default set
  # (synth + faust + realtime/midi/pipewire/rtprio) and `+embed` on top of it.
  # Both link libfaust, restored from the shared cache.
  test-default:
    name: cargo test (default set + embed, faust)
    needs: libfaust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/libfaust
        with:
          prefix: ${{ env.FAUST_PREFIX }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-default
      # `-- --test-threads=1`: the faust compilation FFI is serialized in-process
      # by faust::ffi_lock(), but the historically-safe single-threaded run is
      # kept here as the authoritative default-set check. The default feature
      # set already includes faust, so a plain `cargo test --workspace` covers
      # the synth+faust combo; `--features embed` adds the embed layer on top.
      # Same SIGILL diagnostic as the python job (see docs/decisions.md): this
      # job is where the `auto_order` occurrence landed.
      - uses: ./.github/actions/coredump
      - run: ulimit -c unlimited && cargo test --workspace -- --test-threads=1
      - run: ulimit -c unlimited && cargo test --workspace --features embed -- --test-threads=1
      - uses: ./.github/actions/coredump
        if: failure()
        with:
          analyze: "true"
          name: test-default

  # The cost gate. CLAUDE.md's R-track invariant says a refactor closes with a
  # before/after bench; this is that step, done by the machine.
  #
  # It only runs on a pull request, because it is an A/B against the merge base
  # and a push to `main` has nothing to compare against. Both measurements are
  # taken in *this* job, on *this* runner, back to back: a shared runner swings
  # 10-20% between runs of identical code, so an absolute threshold against a
  # committed number would fire on the weather, while the ratio of two runs that
  # shared the machine and its thermal state means something. The cost is one
  # extra release build.
  #
  # No libfaust: the bench builds with `--no-default-features --features synth`,
  # so the Faust sections (whose numbers include whatever the LLVM JIT chose
  # that run, and which the gate never fails on) are simply not compiled in.
  #
  # Opt out with `[no-bench]` anywhere in the PR's head commit message — a
  # change that knowingly trades speed for something else should be able to say
  # so and move on.
  bench:
    name: cost gate (A/B against the merge base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Opt-out check
        id: optout
        run: |
          msg=$(git log -1 --pretty=%B "${{ github.event.pull_request.head.sha }}")
          if printf '%s' "$msg" | grep -qF '[no-bench]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "head commit says [no-bench]; the cost gate is skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # The merge base first, so the head's numbers are the ones taken on the
      # warmer machine -- if anything that biases *against* the head, which is
      # the safe direction for a gate. `|| true`: a base that predates the
      # bench's `--json` mode writes the human table instead, which the compare
      # step below detects and skips on rather than failing the PR that
      # introduces the gate.
      - name: Bench the merge base
        if: steps.optout.outputs.skip == 'false'
        run: |
          base=$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")
          echo "merge base: $base"
          git checkout --detach "$base"
          cargo run --release --no-default-features --features synth \
            --example bench -- --json > /tmp/base.json || true
      - name: Bench this branch
        if: steps.optout.outputs.skip == 'false'
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          cargo run --release --no-default-features --features synth \
            --example bench -- --json > /tmp/head.json
      - name: Compare
        if: steps.optout.outputs.skip == 'false'
        run: |
          if ! python3 -c "import json,sys; json.load(open('/tmp/base.json'))" 2>/dev/null; then
            echo "the merge base produced no machine-readable bench; nothing to"
            echo "compare against, so the gate passes. This is expected exactly"
            echo "once: on the pull request that adds --json."
            exit 0
          fi
          scripts/bench-gate.py /tmp/base.json /tmp/head.json
      - name: Keep both measurements
        if: always() && steps.optout.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: /tmp/*.json
