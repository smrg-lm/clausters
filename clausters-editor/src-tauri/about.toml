# The licenses the third-party notices accept, in order of preference: where
# a crate offers a choice ("MIT OR Apache-2.0"), the first one listed here is
# the one its notice carries. `scripts/notices.mjs` runs `cargo about` with it.
accepted = [
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "MPL-2.0",
]

# Every platform a release is built for, so the notices cover each package.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# What runs at build time is not shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The app itself is not third-party: it is `publish = false`, and so skipped.
private = { ignore = true }
