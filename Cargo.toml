[workspace]
# C0: the server crate is the workspace root (all existing paths stay put);
# the shared native core and its C ABI live under `crates/`. See clients/python/PLAN.md.
members = [
    "crates/clausters-core",
    "crates/clausters-core-web",
    "crates/clausters-document",
    "crates/clausters-ffi",
    "crates/clausters-midi",
    "crates/clausters-notation",
    "crates/clausters-web",
]
resolver = "3"

[package]
name = "clausters"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A real-time audio synthesis server in the style of SuperCollider's scsynth, controlled over OSC, with Faust JIT-compiled synth definitions."
# `documentation` points at the book, not at docs.rs (which builds the crate's
# rustdoc anyway): the book is what a user of the *server* needs, and without
# these links it does not surface in search.
documentation = "https://clausters.readthedocs.io/"
repository = "https://github.com/smrg-lm/clausters"
readme = "README.md"

[lib]
# The cdylib is the M14 embed surface (a versioned C ABI, see src/embed.rs);
# the rlib is everything else. Both build always; the C exports only exist
# with the `embed` feature.
crate-type = ["rlib", "cdylib"]

[features]
default = ["synth", "faust", "realtime", "midi", "pipewire", "rtprio"]
# The SynthDef family (scsynth-style UGen graphs): the UGen library, the def
# compiler (`/def_send synth`) and `UGenSynth`. Default. Independent from — and
# combinable with — `faust`: a custom build can ship either def family alone
# (e.g. `--no-default-features --features faust,realtime,midi` is a
# Faust-only server) or both. With neither, only the engine core remains
# (groups, buses, buffers, transports) and every `/synth_new` fails.
synth = []
# cpal backend. Can be disabled for tests/CI without an audio device.
realtime = ["dep:cpal"]
# M17 live MIDI input via midir (ALSA seq on Linux — the same system MIDI any
# DAW/controller uses; reuses the libasound cpal already links). Off in
# `--no-default-features` builds, which have no system audio/MIDI deps.
midi = ["dep:midir"]
# Route live MIDI through midir's JACK backend instead of ALSA on Linux/BSD.
# Needed on PipeWire systems: the ALSA-seq backend panics on the timestamp of
# events delivered through pipewire's seq bridge (midir's get_time().unwrap());
# the JACK backend uses the JACK clock and registers a first-class graph node.
# midir pulls jack-sys, whose build script requires `jack.pc` at build time on
# Linux: install `libjack-jackd2-dev` (headers + jack.pc). At runtime libjack
# resolves to pipewire-jack via its ld.so.conf.d entry, so MIDI still goes
# through PipeWire. The default `midi` feature keeps the ALSA backend.
midi-jack = ["midi", "midir/jack"]
# The FaustDef family: libfaust embedding (Signal/Box API + LLVM JIT, `/def_send faust`).
# Default — the two def families are peers, and a server that cannot compile a
# FaustDef is a partial product. The cost is a build dependency: it needs
# libfaust built with the LLVM backend (see BUILD.md for the recipe), located
# by build.rs through FAUST_PREFIX, falling back to ~/.local, then /usr/local.
# Drop it (`--no-default-features` plus the others) for a SynthDef-only server
# that builds with no libfaust on the system.
faust = []
# M14: the C ABI for embedding the server in-process (clausters_* exports).
embed = []
# Native PipeWire audio backend (Linux/BSD) via cpal's pipewire host. Default,
# since the target systems always ship PipeWire: `cpal::default_host()` prefers
# PipeWire, falling back to ALSA at runtime if it is unavailable, so no code
# change is needed. Building it needs the dev libs `libpipewire-0.3-dev`
# (pkg-config libpipewire-0.3/libspa-0.2) and `clang` (bindgen), and the binary
# then hard-links libpipewire (DT_NEEDED). Drop it with `--no-default-features`
# (plus `realtime,midi`) for a plain-ALSA build that runs without PipeWire.
pipewire = ["realtime", "cpal/pipewire"]
# Real-time scheduling for the audio callback thread. Default, because it is
# the standard operating mode of every production audio client on Linux
# (scsynth, JACK and PipeWire clients alike): without it the callback runs as
# SCHED_OTHER and scheduling jitter — not DSP throughput — breaks the audio
# at roughly half the machine's capacity. cpal promotes the thread to
# SCHED_FIFO/RR through RTKit over DBus (`audio_thread_priority`; build-dep
# `libdbus-1-dev` on Linux). The binary also arms a SIGXCPU guard so RTKit's
# RLIMIT_RTTIME watchdog can never kill the server: sustained >100% load
# demotes the audio thread back to SCHED_OTHER instead (the audio degrades,
# the server survives). Enables `--pin` (CPU affinity) and a boot-time log of
# the policy the thread actually got. All platform-specific code is isolated
# in `src/server/rt.rs` (no-op stubs off Linux); drop the feature (with
# `--no-default-features` plus the others) for a build with no DBus dep and
# no RT watchdog.
rtprio = ["realtime", "cpal/realtime-dbus"]

# The DSP benchmark drives UGen graphs directly (and Faust ones with the
# `faust` feature on top); it has no target in a build without the SynthDef
# family. Other examples are feature-neutral and stay auto-discovered.
[[example]]
name = "bench"
required-features = ["synth"]

[[example]]
name = "bench_transport"
required-features = ["synth"]

[dependencies]
# Shared native core: the single source of truth for the numeric builtins,
# the seeded RNG and the timing/OSC math that both the server and every
# client binding use, so client-side results match the server by construction.
clausters-core = { path = "crates/clausters-core" }
cpal = { version = "0.18", optional = true }
# WAV read/write: exact, supports int24, and what `/buffer_write` emits. Kept as the
# canonical WAV path; compressed/other formats decode through symphonia below.
hound = "3"
# Multi-format audio decoding for `/buffer_read`/`/buffer_allocRead` (FLAC, OGG/Vorbis,
# MP3, MP4/AAC, ALAC, AIFF, ...). Pure Rust, decode-only; WAV stays on hound.
symphonia = { version = "0.6", default-features = false, features = ["flac", "ogg", "vorbis", "mpa", "isomp4", "aac", "alac", "adpcm", "pcm", "wav", "aiff", "caf"] }
# M17: live MIDI I/O over the OS's standard MIDI (ALSA seq on Linux). Pure
# Rust over libasound (already pulled in by cpal); creates virtual ports.
midir = { version = "0.11", optional = true }
rosc = "0.11"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content checksum for the on-disk def cache (pure Rust, no C deps).
sha2 = "0.10"
# Leveled, target-filtered logging. The audio thread never logs (it reports via
# FIFOs to the network thread); the subscriber is installed only by the binary,
# so library/embed users keep their own. `env-filter` gives RUST_LOG + the
# runtime-reloadable filter the `/server_verbosity` OSC command swaps.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# WebSocket transport (`osc::ws`): a first-class carrier of the same OSC encoding
# beside UDP/TCP/shm — the one a browser can reach — so it is always built on
# native, like the TCP and shared-memory transports (not behind a feature).
# Synchronous, no async runtime: the handshake + frame codec over a std
# `TcpStream`, matching the thread-per-connection model `osc::tcp` uses. Default
# features only (handshake, no TLS): we serve `ws://`, not `wss://`. Target-gated
# off wasm32 (its `rand` pulls `getrandom`, which cannot build there): in the
# browser the engine *is* in the page, so a WebSocket server front is meaningless
# — the page pushes OSC bytes straight into the in-memory ring.
tungstenite = "0.21"

[target.'cfg(unix)'.dependencies]
# Only for mmap-ing the M14 shared-memory segment (already in the tree via
# cpal, so this adds no new download).
libc = "0.2"

[dev-dependencies]
assert_no_alloc = "1"
serde_json = "1"
