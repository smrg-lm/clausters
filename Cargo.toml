[workspace]
# C0: the server crate is the workspace root (all existing paths stay put);
# the shared native core and its C ABI live under `crates/`. See clients/PLAN.md.
members = ["crates/clausters-core", "crates/clausters-ffi", "crates/clausters-midi"]
resolver = "3"

[package]
name = "clausters"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
# The cdylib is the M14 embed surface (a versioned C ABI, see src/embed.rs);
# the rlib is everything else. Both build always; the C exports only exist
# with the `embed` feature.
crate-type = ["rlib", "cdylib"]

[features]
default = ["realtime", "midi", "pipewire"]
# cpal backend. Can be disabled for tests/CI without an audio device.
realtime = ["dep:cpal"]
# M17 live MIDI input via midir (ALSA seq on Linux — the same system MIDI any
# DAW/controller uses; reuses the libasound cpal already links). Off in
# `--no-default-features` builds, which have no system audio/MIDI deps.
midi = ["dep:midir"]
# Route live MIDI through midir's JACK backend instead of ALSA on Linux/BSD.
# Needed on PipeWire systems: the ALSA-seq backend panics on the timestamp of
# events delivered through pipewire's seq bridge (midir's get_time().unwrap());
# the JACK backend uses the JACK clock and registers a first-class graph node.
# midir pulls jack-sys, whose build script requires `jack.pc` at build time on
# Linux: install `libjack-jackd2-dev` (headers + jack.pc). At runtime libjack
# resolves to pipewire-jack via its ld.so.conf.d entry, so MIDI still goes
# through PipeWire. The default `midi` feature keeps the ALSA backend.
midi-jack = ["midi", "midir/jack"]
# libfaust embedding (Box API + LLVM JIT). Needs libfaust built with the LLVM
# backend; see build.rs for how the library is located (FAUST_PREFIX).
faust = []
# M14: the C ABI for embedding the server in-process (clausters_* exports).
embed = []
# Native PipeWire audio backend (Linux/BSD) via cpal's pipewire host. Default,
# since the target systems always ship PipeWire: `cpal::default_host()` prefers
# PipeWire, falling back to ALSA at runtime if it is unavailable, so no code
# change is needed. Building it needs the dev libs `libpipewire-0.3-dev`
# (pkg-config libpipewire-0.3/libspa-0.2) and `clang` (bindgen), and the binary
# then hard-links libpipewire (DT_NEEDED). Drop it with `--no-default-features`
# (plus `realtime,midi`) for a plain-ALSA build that runs without PipeWire.
pipewire = ["realtime", "cpal/pipewire"]

[dependencies]
# Shared native core: the single source of truth for the numeric builtins,
# the seeded RNG and the timing/OSC math that both the server and every
# client binding use, so client-side results match the server by construction.
clausters-core = { path = "crates/clausters-core" }
cpal = { version = "0.18", optional = true }
hound = "3"
# M17: live MIDI I/O over the OS's standard MIDI (ALSA seq on Linux). Pure
# Rust over libasound (already pulled in by cpal); creates virtual ports.
midir = { version = "0.11", optional = true }
rosc = "0.11"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content checksum for the on-disk def cache (pure Rust, no C deps).
sha2 = "0.10"
# Leveled, target-filtered logging. The audio thread never logs (it reports via
# FIFOs to the network thread); the subscriber is installed only by the binary,
# so library/embed users keep their own. `env-filter` gives RUST_LOG + the
# runtime-reloadable filter the `/verbosity` OSC command swaps.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# Only for mmap-ing the M14 shared-memory segment (already in the tree via
# cpal, so this adds no new download).
libc = "0.2"

[dev-dependencies]
assert_no_alloc = "1"
serde_json = "1"
