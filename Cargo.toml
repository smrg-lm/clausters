[workspace]
# The workspace is virtual: the root is no package, and every component is a
# member under `crates/`, the server (`crates/clausters-server`, the package
# `clausters`) among them.
members = [
    "crates/clausters-app-engine",
    "crates/clausters-apps",
    "crates/clausters-checks",
    "crates/clausters-core",
    "crates/clausters-core-web",
    "crates/clausters-document",
    "crates/clausters-editing",
    "crates/clausters-ffi",
    "crates/clausters-gui",
    "crates/clausters-gui-draw",
    "crates/clausters-midi",
    "crates/clausters-net",
    "crates/clausters-notation",
    "crates/clausters-verovio",
    "crates/clausters-plugin-host",
    "crates/clausters-server",
    "crates/clausters-nrt-web",
    "crates/clausters-web",
]
resolver = "3"
# What `cargo build`, `cargo test` and `cargo run` take with no `-p`: the
# server, as when it was the root package. Naming every member would unify
# their features onto it (the host turns `realtime` and `notation` on), which
# is what the def-family rows build without.
default-members = ["crates/clausters-server"]

# **The one place the package version is written.** Every crate carried the
# same number and nothing checked that they still agreed; they inherit it now
# (`version.workspace = true`), and the two manifests that cannot inherit --
# `pyproject.toml` and `package.json` are not Cargo's -- are written from here by `scripts/set-version.sh` and contrasted
# by `crates/clausters-checks/tests/versions.rs`. Bumping a release is editing this line and running
# that script; the rules for *which* number are the `release-versioning` skill's.
[workspace.package]
version = "0.11.0"

# What several crates of the workspace depend on, declared once: a member
# writes `name = { workspace = true }` and adds only what is its own (a
# feature, `optional`). A dependency one crate alone uses stays in its
# manifest.
[workspace.dependencies]
assert_no_alloc = "1"
js-sys = "0.3"
libc = "0.2"
midir = "0.11"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tungstenite = "0.21"
wasm-bindgen = "0.2"
web-time = "1.1"

# Line tables only in debug builds: a backtrace still names the file and the
# line, and the build directory is about two fifths smaller for it (the tests
# of two crates went from 605 MB to 370 MB). What is given up is reading a
# local variable in a debugger; a session that needs that sets
# `CARGO_PROFILE_DEV_DEBUG=full` for itself.
#
# The release profile is cargo's own. Thin link-time optimization with one
# codegen unit was measured with `crates/clausters-server/examples/bench.rs` and left out: the change
# in throughput stayed inside the run-to-run noise of the same build.
[profile.dev]
debug = "line-tables-only"
