[package]
name = "clausters"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["realtime"]
# cpal backend. Can be disabled for tests/CI without an audio device.
realtime = ["dep:cpal"]
# libfaust embedding (Box API + LLVM JIT). Needs libfaust built with the LLVM
# backend; see build.rs for how the library is located (FAUST_PREFIX).
faust = []

[dependencies]
cpal = { version = "0.15", optional = true }
hound = "3"
rosc = "0.10"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1"
serde_json = "1"
